{{- if not .Values.auth.existingSecret }}
{{- if not .Values.auth.adminPassword }}
{{ fail "auth.adminPassword or auth.existingSecret must be set — this chart ships no default admin password (image/entrypoint.sh refuses to start without one)." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openldap.adminSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.existingSecretKey }}: {{ .Values.auth.adminPassword | quote }}
{{- end }}
