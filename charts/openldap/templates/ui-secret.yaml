{{- if and .Values.ui.enabled (not .Values.ui.session.existingSecret) }}
{{- $secretName := printf "%s-session" (include "openldap.ui.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openldap.ui.labels" . | nindent 4 }}
type: Opaque
data:
  # Reuse the existing Secret's value across upgrades (via `lookup`) so
  # every rollout doesn't invalidate all live sessions. `lookup` only sees
  # the real cluster — a plain `helm template` render always generates a
  # fresh value here, which is expected for offline rendering.
  {{- if and $existing (hasKey $existing.data .Values.ui.session.existingSecretKey) }}
  {{ .Values.ui.session.existingSecretKey }}: {{ index $existing.data .Values.ui.session.existingSecretKey }}
  {{- else }}
  {{ .Values.ui.session.existingSecretKey }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
