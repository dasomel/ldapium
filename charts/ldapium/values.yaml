# Default values for ldapium.
# Every env var this chart sets maps 1:1 to image/entrypoint.sh (server) or
# ui/backend/internal/config/config.go (UI) — see charts/ldapium/README.md
# for the full mapping.

# -- Number of server replicas. StatefulSet only (no Deployment variant).
#    >1 enables multi-provider replication by default; see replication.enabled
#    to override that inference explicitly.
replicaCount: 1

image:
  # -- Server image repository. Must match what
  #    .github/workflows/release.yml publishes.
  repository: ghcr.io/dasomel/ldapium
  # -- Defaults to .Chart.Version when empty — the chart and its images are
  #    released together under the same vX.Y.Z tag. Set this to pin an image
  #    independently of the chart. It is NOT the OpenLDAP version; that is
  #    .Chart.AppVersion, which the UI reports but never pulls.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

ldap:
  rootDN: dc=example,dc=org
  orgName: ""
  adminDN: ""
  dbMaxSize: ""
  maxOpenFiles: 4096
  logLevel: stats
  passwordHash: "{ARGON2}"
  uniqueAttributes: "uid,mail"
  passwordPolicyEnabled: true

auth:
  adminPassword: ""
  existingSecret: ""
  existingSecretKey: admin-password

tls:
  enabled: false
  existingSecret: ""
  certFile: /etc/openldap/tls/tls.crt
  keyFile: /etc/openldap/tls/tls.key
  caFile: ""

replication:
  clusterDomain: cluster.local
  retry: "5 10 30 +"
  interval: "00:00:00:10"
  bindDN: ""
  existingSecret: ""
  existingSecretKey: replication-password

seed:
  enabled: false
  ldifs: {}

tests:
  enabled: true
  write: true
  timeoutSeconds: 60
  resources: {}
  podSecurityContext:
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault

persistence:
  config:
    size: 1Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
  data:
    size: 2Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 256Mi

podSecurityContext:
  fsGroup: 999
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  ldapPort: 389
  ldapsPort: 636

pdb:
  enabled: true
  minAvailable: 1

backup:
  enabled: false
  schedule: "0 2 * * *"
  retentionDays: 7
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2
  activeDeadlineSeconds: 3600
  recordToDirectory: true
  persistence:
    size: 5Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  podSecurityContext:
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault

# -- Prometheus/OpenLDAP observability profile.
#    Opt-in so existing LDAPium installs do not gain an additional sidecar by
#    surprise. When enabled the chart exposes the OpenLDAP exporter on 9330.
metrics:
  enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: false
    replicationLagThreshold: 300
    replicationLagFor: 5m
    connectionSaturationPercent: 80
    backupMaxAgeSeconds: 93600
    backupFailureFor: 5m
    # TLS expiry is intentionally disabled by default because the exact
    # certificate metric differs between cert-manager/kube-state-metrics
    # deployments. Operators can provide a PromQL selector that yields the
    # certificate expiration timestamp in seconds, for example:
    # certmanager_certificate_expiration_timestamp_seconds{namespace="ldap",name="ldapium"}
    tlsCertificateExpirationExpr: ""
    tlsExpiryWarningSeconds: 2592000
  dashboard:
    enabled: true

# -- Optional management UI (ui/). Off by default.
ui:
  enabled: false
  image:
    repository: ghcr.io/dasomel/ldapium-ui
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  podAnnotations: {}
  podLabels: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  ldap:
    url: ""
    baseDN: ""
    userSearchBase: ""
    userSearchFilter: "(uid=%s)"
    groupSearchBase: ""
    userCreateBase: ""
    groupCreateBase: ""
    startTLS: false
    tlsCACert: ""
    tlsInsecureSkipVerify: false
  session:
    existingSecret: ""
    existingSecretKey: session-secret
    ttl: 30m
    cookieSecure: true
  sso:
    enabled: false
    issuerURL: "https://sso.example.com/realms/example"
    clientID: ""
    adminRole: ldap-admin
    existingSecret: ""
    existingSecretKey: oidc-client-secret
    callbackOrigins: []
  ldapServiceAccount:
    existingSecret: ""
    dnKey: ldap-service-account-dn
    passwordKey: ldap-service-account-password
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []

topologySpreadConstraints: []
nodeSelector: {}
tolerations: []
affinity: {}

startupProbe:
  periodSeconds: 5
  failureThreshold: 60
livenessProbe:
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
