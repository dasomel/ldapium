{{- if and .Values.ui.enabled .Values.ui.ingress.enabled }}
{{- $basePath := include "ldapium.ui.basePath" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ldapium.ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ldapium.ui.labels" . | nindent 4 }}
  {{- with .Values.ui.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ui.ingress.className }}
  ingressClassName: {{ .Values.ui.ingress.className }}
  {{- end }}
  {{- with .Values.ui.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ui.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          {{- if and $basePath (not (hasPrefix $basePath .path)) }}{{ fail (printf "ui.ingress path %q must start with ui.basePath %q: the backend serves only under that prefix" .path $basePath) }}{{ end }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "ldapium.ui.fullname" $ }}
                port:
                  number: {{ $.Values.ui.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
