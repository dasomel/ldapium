{{- if and .Values.ui.enabled .Values.ui.metrics.enabled }}
{{- /* The UI container listens on 8080 (LISTEN_ADDR default, containerPort http); METRICS_ADDR must not claim it or the backend refuses to start. ui.service.port is only the Service's port and says nothing about the container. */}}
{{- if eq (int .Values.ui.metrics.port) 8080 }}
{{- fail "ui.metrics.port must not be 8080: that is the UI container's own HTTP listener (the metrics listener would collide with it and the backend would refuse to start)" }}
{{- end }}
{{- /* The metrics port lives on this Service only, never on the public UI Service (ui-service.yaml). */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ldapium.ui.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ldapium.ui.metricsLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: ui-metrics
      port: {{ int .Values.ui.metrics.port }}
      targetPort: ui-metrics
      protocol: TCP
  selector:
    {{- include "ldapium.ui.selectorLabels" . | nindent 4 }}
{{- end }}
