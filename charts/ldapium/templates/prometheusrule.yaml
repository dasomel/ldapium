{{- if and .Values.metrics .Values.metrics.enabled .Values.metrics.prometheusRule .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ldapium.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ldapium.labels" . | nindent 4 }}
spec:
  groups:
    - name: ldapium.rules
      rules:
        - alert: LDAPiumExporterDown
          # namespace AND service are both required: `service` alone is only
          # unique within a namespace. Two installs of this chart under the
          # same release/fullname in different namespaces, scraped by one
          # Prometheus, would otherwise have this alert cross-fire on the
          # other install's series.
          expr: up{namespace="{{ .Release.Namespace }}",service="{{ include "ldapium.fullname" . }}-metrics"} == 0
          for: {{ .Values.metrics.prometheusRule.exporterDownFor | default "5m" }}
          labels:
            severity: critical
            release: {{ .Release.Name }}
          annotations:
            summary: "LDAPium metrics endpoint is down"
            description: "Prometheus cannot scrape the LDAPium metrics endpoint for {{ .Values.metrics.prometheusRule.exporterDownFor | default "5m" }}."

        - alert: LDAPiumReplicationLag
          # `by (namespace, service, replica)`: without namespace here, two
          # same-fullname installs in different namespaces would have this
          # `max` aggregation merge their series and their alerts would be
          # indistinguishable from one another.
          expr: max by (namespace, service, replica) (openldap_replication_delta{namespace="{{ .Release.Namespace }}",service="{{ include "ldapium.fullname" . }}-metrics"}) > {{ .Values.metrics.prometheusRule.replicationLagThreshold }}
          for: {{ .Values.metrics.prometheusRule.replicationLagFor }}
          labels:
            severity: warning
            release: {{ .Release.Name }}
          annotations:
            summary: "LDAPium replication lag is high"
            description: "At least one replication peer is more than the configured threshold behind the local provider."

        - alert: LDAPiumContextCSNDivergence
          expr: max by (namespace, service, replica) (abs(openldap_replication_delta{namespace="{{ .Release.Namespace }}",service="{{ include "ldapium.fullname" . }}-metrics"})) > {{ .Values.metrics.prometheusRule.replicationDivergenceThreshold | default 300 }}
          for: {{ .Values.metrics.prometheusRule.replicationDivergenceFor | default "5m" }}
          labels:
            severity: critical
            release: {{ .Release.Name }}
          annotations:
            summary: "LDAPium contextCSN divergence is critical"
            description: "At least one replication peer contextCSN has diverged by more than the critical threshold from the local provider."

        - alert: LDAPiumConnectionSaturation
          # `ignoring(dn)` is load-bearing. Both sides are the same metric
          # distinguished only by dn, so a plain division finds no matching
          # series and returns nothing at all — the alert could never fire.
          expr: |
            100 *
            openldap_monitor_counter_object{dn="cn=Current,cn=Connections,cn=Monitor"}
            / ignoring(dn)
            openldap_monitor_counter_object{dn="cn=Max File Descriptors,cn=Connections,cn=Monitor"}
            > {{ .Values.metrics.prometheusRule.connectionSaturationPercent }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "LDAPium connection/file-descriptor pressure is high"
            description: "Current LDAP connections exceeded the configured percentage of the monitor-reported maximum file descriptors."

        {{- if .Values.backup.enabled }}
        - alert: LDAPiumBackupFailed
          expr: max by (namespace) (kube_job_status_failed{namespace="{{ .Release.Namespace }}",job_name=~"{{ include "ldapium.fullname" . }}-backup-.*"}) > 0
          for: {{ .Values.metrics.prometheusRule.backupFailureFor }}
          labels:
            severity: critical
          annotations:
            summary: "LDAPium backup job failed"
            description: "A recent LDAPium backup Job is reporting failure."

        - alert: LDAPiumBackupStale
          expr: |
            time() - max by (namespace) (
              kube_job_status_completion_time{namespace="{{ .Release.Namespace }}",job_name=~"{{ include "ldapium.fullname" . }}-backup-.*"}
            ) > {{ .Values.metrics.prometheusRule.backupMaxAgeSeconds }}
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "LDAPium backup is stale"
            description: "The last successful LDAPium backup is older than the configured maximum backup age."
        {{- end }}

        {{- if .Values.replication.check.enabled }}
        - alert: LDAPiumReplicationCheckFailed
          # A failed Job stays in the history until later failures push it out, so the bare
          # kube_job_status_failed would keep firing after the check recovered. Fire only while the
          # newest failed run started after the newest successful completion (or none succeeded yet).
          expr: |
            (
              max by (namespace) (
                kube_job_status_start_time{namespace="{{ .Release.Namespace }}",job_name=~"{{ include "ldapium.fullname" . }}-replication-check-.*"}
                and on (namespace, job_name)
                (kube_job_status_failed{namespace="{{ .Release.Namespace }}",job_name=~"{{ include "ldapium.fullname" . }}-replication-check-.*"} > 0)
              )
              > on (namespace)
              max by (namespace) (
                kube_job_status_completion_time{namespace="{{ .Release.Namespace }}",job_name=~"{{ include "ldapium.fullname" . }}-replication-check-.*"}
              )
            )
            or
            (
              max by (namespace) (
                kube_job_status_start_time{namespace="{{ .Release.Namespace }}",job_name=~"{{ include "ldapium.fullname" . }}-replication-check-.*"}
                and on (namespace, job_name)
                (kube_job_status_failed{namespace="{{ .Release.Namespace }}",job_name=~"{{ include "ldapium.fullname" . }}-replication-check-.*"} > 0)
              )
              unless on (namespace)
              max by (namespace) (
                kube_job_status_completion_time{namespace="{{ .Release.Namespace }}",job_name=~"{{ include "ldapium.fullname" . }}-replication-check-.*"}
              )
            )
          for: {{ .Values.metrics.prometheusRule.replicationCheckFailureFor | default "5m" }}
          labels:
            severity: critical
          annotations:
            summary: "LDAPium replication identity check failed"
            description: "The newest replication identity check Job failed (stable-CSN data differs, the identity configuration changed, or the check could not read a node). Read the Job logs for the fixed-format reason."

        {{- end }}
        {{- if .Values.metrics.prometheusRule.tlsCertificateExpirationExpr }}
        - alert: LDAPiumTLSCertificateExpiringSoon
          expr: |
            {{ .Values.metrics.prometheusRule.tlsCertificateExpirationExpr }} - time()
            < {{ .Values.metrics.prometheusRule.tlsExpiryWarningSeconds }}
            and
            {{ .Values.metrics.prometheusRule.tlsCertificateExpirationExpr }} > time()
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "LDAPium TLS certificate expires soon"
            description: "The configured certificate expiration metric is within the warning window."
        {{- end }}

        - alert: LDAPiumMDBUsageHigh
          expr: |
            100 * openldap_pages_used / clamp_min(openldap_pages_max, 1) > 80
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "LDAPium MDB usage is high"
            description: "The LDAPium MDB database is using more than 80% of its configured maximum pages."
{{- end }}
