{{- if and .Values.metrics .Values.metrics.enabled .Values.metrics.prometheusRule .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ldapium.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ldapium.labels" . | nindent 4 }}
spec:
  groups:
    - name: ldapium.rules
      rules:
        - alert: LDAPiumExporterDown
          expr: up{service="{{ include "ldapium.fullname" . }}-metrics"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "LDAPium metrics endpoint is down"
            description: "Prometheus cannot scrape the LDAPium metrics endpoint for 5 minutes."
        - alert: LDAPiumReplicationLag
          expr: openldap_replication_delta > {{ .Values.metrics.prometheusRule.replicationLagThreshold }}
          for: {{ .Values.metrics.prometheusRule.replicationLagFor }}
          labels:
            severity: warning
          annotations:
            summary: "LDAPium replication lag is high"
            description: "Replication delta exceeded the configured threshold."
{{- end }}
