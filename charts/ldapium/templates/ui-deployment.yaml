{{- if .Values.ui.enabled }}
{{- if .Values.ui.backups.enabled }}
{{- if not .Values.ui.backups.runtimeConfirmed }}{{ fail "backups require runtimeConfirmed and a backup-runtime image" }}{{ end }}
{{- if ne (int .Values.ui.replicaCount) 1 }}{{ fail "backups require ui.replicaCount=1" }}{{ end }}
{{- if not .Values.ui.backups.existingClaim }}{{ fail "backups require an existing PVC" }}{{ end }}
{{- if not .Values.ui.backups.existingSecret }}{{ fail "backups require an operator Secret" }}{{ end }}
{{- if not .Values.ui.backups.adminDNs }}{{ fail "backups require explicit adminDNs" }}{{ end }}
{{- range .Values.ui.backups.adminDNs }}{{- if not (trim .) }}{{ fail "backups require nonempty adminDNs" }}{{ end }}{{ end }}
{{- end }}
{{- if .Values.ui.applicationProfiles.enabled }}
{{- /* D22: file persistence needs one writer; Recreate prevents rolling overlap. Use a database before enabling HA. */}}
{{- if ne (int .Values.ui.replicaCount) 1 }}{{ fail "application profiles require ui.replicaCount=1" }}{{ end }}
{{- if not .Values.ui.applicationProfiles.existingClaim }}{{ fail "application profiles require an existing PVC" }}{{ end }}
{{- if not .Values.ui.applicationProfiles.adminDNs }}{{ fail "application profiles require explicit adminDNs" }}{{ end }}
{{- range .Values.ui.applicationProfiles.adminDNs }}
{{- if not (trim .) }}{{ fail "application profiles require nonempty adminDNs" }}{{ end }}
{{- end }}
{{- end }}
{{- if .Values.ui.keycloakAdmin.enabled }}
{{- if not .Values.ui.applicationProfiles.enabled }}{{ fail "keycloakAdmin requires applicationProfiles.enabled" }}{{ end }}
{{- range $name := list "url" "realm" "clientID" "existingSecret" "secretKey" }}
{{- if not (index $.Values.ui.keycloakAdmin $name) }}{{ fail (printf "keycloakAdmin requires %s" $name) }}{{ end }}
{{- end }}
{{- if not (hasPrefix "https://" .Values.ui.keycloakAdmin.url) }}{{ fail "keycloakAdmin.url requires HTTPS" }}{{ end }}
{{- if not .Values.ui.keycloakAdmin.observeClients }}{{ fail "keycloakAdmin requires observeClients" }}{{ end }}
{{- if and .Values.ui.keycloakAdmin.delegateClients (not .Values.ui.keycloakAdmin.isolatedRealm) }}{{ fail "delegated writes require an isolated realm" }}{{ end }}
{{- end }}
{{- if and .Values.ui.machineAuth.write.enabled (not .Values.ui.machineAuth.enabled) }}{{ fail "ui.machineAuth.write.enabled=true requires ui.machineAuth.enabled=true" }}{{ end }}
{{- /*
  v2c (#379 T-028, D379-14): the credential compartment never renders next to the
  auditlog overlay (it writes the hash of every password set to the slapd log, which
  the UI cannot see) or an accesslog ops list holding extended/all (F-7: one Password
  Modify aborts slapd). T-026 renders the W_cred identity, the configuration reader
  and the canaries: every value the application cannot start without is checked in
  one pass, passwords are Secret references only, and each identity differs from the
  others (the application re-validates all of it at start-up).
*/ -}}
{{- if .Values.ui.machineAuth.write.cred.enabled }}
{{- if .Values.audit.enabled }}{{ fail "ui.machineAuth.write.cred.enabled=true cannot be combined with audit.enabled=true (the auditlog overlay writes every password hash to the slapd log, D379-14)" }}{{ end }}
{{- if regexMatch `(?i)(^|[\s,])(extended|all)([\s,]|$)` (.Values.audit.accessLog.ops | default "") }}{{ fail "ui.machineAuth.write.cred.enabled=true cannot be combined with audit.accessLog.ops containing extended or all (a Password Modify aborts slapd, F-7)" }}{{ end }}
{{- $ma := .Values.ui.machineAuth -}}
{{- $w := $ma.write -}}
{{- $c := $w.cred -}}
{{- if not $w.enabled }}{{ fail "ui.machineAuth.write.cred.enabled=true requires ui.machineAuth.write.enabled=true" }}{{ end -}}
{{- $cmiss := list -}}
{{- range $k := list "bindDN" "existingSecret" "existingSecretKey" "subtrees" "pendingPolicyDN" "canaries" }}
{{- if not (index $c $k) }}{{ $cmiss = append $cmiss (printf "ui.machineAuth.write.cred.%s" $k) }}{{ end }}
{{- end }}
{{- range $k := list "dn" "existingSecret" "existingSecretKey" }}
{{- if not (index $c.aclReader $k) }}{{ $cmiss = append $cmiss (printf "ui.machineAuth.write.cred.aclReader.%s" $k) }}{{ end }}
{{- end }}
{{- if $cmiss }}{{ fail (printf "ui.machineAuth.write.cred.enabled=true requires: %s" (join ", " $cmiss)) }}{{ end -}}
{{- $adminDN := .Values.ldap.adminDN | default (printf "cn=admin,%s" .Values.ldap.rootDN) -}}
{{- $cn := dict "m" (lower (replace ", " "," (trim $ma.ldapBindDN))) "d" (lower (replace ", " "," (trim $w.data.bindDN))) "l" (lower (replace ", " "," (trim $w.lock.bindDN))) "a" (lower (replace ", " "," (trim $adminDN))) "c" (lower (replace ", " "," (trim $c.bindDN))) "r" (lower (replace ", " "," (trim $c.aclReader.dn))) -}}
{{- if or (eq $cn.c $cn.m) (eq $cn.c $cn.d) (eq $cn.c $cn.a) (and $w.lock.enabled (eq $cn.c $cn.l)) }}{{ fail "ui.machineAuth.write.cred.bindDN must differ from the read identity, the data and lock identities and the LDAP administrator DN" }}{{ end -}}
{{- if or (eq $cn.r $cn.m) (eq $cn.r $cn.d) (eq $cn.r $cn.a) (eq $cn.r $cn.c) (and $w.lock.enabled (eq $cn.r $cn.l)) }}{{ fail "ui.machineAuth.write.cred.aclReader.dn must differ from the read identity, every write identity and the LDAP administrator DN" }}{{ end -}}
{{- /* T-026 review MINOR b: the LDAP administrator's Secret key counts too (an identity's password must never be the rootdn's). */ -}}
{{- $refs := list (printf "%s/%s" $ma.existingSecret $ma.existingSecretKey) (printf "%s/%s" $w.data.existingSecret $w.data.existingSecretKey) (printf "%s/%s" (include "ldapium.adminSecretName" .) .Values.auth.existingSecretKey) -}}
{{- if $w.lock.enabled }}{{ $refs = append $refs (printf "%s/%s" $w.lock.existingSecret $w.lock.existingSecretKey) }}{{ end -}}
{{- $credRef := printf "%s/%s" $c.existingSecret $c.existingSecretKey -}}
{{- $readerRef := printf "%s/%s" $c.aclReader.existingSecret $c.aclReader.existingSecretKey -}}
{{- if has $credRef $refs }}{{ fail "ui.machineAuth.write.cred must not reuse the Secret key of the read, data or lock identity or of the LDAP administrator" }}{{ end -}}
{{- if or (has $readerRef $refs) (eq $readerRef $credRef) }}{{ fail "ui.machineAuth.write.cred.aclReader must not reuse the Secret key of another identity" }}{{ end -}}
{{- $subIDs := list -}}
{{- range $e := $w.subtrees }}{{ $subIDs = append $subIDs $e.client }}{{ end -}}
{{- range $e := $c.subtrees }}
{{- if not (has $e.client $subIDs) }}{{ fail (printf "ui.machineAuth.write.cred.subtrees client %q has no ui.machineAuth.write.subtrees entry" $e.client) }}{{ end }}
{{- end }}
{{- end }}
{{- if .Values.ui.machineAuth.enabled }}
{{- /*
  Machine bearer auth (#214): every value it cannot run without, checked in one
  pass (same shape as the SSO block below). The application re-validates all of
  it at startup; this keeps a bad install from reaching a crash-looping pod.
*/ -}}
{{- $ma := .Values.ui.machineAuth -}}
{{- $missing := list -}}
{{- if and $ma.revocation.enabled (lt (int $ma.revocation.maxStaleSeconds) (add (int $ma.revocation.refreshSeconds) 5)) }}{{ fail "ui.machineAuth.revocation.maxStaleSeconds must be at least refreshSeconds + 5" }}{{ end -}}
{{- if and (not $ma.issuerURL) (not .Values.ui.sso.enabled) }}{{ $missing = append $missing "ui.machineAuth.issuerURL (or ui.sso.enabled=true to inherit the SSO issuer)" }}{{ end -}}
{{- if not $ma.audience }}{{ $missing = append $missing "ui.machineAuth.audience" }}{{ end -}}
{{- if not $ma.allowedClients }}{{ $missing = append $missing "ui.machineAuth.allowedClients" }}{{ end -}}
{{- if not $ma.ldapBindDN }}{{ $missing = append $missing "ui.machineAuth.ldapBindDN" }}{{ end -}}
{{- if not $ma.existingSecret }}{{ $missing = append $missing "ui.machineAuth.existingSecret (the machine LDAP bind password)" }}{{ end -}}
{{- if not $ma.existingSecretKey }}{{ $missing = append $missing "ui.machineAuth.existingSecretKey" }}{{ end -}}
{{- if $missing }}{{ fail (printf "ui.machineAuth.enabled=true requires: %s" (join ", " $missing)) }}{{ end -}}
{{- if and $ma.issuerURL (not (hasPrefix "https://" $ma.issuerURL)) }}{{ fail "ui.machineAuth.issuerURL must use https" }}{{ end -}}
{{- if or (eq (trim .Values.ui.trustedProxies) "") (eq (lower (trim .Values.ui.trustedProxies)) "private") }}{{ fail "ui.machineAuth.enabled=true requires ui.trustedProxies to be an explicit CIDR list or \"none\", not \"private\" (a client on the internal network could forge X-Forwarded-For and dodge the per-IP throttle)" }}{{ end -}}
{{- range $c := $ma.allowedClients }}
{{- if not $c.id }}{{ fail "ui.machineAuth.allowedClients entries need an id" }}{{ end }}
{{- if regexMatch "[=;,\\s]" $c.id }}{{ fail (printf "ui.machineAuth.allowedClients id %q must not contain = ; , or whitespace" $c.id) }}{{ end }}
{{- if not $c.scopes }}{{ fail (printf "ui.machineAuth.allowedClients %q needs at least one scope" $c.id) }}{{ end }}
{{- end }}
{{- if $ma.write.enabled }}
{{- /*
  Machine write gates (machine-write-scope T-024, D3/D9). The application
  re-validates at startup; the chart refuses an unsafe topology before a pod
  exists. Single replica: the idempotency store is process memory (D9, Q8); this
  chart has no UI HPA/PDB, so the replica value is the only scaling path.
*/ -}}
{{- $w := $ma.write -}}
{{- if ne (int .Values.ui.replicaCount) 1 }}{{ fail "ui.machineAuth.write.enabled=true requires ui.replicaCount=1 (the idempotency store is per-process memory; a second replica would replay and double-apply keyed writes)" }}{{ end -}}
{{- if not .Values.ui.idempotency.enabled }}{{ fail "ui.machineAuth.write.enabled=true requires ui.idempotency.enabled=true (machine writes need the Idempotency-Key store)" }}{{ end -}}
{{- $wmiss := list -}}
{{- if not $w.data.bindDN }}{{ $wmiss = append $wmiss "ui.machineAuth.write.data.bindDN" }}{{ end -}}
{{- if not $w.data.existingSecret }}{{ $wmiss = append $wmiss "ui.machineAuth.write.data.existingSecret" }}{{ end -}}
{{- if not $w.data.existingSecretKey }}{{ $wmiss = append $wmiss "ui.machineAuth.write.data.existingSecretKey" }}{{ end -}}
{{- if not $w.subtrees }}{{ $wmiss = append $wmiss "ui.machineAuth.write.subtrees" }}{{ end -}}
{{- if not $w.groups }}{{ $wmiss = append $wmiss "ui.machineAuth.write.groups" }}{{ end -}}
{{- if not $w.privilegedGroups }}{{ $wmiss = append $wmiss "ui.machineAuth.write.privilegedGroups" }}{{ end -}}
{{- if $wmiss }}{{ fail (printf "ui.machineAuth.write.enabled=true requires: %s" (join ", " $wmiss)) }}{{ end -}}
{{- if $w.lock.enabled }}
{{- if or (not $w.lock.bindDN) (not $w.lock.existingSecret) (not $w.lock.existingSecretKey) }}{{ fail "ui.machineAuth.write.lock.enabled=true requires ui.machineAuth.write.lock.bindDN, existingSecret and existingSecretKey" }}{{ end }}
{{- end }}
{{- $adminDN := .Values.ldap.adminDN | default (printf "cn=admin,%s" .Values.ldap.rootDN) -}}
{{- $norm := dict "m" (lower (replace ", " "," (trim $ma.ldapBindDN))) "d" (lower (replace ", " "," (trim $w.data.bindDN))) "l" (lower (replace ", " "," (trim $w.lock.bindDN))) "a" (lower (replace ", " "," (trim $adminDN))) -}}
{{- if eq $norm.d $norm.m }}{{ fail "ui.machineAuth.write.data.bindDN must differ from ui.machineAuth.ldapBindDN (the read-only identity)" }}{{ end -}}
{{- if eq $norm.d $norm.a }}{{ fail "ui.machineAuth.write.data.bindDN must not be the LDAP administrator DN" }}{{ end -}}
{{- if and $w.lock.enabled (eq $norm.l $norm.d) }}{{ fail "ui.machineAuth.write.lock.bindDN must differ from ui.machineAuth.write.data.bindDN" }}{{ end -}}
{{- if and $w.lock.enabled (eq $norm.l $norm.m) }}{{ fail "ui.machineAuth.write.lock.bindDN must differ from ui.machineAuth.ldapBindDN (the read-only identity)" }}{{ end -}}
{{- if and $w.lock.enabled (eq $norm.l $norm.a) }}{{ fail "ui.machineAuth.write.lock.bindDN must not be the LDAP administrator DN" }}{{ end -}}
{{- if and (eq $w.data.existingSecret $ma.existingSecret) (eq $w.data.existingSecretKey $ma.existingSecretKey) }}{{ fail "ui.machineAuth.write.data must not reuse the read identity's Secret key (ui.machineAuth.existingSecret/existingSecretKey)" }}{{ end -}}
{{- if and $w.lock.enabled (eq $w.lock.existingSecret $w.data.existingSecret) (eq $w.lock.existingSecretKey $w.data.existingSecretKey) }}{{ fail "ui.machineAuth.write.lock must not reuse the data identity's Secret key" }}{{ end -}}
{{- if and $w.lock.enabled (eq $w.lock.existingSecret $ma.existingSecret) (eq $w.lock.existingSecretKey $ma.existingSecretKey) }}{{ fail "ui.machineAuth.write.lock must not reuse the read identity's Secret key" }}{{ end -}}
{{- $adminSecret := include "ldapium.adminSecretName" . -}}
{{- if and (eq $w.data.existingSecret $adminSecret) (eq $w.data.existingSecretKey .Values.auth.existingSecretKey) }}{{ fail "ui.machineAuth.write.data must not reuse the LDAP administrator's Secret key" }}{{ end -}}
{{- if and $w.lock.enabled (eq $w.lock.existingSecret $adminSecret) (eq $w.lock.existingSecretKey .Values.auth.existingSecretKey) }}{{ fail "ui.machineAuth.write.lock must not reuse the LDAP administrator's Secret key" }}{{ end -}}
{{- $known := list -}}
{{- range $c := $ma.allowedClients }}{{ $known = append $known $c.id }}{{ end -}}
{{- $subIDs := list -}}
{{- range $e := $w.subtrees }}
{{- if not (has $e.client $known) }}{{ fail (printf "ui.machineAuth.write.subtrees client %q is not in ui.machineAuth.allowedClients" $e.client) }}{{ end }}
{{- $subIDs = append $subIDs $e.client }}
{{- end }}
{{- range $e := $w.groups }}
{{- if not (has $e.client $subIDs) }}{{ fail (printf "ui.machineAuth.write.groups client %q has no ui.machineAuth.write.subtrees entry" $e.client) }}{{ end }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.ui.sso.enabled }}
{{- /*
  Every value SSO cannot run without, checked in one pass so a misconfigured
  install is told about all of them at once. Failing on the first one turns a
  single fix-up into one round of `helm install` per missing value.

  The "why" for the two non-obvious entries: ldap.userSearchFilter is what
  maps the token's preferred_username onto a directory entry (with SSO there
  is no password to bind with, so the filter is the only route), and the
  ldapServiceAccount keys exist for the same reason — see values.yaml.
*/ -}}
{{- $missing := list -}}
{{- if not .Values.ui.sso.issuerURL }}{{ $missing = append $missing "ui.sso.issuerURL" }}{{ end -}}
{{- if not .Values.ui.sso.clientID }}{{ $missing = append $missing "ui.sso.clientID" }}{{ end -}}
{{- if not .Values.ui.sso.existingSecret }}{{ $missing = append $missing "ui.sso.existingSecret (confidential OIDC client secret)" }}{{ end -}}
{{- if not .Values.ui.sso.existingSecretKey }}{{ $missing = append $missing "ui.sso.existingSecretKey" }}{{ end -}}
{{- if not .Values.ui.sso.callbackOrigins }}{{ $missing = append $missing "ui.sso.callbackOrigins (every allowed browser origin)" }}{{ end -}}
{{- if not .Values.ui.ldap.userSearchFilter }}{{ $missing = append $missing "ui.ldap.userSearchFilter" }}{{ end -}}
{{- if not .Values.ui.ldapServiceAccount.existingSecret }}{{ $missing = append $missing "ui.ldapServiceAccount.existingSecret" }}{{ end -}}
{{- if not .Values.ui.ldapServiceAccount.dnKey }}{{ $missing = append $missing "ui.ldapServiceAccount.dnKey" }}{{ end -}}
{{- if not .Values.ui.ldapServiceAccount.passwordKey }}{{ $missing = append $missing "ui.ldapServiceAccount.passwordKey" }}{{ end -}}
{{- if $missing }}{{ fail (printf "ui.sso.enabled=true requires: %s" (join ", " $missing)) }}{{ end -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ldapium.ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ldapium.ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  {{- if or .Values.ui.applicationProfiles.enabled .Values.ui.backups.enabled .Values.ui.idempotency.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "ldapium.ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ldapium.ui.selectorLabels" . | nindent 8 }}
        {{- with .Values.ui.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.ui.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.ui.machineAuth.enabled }}
      {{- /* D7: in-flight machine requests (up to MACHINE_REQUEST_TIMEOUT) must be able to finish when a pod is replaced for an emergency block. #280: this must stay >= the server's derived shutdown grace, max(10s, 10s auth phase + timeout + 5s) capped at 315s (ui/backend/cmd/server/shutdown.go); max(30, timeout+15) always is, and the schema caps requestTimeoutSeconds at 300. */}}
      terminationGracePeriodSeconds: {{ max 30 (add (int .Values.ui.machineAuth.requestTimeoutSeconds) 15) }}
      {{- end }}
      serviceAccountName: {{ include "ldapium.ui.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # Numeric uid/gid is mandatory, not cosmetic: with runAsNonRoot set
        # and no runAsUser, the kubelet refuses to start the container because
        # the distroless base declares `USER nonroot` by name —
        #   image has non-numeric user (nonroot), cannot verify user is
        #   non-root
        # 65532 is distroless's nonroot, read from the image's own
        # /etc/passwd rather than assumed.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.ui.applicationProfiles.enabled .Values.ui.backups.enabled }}
      volumes:
        {{- if .Values.ui.applicationProfiles.enabled }}
        - name: application-profiles
          persistentVolumeClaim:
            claimName: {{ .Values.ui.applicationProfiles.existingClaim | quote }}
        {{- end }}
        {{- if .Values.ui.backups.enabled }}
        - name: backup-archives
          persistentVolumeClaim:
            claimName: {{ .Values.ui.backups.existingClaim | quote }}
        - name: backup-operator
          secret:
            secretName: {{ .Values.ui.backups.existingSecret | quote }}
            defaultMode: 0440
        - name: backup-tmp
          emptyDir: {}
        {{- if .Values.ui.backups.logExistingClaim }}
        - name: backup-logs
          persistentVolumeClaim:
            claimName: {{ .Values.ui.backups.logExistingClaim | quote }}
            readOnly: true
        {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: ui
          image: {{ include "ldapium.ui.image" . }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          # Distroless nonroot base (ui/Dockerfile) — USER nonroot:nonroot is
          # already baked in, so no runAsUser override needed here either.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.ui.metrics.enabled }}
            # Named ui-metrics (not metrics) so the slapd ServiceMonitor, whose
            # selector is broad and whose endpoint port is named metrics, cannot
            # pick this up.
            - name: ui-metrics
              containerPort: {{ include "ldapium.ui.metricsPort" . }}
              protocol: TCP
            {{- end }}
          # /api/auth/config is unauthenticated and answers from configuration
          # alone — no LDAP round-trip — so a probe against it reports on this
          # process rather than on the directory's health. A UI that cannot
          # reach the directory should still come up and say so.
          readinessProbe:
            httpGet:
              path: /api/auth/config
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/auth/config
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          {{- $ldapURL := .Values.ui.ldap.url }}
          {{- if not $ldapURL }}
          {{- if .Values.tls.enabled }}
          {{- $ldapURL = printf "ldaps://%s.%s.svc.%s:%d" (include "ldapium.fullname" .) .Release.Namespace .Values.replication.clusterDomain (int .Values.service.ldapsPort) }}
          {{- else }}
          {{- $ldapURL = printf "ldap://%s.%s.svc.%s:%d" (include "ldapium.fullname" .) .Release.Namespace .Values.replication.clusterDomain (int .Values.service.ldapPort) }}
          {{- end }}
          {{- end }}
          env:
            - name: APP_VERSION
              value: {{ .Chart.Version | quote }}
            - name: OPENLDAP_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: OPENLDAP_PASSWORD_HASH
              value: {{ .Values.ldap.passwordHash | quote }}
            - name: OPENLDAP_PASSWORD_POLICY_ENABLED
              value: {{ .Values.ldap.passwordPolicyEnabled | quote }}
            - name: OPENLDAP_UNIQUE_ATTRIBUTES
              value: {{ .Values.ldap.uniqueAttributes | quote }}
            # These are the ONLY source for what the settings page shows, and
            # they are a hand-kept copy of what image/Dockerfile builds,
            # image/ldifs/01-cn-config.ldif loads and image/entrypoint.sh
            # (section 3c) enables at runtime from the ldap.modules.* values.
            # Keep them in step by hand: the list had already drifted twice
            # (back_mdb, then nestgroup/ppm, were missing).
            #
            # MODULES: the bootstrap ldif loads the fixed list below on every
            # volume; nestgroup is loaded by the entrypoint only when enabled,
            # and ppm is a ppolicy check module (ppm.so via
            # olcPPolicyCheckModule, not an olcModuleLoad), listed only while
            # enabled. OVERLAYS: what is really active for these values.
            # lastbind is a database option, not an overlay, so it is omitted.
            #
            # Reading the real values from the server is the obvious fix and
            # does not work: they live in cn=config, which has its own admin
            # identity. Binding as the directory admin (cn=admin,<rootDN>) is
            # answered with "No such object" — verified against a running
            # server — and this UI only ever binds as a directory user, so no
            # session it can create could read them. Making it possible would
            # mean giving the UI a second, cn=config-capable service account,
            # which is exactly the thing this project avoids.
            - name: OPENLDAP_MODULES
              value: "back_mdb,argon2,memberof,refint,ppolicy,unique,syncprov,accesslog,auditlog,constraint,deref,dynlist,sssvlv,otp{{ if .Values.ldap.modules.nestgroupEnabled }},nestgroup{{ end }}{{ if .Values.ldap.modules.ppmEnabled }},ppm{{ end }}"
            - name: OPENLDAP_OVERLAYS
              value: "memberof,refint,ppolicy{{ if .Values.ldap.uniqueAttributes }},unique{{ end }}{{ if eq (include "ldapium.replicationEnabled" .) "true" }},syncprov{{ end }}{{ if .Values.ldap.modules.derefEnabled }},deref{{ end }}{{ if .Values.ldap.modules.constraintEnabled }},constraint{{ end }}{{ if .Values.ldap.modules.nestgroupEnabled }},nestgroup{{ end }}{{ if .Values.ldap.modules.dynlistEnabled }},dynlist{{ end }}{{ if .Values.ldap.modules.otpEnabled }},otp{{ end }}{{ if .Values.ldap.modules.sssvlvMainEnabled }},sssvlv{{ end }}"
            - name: LDAP_URL
              value: {{ $ldapURL | quote }}
            - name: LDAP_BASE_DN
              value: {{ .Values.ui.ldap.baseDN | default .Values.ldap.rootDN | quote }}
            {{- if .Values.ui.ldap.userSearchBase }}
            - name: LDAP_USER_SEARCH_BASE
              value: {{ .Values.ui.ldap.userSearchBase | quote }}
            {{- end }}
            {{- if .Values.ui.ldap.userSearchFilter }}
            - name: LDAP_USER_SEARCH_FILTER
              value: {{ .Values.ui.ldap.userSearchFilter | quote }}
            {{- end }}
            {{- if .Values.ui.ldap.groupSearchBase }}
            - name: LDAP_GROUP_SEARCH_BASE
              value: {{ .Values.ui.ldap.groupSearchBase | quote }}
            {{- end }}
            {{- if .Values.ui.ldap.userCreateBase }}
            - name: LDAP_USER_CREATE_BASE
              value: {{ .Values.ui.ldap.userCreateBase | quote }}
            {{- end }}
            {{- if .Values.ui.ldap.groupCreateBase }}
            - name: LDAP_GROUP_CREATE_BASE
              value: {{ .Values.ui.ldap.groupCreateBase | quote }}
            {{- end }}
            - name: LDAP_START_TLS
              value: {{ .Values.ui.ldap.startTLS | quote }}
            {{- if .Values.ui.ldap.tlsCACert }}
            - name: LDAP_TLS_CA_CERT
              value: {{ .Values.ui.ldap.tlsCACert | quote }}
            {{- end }}
            - name: LDAP_TLS_INSECURE_SKIP_VERIFY
              value: {{ .Values.ui.ldap.tlsInsecureSkipVerify | quote }}
            {{- /* D216-9a: the in-memory Idempotency-Key store is only correct with exactly one UI process, so the switch is on only for one replica (with Recreate above). */}}
            - name: UI_IDEMPOTENCY_ENABLED
              value: {{ and .Values.ui.idempotency.enabled (eq (int .Values.ui.replicaCount) 1) | quote }}
            {{- if .Values.ui.backups.enabled }}
            {{- /* D216-9b: persisted fingerprint key, a private directory in the backup PVC so it lives as long as the job records that reference its key_id. */}}
            - name: UI_IDEMPOTENCY_KEY_FILE
              value: /var/lib/ldapium-backups/.idempotency/key
            - name: BACKUP_OPERATOR_CONFIG
              value: /etc/ldapium-backup/operator.json
            - name: BACKUP_POLICY_PATH
              value: /var/lib/ldapium-backups/policies.json
            - name: BACKUP_WORKER_PATH
              value: /opt/ldapium/backup-tools/backup_worker.py
            - name: BACKUP_PYTHON
              value: /usr/bin/python3
            - name: BACKUP_ADMIN_DNS
              value: {{ join ";" .Values.ui.backups.adminDNs | quote }}
            - name: BACKUP_JOB_TIMEOUT_DATA
              value: {{ .Values.ui.backups.jobTimeout.data | quote }}
            - name: BACKUP_JOB_TIMEOUT_LOGS
              value: {{ .Values.ui.backups.jobTimeout.logs | quote }}
            - name: RCLONE_CACHE_DIR
              value: /tmp/rclone
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            {{- end }}
            {{- if .Values.ui.applicationProfiles.enabled }}
            - name: APP_PROFILES_PATH
              value: /var/lib/ldapium/profiles.json
            - name: APP_PROFILES_ADMIN_DNS
              value: {{ join ";" .Values.ui.applicationProfiles.adminDNs | quote }}
            {{- end }}
            {{- if .Values.ui.keycloakAdmin.enabled }}
            - name: KEYCLOAK_ADMIN_URL
              value: {{ .Values.ui.keycloakAdmin.url | quote }}
            - name: KEYCLOAK_ADMIN_REALM
              value: {{ .Values.ui.keycloakAdmin.realm | quote }}
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: {{ .Values.ui.keycloakAdmin.clientID | quote }}
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ui.keycloakAdmin.existingSecret | quote }}
                  key: {{ .Values.ui.keycloakAdmin.secretKey | quote }}
            - name: KEYCLOAK_OBSERVE_CLIENTS
              value: {{ join ";" .Values.ui.keycloakAdmin.observeClients | quote }}
            - name: KEYCLOAK_DELEGATE_CLIENTS
              value: {{ join ";" .Values.ui.keycloakAdmin.delegateClients | quote }}
            - name: KEYCLOAK_MANAGED_GROUP_IDS
              value: {{ join ";" .Values.ui.keycloakAdmin.managedGroupIDs | quote }}
            - name: KEYCLOAK_ISOLATED_REALM
              value: {{ .Values.ui.keycloakAdmin.isolatedRealm | quote }}
            {{- end }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.ui.session.existingSecret }}
                  name: {{ .Values.ui.session.existingSecret }}
                  {{- else }}
                  name: {{ include "ldapium.ui.fullname" . }}-session
                  {{- end }}
                  key: {{ .Values.ui.session.existingSecretKey }}
            - name: SESSION_TTL
              value: {{ .Values.ui.session.ttl | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.ui.session.cookieSecure | quote }}
            - name: UI_LOGIN_FAILURE_LIMIT
              value: {{ .Values.ui.session.loginFailureLimit | quote }}
            - name: UI_LOGIN_FAILURE_WINDOW
              value: {{ .Values.ui.session.loginFailureWindow | quote }}
            - name: UI_PASSWORD_CHANGE_FAILURE_LIMIT
              value: {{ .Values.ui.session.passwordChangeFailureLimit | quote }}
            - name: UI_PASSWORD_CHANGE_FAILURE_WINDOW
              value: {{ .Values.ui.session.passwordChangeFailureWindow | quote }}
            - name: UI_TRUSTED_PROXIES
              value: {{ .Values.ui.trustedProxies | quote }}
            {{- if .Values.ui.cors.allowedOrigins }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ join "," .Values.ui.cors.allowedOrigins | quote }}
            {{- end }}
            {{- if .Values.ui.metrics.enabled }}
            - name: METRICS_ADDR
              value: {{ printf ":%s" (include "ldapium.ui.metricsPort" .) | quote }}
            {{- end }}
            {{- if .Values.ui.machineAuth.enabled }}
            {{- $ma := .Values.ui.machineAuth }}
            - name: MACHINE_AUTH_ENABLED
              value: "true"
            {{- if $ma.issuerURL }}
            - name: MACHINE_OIDC_ISSUER_URL
              value: {{ $ma.issuerURL | quote }}
            {{- end }}
            - name: MACHINE_OIDC_AUDIENCE
              value: {{ $ma.audience | quote }}
            {{- $clients := list }}
            {{- range $c := $ma.allowedClients }}
            {{- $clients = append $clients (printf "%s=%s" $c.id (join "," $c.scopes)) }}
            {{- end }}
            - name: MACHINE_ALLOWED_CLIENTS
              value: {{ join ";" $clients | quote }}
            - name: MACHINE_TOKEN_MAX_TTL
              value: {{ $ma.tokenMaxTTL | quote }}
            - name: MACHINE_CLOCK_SKEW
              value: {{ $ma.clockSkew | quote }}
            - name: MACHINE_LDAP_BIND_DN
              value: {{ $ma.ldapBindDN | quote }}
            - name: MACHINE_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ma.existingSecret | quote }}
                  key: {{ $ma.existingSecretKey | quote }}
            {{- /* The backend does not know the main database rootdn, so the chart derives it from the value the server itself uses (ldap.adminDN, default cn=admin,<rootDN>). Entries are ";"-separated because a DN contains commas. */}}
            {{- $rootDNs := prepend $ma.extraRootDNs (.Values.ldap.adminDN | default (printf "cn=admin,%s" .Values.ldap.rootDN)) }}
            - name: MACHINE_LDAP_ROOT_DNS
              value: {{ join ";" $rootDNs | quote }}
            {{- /* D286-16: disabled adds no environment; backend validates the DN. */}}
            {{- if $ma.revocation.enabled }}
            - name: MACHINE_REVOCATION_ENABLED
              value: "true"
            - name: MACHINE_REVOCATION_REFRESH
              value: {{ printf "%ds" (int $ma.revocation.refreshSeconds) | quote }}
            - name: MACHINE_REVOCATION_MAX_STALE
              value: {{ printf "%ds" (int $ma.revocation.maxStaleSeconds) | quote }}
            - name: MACHINE_REVOCATION_SENTINEL_MAX_AGE
              value: {{ printf "%ds" (int $ma.revocation.sentinelMaxAgeSeconds) | quote }}
            - name: MACHINE_REVOCATION_BASE_DN
              value: {{ $ma.revocation.baseDN | default (printf "ou=revocations,ou=system,%s" .Values.ldap.rootDN) | quote }}
            - name: MACHINE_REVOCATION_MAX_ENTRIES
              value: {{ $ma.revocation.maxEntries | quote }}
            {{- end }}
            - name: MACHINE_JWKS_CACHE_TTL
              value: {{ $ma.jwks.cacheTTL | quote }}
            - name: MACHINE_JWKS_MAX_STALE
              value: {{ $ma.jwks.maxStale | quote }}
            - name: MACHINE_JWKS_MIN_REFRESH
              value: {{ $ma.jwks.minRefresh | quote }}
            - name: MACHINE_AUTH_FAILURE_LIMIT
              value: {{ $ma.authFailureLimit | quote }}
            - name: MACHINE_AUTH_FAILURE_WINDOW
              value: {{ $ma.authFailureWindow | quote }}
            - name: MACHINE_RATE_LIMIT_RPS
              value: {{ $ma.rateLimit.rps | quote }}
            - name: MACHINE_RATE_LIMIT_BURST
              value: {{ $ma.rateLimit.burst | quote }}
            - name: MACHINE_CLIENT_CONCURRENCY
              value: {{ $ma.clientConcurrency | quote }}
            - name: MACHINE_MAX_CONCURRENCY
              value: {{ $ma.maxConcurrency | quote }}
            - name: MACHINE_MAX_AUTH_CONCURRENCY
              value: {{ $ma.maxAuthConcurrency | quote }}
            - name: MACHINE_IP_LIMITER_MAX
              value: {{ $ma.ipLimiterMax | quote }}
            - name: MACHINE_REQUEST_TIMEOUT
              value: {{ printf "%ds" (int $ma.requestTimeoutSeconds) | quote }}
            {{- if $ma.write.enabled }}
            {{- $w := $ma.write }}
            {{- /* machine-write-scope: the switch plus its bind identities; passwords are Secret references only. No operation is opened by these. */}}
            - name: MACHINE_WRITE_ENABLED
              value: "true"
            - name: MACHINE_WRITE_DATA_BIND_DN
              value: {{ $w.data.bindDN | quote }}
            - name: MACHINE_WRITE_DATA_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $w.data.existingSecret | quote }}
                  key: {{ $w.data.existingSecretKey | quote }}
            {{- if $w.lock.enabled }}
            - name: MACHINE_WRITE_LOCK_ENABLED
              value: "true"
            - name: MACHINE_WRITE_LOCK_BIND_DN
              value: {{ $w.lock.bindDN | quote }}
            - name: MACHINE_WRITE_LOCK_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $w.lock.existingSecret | quote }}
                  key: {{ $w.lock.existingSecretKey | quote }}
            {{- end }}
            {{- $subs := list }}
            {{- range $e := $w.subtrees }}
            {{- $subs = append $subs (printf "%s=%s" $e.client (join "|" $e.dns)) }}
            {{- end }}
            - name: MACHINE_WRITE_SUBTREES
              value: {{ join ";" $subs | quote }}
            {{- $grps := list }}
            {{- range $e := $w.groups }}
            {{- $grps = append $grps (printf "%s=%s" $e.client (join "|" $e.dns)) }}
            {{- end }}
            - name: MACHINE_WRITE_GROUPS
              value: {{ join ";" $grps | quote }}
            - name: MACHINE_WRITE_PRIVILEGED_GROUPS
              value: {{ join ";" $w.privilegedGroups | quote }}
            {{- if $w.groupSeedDN }}
            - name: MACHINE_WRITE_GROUP_SEED_DN
              value: {{ $w.groupSeedDN | quote }}
            {{- end }}
            - name: MACHINE_WRITE_RATE_LIMIT_RPS
              value: {{ $w.limits.rps | quote }}
            - name: MACHINE_WRITE_RATE_LIMIT_BURST
              value: {{ $w.limits.burst | quote }}
            - name: MACHINE_WRITE_GLOBAL_SLOTS
              value: {{ $w.limits.globalSlots | quote }}
            {{- if $w.cred.enabled }}
            {{- $c := $w.cred }}
            {{- /* v2c (#379 T-026): the W_cred identity, the cn=config reader and the canaries; passwords are Secret references only. */}}
            - name: MACHINE_WRITE_CRED_ENABLED
              value: "true"
            - name: MACHINE_WRITE_CRED_BIND_DN
              value: {{ $c.bindDN | quote }}
            - name: MACHINE_WRITE_CRED_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $c.existingSecret | quote }}
                  key: {{ $c.existingSecretKey | quote }}
            {{- $csubs := list }}
            {{- range $e := $c.subtrees }}
            {{- $csubs = append $csubs (printf "%s=%s" $e.client (join "|" $e.dns)) }}
            {{- end }}
            - name: MACHINE_WRITE_CRED_SUBTREES
              value: {{ join ";" $csubs | quote }}
            - name: MACHINE_WRITE_CRED_PENDING_POLICY_DN
              value: {{ $c.pendingPolicyDN | quote }}
            {{- if $c.policyDNs }}
            - name: MACHINE_WRITE_CRED_POLICY_DNS
              value: {{ join ";" $c.policyDNs | quote }}
            {{- end }}
            - name: MACHINE_WRITE_CRED_MIN_LENGTH
              value: {{ $c.minLength | quote }}
            - name: MACHINE_WRITE_CRED_RATE_LIMIT_RPS
              value: {{ $c.rateLimitRPS | quote }}
            - name: MACHINE_WRITE_CRED_PENDING_TTL
              value: {{ $c.pendingTTL | quote }}
            - name: MACHINE_WRITE_CRED_ACL_READER_DN
              value: {{ $c.aclReader.dn | quote }}
            - name: MACHINE_WRITE_CRED_ACL_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $c.aclReader.existingSecret | quote }}
                  key: {{ $c.aclReader.existingSecretKey | quote }}
            {{- $cans := list }}
            {{- range $e := $c.canaries }}
            {{- $cans = append $cans (printf "%s|%s|%s" $e.withPassword $e.unmarked $e.pending) }}
            {{- end }}
            - name: MACHINE_WRITE_CRED_CANARIES
              value: {{ join ";" $cans | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.ui.sso.enabled }}
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_ISSUER_URL
              value: {{ .Values.ui.sso.issuerURL | quote }}
            - name: SSO_CLIENT_ID
              value: {{ .Values.ui.sso.clientID | quote }}
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ui.sso.existingSecret }}
                  key: {{ .Values.ui.sso.existingSecretKey }}
            - name: SSO_ADMIN_ROLE
              value: {{ .Values.ui.sso.adminRole | quote }}
            - name: SSO_CALLBACK_ORIGINS
              value: {{ join "," .Values.ui.sso.callbackOrigins | quote }}
            - name: LDAP_SERVICE_ACCOUNT_DN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ui.ldapServiceAccount.existingSecret }}
                  key: {{ .Values.ui.ldapServiceAccount.dnKey }}
            - name: LDAP_SERVICE_ACCOUNT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ui.ldapServiceAccount.existingSecret }}
                  key: {{ .Values.ui.ldapServiceAccount.passwordKey }}
            {{- end }}
          {{- if or .Values.ui.applicationProfiles.enabled .Values.ui.backups.enabled }}
          volumeMounts:
            {{- if .Values.ui.applicationProfiles.enabled }}
            - name: application-profiles
              mountPath: /var/lib/ldapium
            {{- end }}
            {{- if .Values.ui.backups.enabled }}
            - name: backup-archives
              mountPath: /var/lib/ldapium-backups
            - name: backup-operator
              mountPath: /etc/ldapium-backup
              readOnly: true
            - name: backup-tmp
              mountPath: /tmp
            {{- if .Values.ui.backups.logExistingClaim }}
            - name: backup-logs
              mountPath: /var/log/ldapium-backup
              readOnly: true
            {{- end }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
{{- end }}
