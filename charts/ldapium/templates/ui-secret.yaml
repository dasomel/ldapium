{{- if and .Values.ui.enabled (not .Values.ui.session.existingSecret) }}
{{- $secretName := printf "%s-session" (include "ldapium.ui.fullname" .) }}
{{- $key := .Values.ui.session.existingSecretKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- /* Same floor as ui/backend/internal/config/config.go: a shorter SESSION_SECRET makes the UI refuse to start. */}}
{{- if and .Values.ui.session.secret (lt (len .Values.ui.session.secret) 32) }}
{{- fail "ui.session.secret must be at least 32 bytes (the UI refuses to start with a shorter SESSION_SECRET); generate one with: openssl rand -base64 48" }}
{{- end }}
{{- $generate := and (not .Values.ui.session.secret) (not (and $existing (hasKey $existing.data $key))) }}
{{- /*
  Fail closed instead of generating in an offline render (same detection as the
  admin Secret): `lookup` is empty under `helm template`, ArgoCD/Flux and
  --dry-run=client, so every render/sync would mint a NEW SESSION_SECRET and log
  every user out. No lockout risk here (unlike the admin password), but a
  deterministic derivation has no safe secret input, so require an explicit one.
  A live cluster always has the release namespace, so an empty lookup of it
  means "offline", never "first install".
*/}}
{{- if and $generate (not (lookup "v1" "Namespace" "" .Release.Namespace)) }}
{{- fail "cannot generate the UI session secret in an offline render (helm template, ArgoCD/Flux, --dry-run=client: Secret lookup is unavailable, so every render would produce a different SESSION_SECRET and invalidate all UI sessions); set ui.session.secret or ui.session.existingSecret. A brand-new namespace (helm install --create-namespace) is also not visible to lookup: create the namespace first, or set the secret explicitly" }}
{{- end }}
{{- /*
  D-ui1: on upgrade with the namespace visible but the Secret missing, regenerate
  (unlike the admin Secret). SESSION_SECRET only signs UI sessions and is not
  bound to persisted data, so the worst case is one forced re-login. No
  `helm.sh/resource-policy: keep`: uninstall removes it cleanly, nothing is orphaned.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ldapium.ui.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.ui.session.secret }}
  {{ $key }}: {{ .Values.ui.session.secret | b64enc }}
  {{- else if and $existing (hasKey $existing.data $key) }}
  {{ $key }}: {{ index $existing.data $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
