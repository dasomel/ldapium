apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ldapium.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ldapium.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "ldapium.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ldapium.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ldapium.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ldapium.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- else if gt (int .Values.replicaCount) 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "ldapium.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: openldap
          image: {{ include "ldapium.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: ldap
              containerPort: 389
              protocol: TCP
            {{- if .Values.tls.enabled }}
            - name: ldaps
              containerPort: 636
              protocol: TCP
            {{- end }}
          env:
            - name: LDAP_ROOT_DN
              value: {{ .Values.ldap.rootDN | quote }}
            {{- if .Values.ldap.orgName }}
            - name: LDAP_ORG_NAME
              value: {{ .Values.ldap.orgName | quote }}
            {{- end }}
            {{- if .Values.ldap.adminDN }}
            - name: LDAP_ADMIN_DN
              value: {{ .Values.ldap.adminDN | quote }}
            {{- end }}
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ldapium.adminSecretName" . }}
                  key: {{ .Values.auth.existingSecretKey }}
            - name: LDAP_LOG_LEVEL
              value: {{ .Values.ldap.logLevel | quote }}
            - name: LDAP_PASSWORD_HASH
              value: {{ .Values.ldap.passwordHash | quote }}
            - name: LDAP_UNIQUE_ATTRIBUTES
              value: {{ .Values.ldap.uniqueAttributes | quote }}
            - name: LDAP_PASSWORD_POLICY_ENABLED
              value: {{ .Values.ldap.passwordPolicyEnabled | quote }}
            - name: LDAP_MAX_OPEN_FILES
              value: {{ .Values.ldap.maxOpenFiles | quote }}
            - name: LDAP_DB_MAX_SIZE
              value: {{ (default (include "ldapium.dataVolumeBytes" .) .Values.ldap.dbMaxSize) | quote }}
            - name: LDAP_AUDIT_ENABLED
              value: {{ .Values.audit.enabled | quote }}
            {{- if .Values.audit.enabled }}
            - name: LDAP_AUDIT_FILE
              value: {{ .Values.audit.file | quote }}
            {{- end }}
            - name: LDAP_TLS_ENABLED
              value: {{ .Values.tls.enabled | quote }}
            {{- if .Values.tls.enabled }}
            - name: LDAP_TLS_CERT_FILE
              value: {{ .Values.tls.certFile | quote }}
            - name: LDAP_TLS_KEY_FILE
              value: {{ .Values.tls.keyFile | quote }}
            {{- if .Values.tls.caFile }}
            - name: LDAP_TLS_CA_FILE
              value: {{ .Values.tls.caFile | quote }}
            {{- end }}
            {{- end }}
            {{- if and .Values.seed.enabled .Values.seed.ldifs }}
            - name: LDAP_SEED_DIR
              value: /opt/ldifs
            {{- end }}
            {{- if eq (include "ldapium.replicationEnabled" .) "true" }}
            - name: LDAP_REPLICATION_ENABLED
              value: "true"
            - name: LDAP_REPLICATION_PEERS
              value: {{ include "ldapium.replicationPeers" . | quote }}
            {{- if .Values.replication.bindDN }}
            - name: LDAP_REPLICATION_BIND_DN
              value: {{ .Values.replication.bindDN | quote }}
            {{- end }}
            {{- if .Values.replication.existingSecret }}
            - name: LDAP_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.replication.existingSecret }}
                  key: {{ .Values.replication.existingSecretKey }}
            {{- end }}
            - name: LDAP_REPLICATION_RETRY
              value: {{ .Values.replication.retry | quote }}
            - name: LDAP_REPLICATION_INTERVAL
              value: {{ .Values.replication.interval | quote }}
            {{- else }}
            - name: LDAP_REPLICATION_ENABLED
              value: "false"
            {{- end }}
          startupProbe:
            exec:
              command:
                - ldapwhoami
                - -x
                - -H
                - ldapi://%2Fvar%2Flib%2Fopenldap%2Frun%2Fldapi
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          livenessProbe:
            exec:
              command:
                - ldapwhoami
                - -x
                - -H
                - ldapi://%2Fvar%2Flib%2Fopenldap%2Frun%2Fldapi
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            exec:
              command:
                - ldapwhoami
                - -x
                - -H
                - ldapi://%2Fvar%2Flib%2Fopenldap%2Frun%2Fldapi
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/openldap/slapd.d
            - name: data
              mountPath: /var/lib/openldap/data
            - name: run
              mountPath: /var/lib/openldap/run
            - name: tmp
              mountPath: /tmp
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/openldap/tls
              readOnly: true
            {{- end }}
            {{- if and .Values.seed.enabled .Values.seed.ldifs }}
            - name: seed
              mountPath: /opt/ldifs
              readOnly: true
            {{- end }}

        {{- if and .Values.metrics .Values.metrics.enabled }}
        - name: metrics
          image: {{ include "ldapium.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: metrics
              containerPort: 9330
              protocol: TCP
          env:
            - name: LDAP_ADDR
              value: ldap://127.0.0.1:389
            - name: LDAP_USER
              value: cn=monitoring,cn=Monitor
            - name: LDAP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "ldapium.adminSecretName" . }}
                  key: {{ .Values.auth.existingSecretKey }}
            - name: LDAP_ROOT_DN
              value: {{ .Values.ldap.rootDN | quote }}
            {{- if eq (include "ldapium.replicationEnabled" .) "true" }}
            - name: LDAP_REPLICATION_ENABLED
              value: "true"
            - name: LDAP_REPLICATION_PEERS
              value: {{ include "ldapium.replicationPeers" . | quote }}
            {{- else }}
            - name: LDAP_REPLICATION_ENABLED
              value: "false"
            {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              args="--prom-addr=:9330 --ldap-addr=${LDAP_ADDR} --ldap-user=${LDAP_USER} --replication-object=${LDAP_ROOT_DN}"
              if [ "${LDAP_REPLICATION_ENABLED}" = "true" ]; then
                ordinal="${HOSTNAME##*-}"
                server_id=$((ordinal + 1))
                args="$args --server-id=$server_id"
                i=0
                oldifs=$IFS
                IFS=','
                for peer in $LDAP_REPLICATION_PEERS; do
                  i=$((i + 1))
                  if [ "$i" -ne "$server_id" ]; then
                    args="$args --replication-server=$peer"
                  fi
                done
                IFS=$oldifs
              fi
              exec /usr/local/bin/openldap_exporter $args
          resources:
            {{- toYaml .Values.metrics.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
        {{- end }}
        {{- if and .Values.seed.enabled .Values.seed.ldifs }}
        - name: seed
          configMap:
            name: {{ include "ldapium.fullname" . }}-seed
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: config
        labels:
          {{- include "ldapium.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.config.accessModes | nindent 10 }}
        {{- if .Values.persistence.config.storageClassName }}
        storageClassName: {{ .Values.persistence.config.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.config.size }}
    - metadata:
        name: data
        labels:
          {{- include "ldapium.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.data.accessModes | nindent 10 }}
        {{- if .Values.persistence.data.storageClassName }}
        storageClassName: {{ .Values.persistence.data.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.data.size }}
