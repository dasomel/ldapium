{{- if not .Values.auth.existingSecret }}
{{- $name := include "ldapium.adminSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $generate := and (not .Values.auth.adminPassword) (not (and $existing (hasKey $existing.data .Values.auth.existingSecretKey))) }}
{{- /*
  Fail closed instead of generating in an offline render. `lookup` returns empty
  under `helm template`, ArgoCD/Flux rendering and --dry-run=client, so every
  render would mint a NEW password while the data volume keeps the rootpw hashed
  at first bootstrap -> lockout. A live cluster always has the release namespace,
  so an empty lookup of it means "offline", never "first install".
*/}}
{{- if and $generate (not (lookup "v1" "Namespace" "" .Release.Namespace)) }}
{{- fail "cannot generate the admin password in an offline render (helm template, ArgoCD/Flux, --dry-run=client: Secret lookup is unavailable, so every render would produce a different password and lock out existing LDAP data); set auth.adminPassword or auth.existingSecret. A brand-new namespace (helm install --create-namespace) is also not visible to lookup: create the namespace first, or set the password explicitly" }}
{{- end }}
{{- /*
  The namespace is visible but the admin Secret is not, and this is an upgrade:
  the data volume already holds a rootpw derived from the ORIGINAL password, so a
  freshly generated one would lock the directory out (e.g. the Secret was deleted,
  or an existingSecret deployment was upgraded with --reset-values). Never mint a
  new password on upgrade.
*/}}
{{- if and $generate .Release.IsUpgrade }}
{{- fail "admin Secret not found on upgrade; refusing to generate a new password because the directory keeps the original one. Restore the Secret, or set auth.adminPassword / auth.existingSecret to the ORIGINAL password" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  {{- if not .Values.auth.adminPassword }}
  annotations:
    # Generated once and reused by lookup (kept on every upgrade too, or the
    # annotation would be stripped); the rootpw on the retained PVC is
    # derived from it, so uninstall must not delete it. See chart README.
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "ldapium.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.auth.adminPassword }}
  {{ .Values.auth.existingSecretKey }}: {{ .Values.auth.adminPassword | b64enc }}
  {{- else if and $existing (hasKey $existing.data .Values.auth.existingSecretKey) }}
  {{ .Values.auth.existingSecretKey }}: {{ index $existing.data .Values.auth.existingSecretKey }}
  {{- else }}
  {{ .Values.auth.existingSecretKey }}: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
{{- end }}
