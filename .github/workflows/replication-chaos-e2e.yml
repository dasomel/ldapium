name: Replication Chaos E2E

on:
  pull_request:
    paths:
      - "image/**"
      - "charts/**"
      - ".github/fixtures/replication-offline-seed-values.yaml"
      - ".github/workflows/replication-chaos-e2e.yml"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  replication-chaos:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t ldapium:chaos image

      - name: Create cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: chaos

      - name: Load image
        run: kind load docker-image ldapium:chaos --name chaos

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install the initial provider with an offline LDIF seed
        run: |
          helm install directory charts/ldapium \
            --namespace directory --create-namespace \
            -f .github/fixtures/replication-offline-seed-values.yaml \
            --set replicaCount=1 \
            --set image.repository=ldapium \
            --set image.tag=chaos \
            --set image.pullPolicy=Never \
            --set-string 'ldap.adminDN=cn=admin\,dc=example\,dc=org' \
            --set auth.adminPassword='chaos-e2e-password' \
            --set ui.enabled=false \
            --wait --timeout 10m

      - name: Verify the initial provider applied the offline LDIF seed
        run: |
          set -euo pipefail
          seed_dn='uid=offline-seed,ou=bootstrap,dc=example,dc=org'
          kubectl -n directory exec directory-ldapium-0 -c openldap -- \
            ldapsearch -x -LLL -H ldap://localhost:389 \
            -D 'cn=admin,dc=example,dc=org' -w 'chaos-e2e-password' \
            -b "$seed_dn" -s base dn \
            | grep -Fxc "dn: $seed_dn" | grep -qx 1

      - name: Disable the seed and expand to three replicated providers
        run: |
          set -euo pipefail
          # --reset-values drops the first-install seed fixture. StatefulSet
          # ordinal 0 retains its PVCs, while 1 and 2 receive fresh claims and
          # must populate through syncrepl's initial refresh.
          helm upgrade directory charts/ldapium \
            --namespace directory \
            --reset-values \
            --set replicaCount=3 \
            --set image.repository=ldapium \
            --set image.tag=chaos \
            --set image.pullPolicy=Never \
            --set-string 'ldap.adminDN=cn=admin\,dc=example\,dc=org' \
            --set auth.adminPassword='chaos-e2e-password' \
            --set ui.enabled=false \
            --wait --timeout 10m
          kubectl -n directory rollout status statefulset/directory-ldapium --timeout=10m
          if kubectl -n directory get configmap directory-ldapium-seed >/dev/null 2>&1; then
            echo '::error::seed ConfigMap remained after the replication upgrade'
            exit 1
          fi
          for ordinal in 1 2; do
            if [ "$(kubectl -n directory get pod "directory-ldapium-${ordinal}" -o jsonpath='{.spec.volumes[?(@.name=="seed")].name}')" = 'seed' ]; then
              echo "::error::provider ${ordinal} still mounts the offline seed"
              exit 1
            fi
          done

      - name: Verify offline seed replication and post-bootstrap convergence
        run: |
          set -euo pipefail
          seed_dn='uid=offline-seed,ou=bootstrap,dc=example,dc=org'
          for ordinal in 0 1 2; do
            i=0
            until result=$(kubectl -n directory exec "directory-ldapium-${ordinal}" -c openldap -- \
              ldapsearch -x -LLL -H ldap://localhost:389 \
              -D 'cn=admin,dc=example,dc=org' -w 'chaos-e2e-password' \
              -b "$seed_dn" -s base dn 2>/dev/null) \
              && [ "$(printf '%s\n' "$result" | grep -Fxc "dn: $seed_dn" || true)" -eq 1 ]; do
              i=$((i+1)); [ "$i" -lt 60 ] || { echo "::error::provider ${ordinal} never exposed exactly one offline seed entry"; exit 1; }
              sleep 2
            done
            echo "PASS: provider ${ordinal} exposes the offline seed exactly once"
          done

          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -ec '
            ldapadd -x -H ldap://localhost:389 -D cn=admin,dc=example,dc=org -w chaos-e2e-password <<EOF
          dn: uid=post-bootstrap,ou=bootstrap,dc=example,dc=org
          objectClass: inetOrgPerson
          uid: post-bootstrap
          cn: Post Bootstrap
          sn: Test
          EOF
          '
          for ordinal in 0 1 2; do
            i=0
            until kubectl -n directory exec "directory-ldapium-${ordinal}" -c openldap -- \
              ldapsearch -x -LLL -H ldap://localhost:389 \
              -D 'cn=admin,dc=example,dc=org' -w 'chaos-e2e-password' \
              -b 'uid=post-bootstrap,ou=bootstrap,dc=example,dc=org' -s base dn \
              | grep -Fxc 'dn: uid=post-bootstrap,ou=bootstrap,dc=example,dc=org' | grep -qx 1; do
              i=$((i+1)); [ "$i" -lt 60 ] || { echo "::error::provider ${ordinal} never received the post-bootstrap write"; exit 1; }
              sleep 2
            done
          done
          for i in $(seq 1 60); do
            for ordinal in 0 1 2; do
              kubectl -n directory exec "directory-ldapium-${ordinal}" -c openldap -- sh -ec \
                'ldapsearch -x -LLL -H ldapi://%2Fvar%2Flib%2Fopenldap%2Frun%2Fldapi -D "cn=admin,cn=config" -w "chaos-e2e-password" -b "dc=example,dc=org" -s base contextCSN' \
                | grep '^contextCSN:' | sort > "/tmp/offline-seed-contextcsn-${ordinal}.txt"
            done
            if diff /tmp/offline-seed-contextcsn-0.txt /tmp/offline-seed-contextcsn-1.txt \
              && diff /tmp/offline-seed-contextcsn-0.txt /tmp/offline-seed-contextcsn-2.txt; then
              break
            fi
            [ "$i" -lt 60 ] || { echo '::error::providers never converged on contextCSN after the post-bootstrap write'; exit 1; }
            sleep 2
          done
          echo "PASS: all providers converged after the post-bootstrap write" | tee -a /tmp/chaos-evidence.txt

      - name: Seed baseline data
        run: |
          kubectl -n directory run ldap-client --rm -i --restart=Never --image=ldapium:chaos -- \
            sh -ec '
              ldapadd -x -H ldap://directory-ldapium:389 -D cn=admin,dc=example,dc=org -w chaos-e2e-password <<EOF
          dn: ou=chaos,dc=example,dc=org
          objectClass: organizationalUnit
          ou: chaos

          dn: uid=baseline,ou=chaos,dc=example,dc=org
          objectClass: inetOrgPerson
          uid: baseline
          cn: Baseline
          sn: Test

          dn: uid=probe-target,ou=chaos,dc=example,dc=org
          objectClass: inetOrgPerson
          uid: probe-target
          cn: Probe Target
          sn: Test
          EOF
            '

      - name: Start continuous write probe during pod deletion
        run: |
          kubectl -n directory apply -f - <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: write-availability-probe
          spec:
            restartPolicy: Never
            containers:
              - name: probe
                image: ldapium:chaos
                imagePullPolicy: Never
                command:
                  - sh
                  - -c
                  - |
                    seq=0
                    while [ ! -f /tmp/stop ]; do
                      seq=$((seq + 1))
                      if printf 'dn: uid=probe-target,ou=chaos,dc=example,dc=org\nchangetype: modify\nreplace: description\ndescription: probe-%s\n' "$seq" | \
                        ldapmodify -x -o nettimeout=2 -H ldap://directory-ldapium:389 \
                          -D "cn=admin,dc=example,dc=org" -w "chaos-e2e-password" >/dev/null 2>&1; then
                        echo OK
                      else
                        echo FAIL
                      fi
                      sleep 1
                    done
          EOF
          kubectl -n directory wait --for=condition=Ready pod/write-availability-probe --timeout=60s

      - name: Delete one provider
        run: |
          kubectl -n directory delete pod directory-ldapium-1 --wait=true
          kubectl -n directory wait --for=condition=Ready pod/directory-ldapium-0 --timeout=180s
          kubectl -n directory wait --for=condition=Ready pod/directory-ldapium-2 --timeout=180s

      - name: Continue writes while one provider is down
        run: |
          kubectl -n directory run ldap-client --rm -i --restart=Never --image=ldapium:chaos -- \
            sh -ec '
              for i in 1 2 3 4 5; do
                ldapadd -x -H ldap://directory-ldapium:389 -D cn=admin,dc=example,dc=org -w chaos-e2e-password <<EOF
          dn: uid=chaos-${i},ou=chaos,dc=example,dc=org
          objectClass: inetOrgPerson
          uid: chaos-${i}
          cn: Chaos ${i}
          sn: Test
          EOF
              done
            '

      - name: Stop continuous write probe and evaluate availability
        run: |
          set -euo pipefail
          kubectl -n directory exec write-availability-probe -- touch /tmp/stop
          kubectl -n directory wait --for=jsonpath='{.status.phase}'=Succeeded pod/write-availability-probe --timeout=60s
          log=/tmp/chaos-write-availability.txt
          kubectl -n directory logs write-availability-probe > "$log"
          kubectl -n directory delete pod write-availability-probe --ignore-not-found

          total=$(grep -cE '^(OK|FAIL)$' "$log" || true)
          ok=$(grep -c '^OK$' "$log" || true)
          streak=$(awk '/^FAIL$/ { n++; if (n > m) m = n; next } { n = 0 } END { print m + 0 }' "$log")
          echo "write availability during pod deletion: ${ok}/${total}, longest consecutive failure run: ${streak}" | tee -a /tmp/chaos-evidence.txt
          printf 'write_attempts=%s\nwrite_succeeded=%s\nlongest_write_failure_run=%s\n' "$total" "$ok" "$streak" \
            > /tmp/write-availability-summary.txt

          test "$total" -ge 5
          test "$streak" -le 5

      - name: Wait for failed provider to rejoin
        run: |
          start=$(date +%s)
          kubectl -n directory wait --for=condition=Ready pod/directory-ldapium-1 --timeout=300s
          elapsed=$(( $(date +%s) - start ))
          echo "single-provider recovery seconds=${elapsed}" | tee -a /tmp/chaos-evidence.txt
          test "$elapsed" -le 300

      - name: Verify convergence on all three providers
        run: |
          set -euo pipefail
          start=$(date +%s)
          for pod in directory-ldapium-0 directory-ldapium-1 directory-ldapium-2; do
            kubectl -n directory run ldap-client --rm -i --restart=Never --image=ldapium:chaos -- \
              sh -ec "ldapsearch -x -H ldap://${pod}.directory-ldapium-headless.directory.svc.cluster.local:389 -b ou=chaos,dc=example,dc=org -LLL '(uid=chaos-*)' uid | grep -c '^uid: chaos-' | grep -q 5"
          done
          elapsed=$(( $(date +%s) - start ))
          echo "single-provider convergence seconds=${elapsed}" | tee -a /tmp/chaos-evidence.txt
          test "$elapsed" -le 300

      - name: Sequentially fail a second provider
        run: |
          kubectl -n directory delete pod directory-ldapium-2 --wait=true
          kubectl -n directory wait --for=condition=Ready pod/directory-ldapium-0 --timeout=180s

      - name: Continue writes with only one provider available
        run: |
          kubectl -n directory run ldap-client --rm -i --restart=Never --image=ldapium:chaos -- \
            sh -ec '
              for i in 6 7 8; do
                ldapadd -x -H ldap://directory-ldapium:389 -D cn=admin,dc=example,dc=org -w chaos-e2e-password <<EOF
          dn: uid=sequential-${i},ou=chaos,dc=example,dc=org
          objectClass: inetOrgPerson
          uid: sequential-${i}
          cn: Sequential ${i}
          sn: Test
          EOF
              done
            '

      - name: Recover second provider and converge
        run: |
          start=$(date +%s)
          kubectl -n directory wait --for=condition=Ready pod/directory-ldapium-2 --timeout=300s
          for pod in directory-ldapium-0 directory-ldapium-1 directory-ldapium-2; do
            kubectl -n directory run ldap-client --rm -i --restart=Never --image=ldapium:chaos -- \
              sh -ec "ldapsearch -x -H ldap://${pod}.directory-ldapium-headless.directory.svc.cluster.local:389 -b ou=chaos,dc=example,dc=org -LLL '(uid=sequential-*)' uid | grep -c '^uid: sequential-' | grep -q 3"
          done
          elapsed=$(( $(date +%s) - start ))
          echo "two-node-sequential recovery+convergence seconds=${elapsed}" | tee -a /tmp/chaos-evidence.txt
          test "$elapsed" -le 300

      - name: Partition one provider and write on both sides of the split
        run: |
          set -euo pipefail
          # A partition is not a pod deletion. Both halves stay up and both keep
          # accepting writes, which is the case multi-provider replication has to
          # merge afterwards and the one a delete-the-pod test never produces.
          # kind puts every pod on the one node, so pod-to-pod traffic crosses
          # that node's FORWARD chain and can be dropped there.
          ip=$(kubectl -n directory get pod directory-ldapium-2 -o jsonpath='{.status.podIP}')
          echo "$ip" > /tmp/partitioned-ip
          docker exec chaos-control-plane iptables -I FORWARD 1 -s "$ip" -j DROP
          docker exec chaos-control-plane iptables -I FORWARD 1 -d "$ip" -j DROP
          echo "partitioned directory-ldapium-2 (${ip})" | tee -a /tmp/chaos-evidence.txt
          write() {
            kubectl -n directory exec "directory-ldapium-$1" -c openldap -- sh -c \
              "ldapadd -x -H ldap://localhost:389 -D 'cn=admin,dc=example,dc=org' -w 'chaos-e2e-password' <<EOF
          dn: uid=$2,ou=chaos,dc=example,dc=org
          objectClass: inetOrgPerson
          uid: $2
          cn: $2
          sn: Test
          EOF"
          }
          has() {
            kubectl -n directory exec "directory-ldapium-$1" -c openldap -- \
              ldapsearch -x -LLL -H ldap://localhost:389 \
              -D 'cn=admin,dc=example,dc=org' -w 'chaos-e2e-password' \
              -b "uid=$2,ou=chaos,dc=example,dc=org" -s base dn >/dev/null 2>&1
          }
          write 0 partition-majority
          write 2 partition-minority
          i=0
          until has 1 partition-majority; do
            i=$((i+1)); [ "$i" -lt 30 ] || { echo "::error::the majority side did not converge"; exit 1; }
            sleep 2
          done
          echo "PASS: the majority side converged while the third provider was cut off"
          # If this ever succeeds the partition was never real and everything
          # below is asserting nothing.
          if has 2 partition-majority; then
            echo "::error::the partitioned provider still received the majority write"
            exit 1
          fi
          echo "PASS: the partitioned provider is genuinely isolated"

      - name: Heal the partition and require both sides to survive it
        run: |
          set -euo pipefail
          ip=$(cat /tmp/partitioned-ip)
          docker exec chaos-control-plane iptables -D FORWARD -s "$ip" -j DROP
          docker exec chaos-control-plane iptables -D FORWARD -d "$ip" -j DROP
          rm -f /tmp/partitioned-ip
          start=$(date +%s)
          for ordinal in 0 1 2; do
            for uid in partition-majority partition-minority; do
              kubectl -n directory exec "directory-ldapium-${ordinal}" -c openldap -- sh -c \
                "i=0; until ldapsearch -x -LLL -H ldap://localhost:389 -D 'cn=admin,dc=example,dc=org' -w 'chaos-e2e-password' -b 'uid=${uid},ou=chaos,dc=example,dc=org' -s base dn >/dev/null 2>&1; do i=\$((i+1)); [ \"\$i\" -lt 60 ] || exit 1; sleep 2; done"
            done
            echo "PASS: provider ${ordinal} carries both sides of the partition"
          done
          elapsed=$(( $(date +%s) - start ))
          echo "partition rejoin convergence seconds=${elapsed}" | tee -a /tmp/chaos-evidence.txt
          test "$elapsed" -le 300
          # Neither side may be silently dropped, and the providers must agree on
          # what they hold rather than merely each holding something.
          for ordinal in 0 1 2; do
            kubectl -n directory exec "directory-ldapium-${ordinal}" -c openldap -- sh -c \
              'ldapsearch -x -LLL -H ldapi://%2Fvar%2Flib%2Fopenldap%2Frun%2Fldapi -D "cn=admin,cn=config" -w "chaos-e2e-password" -b "dc=example,dc=org" -s base contextCSN' \
              | grep '^contextCSN:' | sort > "/tmp/contextcsn-${ordinal}.txt"
          done
          diff /tmp/contextcsn-0.txt /tmp/contextcsn-1.txt
          diff /tmp/contextcsn-0.txt /tmp/contextcsn-2.txt
          echo "PASS: all three providers report the same contextCSN set" | tee -a /tmp/chaos-evidence.txt

      - name: Partition one provider and modify the SAME entry on both sides
        run: |
          set -euo pipefail
          # The scenario above proves disjoint writes across a partition
          # converge — it never puts two providers in actual disagreement
          # about one entry's state. This one does: uid=baseline (from
          # "Seed baseline data") gets a different `description` written on
          # each side of a real partition, which is the one thing #22 flags
          # as unverified — multi-provider's entryCSN-timestamp conflict
          # resolution is silent, so nothing here should error on write;
          # the question this answers is what survives once the halves
          # rejoin, not whether the writes themselves succeed.
          ip=$(kubectl -n directory get pod directory-ldapium-2 -o jsonpath='{.status.podIP}')
          echo "$ip" > /tmp/partitioned-ip
          docker exec chaos-control-plane iptables -I FORWARD 1 -s "$ip" -j DROP
          docker exec chaos-control-plane iptables -I FORWARD 1 -d "$ip" -j DROP
          echo "partitioned directory-ldapium-2 (${ip}) for the same-entry conflict test" | tee -a /tmp/chaos-evidence.txt

          write_description() {
            kubectl -n directory exec "directory-ldapium-$1" -c openldap -- sh -c \
              "ldapmodify -x -H ldap://localhost:389 -D 'cn=admin,dc=example,dc=org' -w 'chaos-e2e-password' <<EOF
          dn: uid=baseline,ou=chaos,dc=example,dc=org
          changetype: modify
          replace: description
          description: $2
          EOF"
          }
          write_description 0 majority-side-value
          write_description 2 minority-side-value
          echo "PASS: both sides accepted a conflicting write with no error — this overlay never rejects one"

          majority_seen=$(kubectl -n directory exec directory-ldapium-0 -c openldap -- \
            ldapsearch -x -LLL -H ldap://localhost:389 -D 'cn=admin,dc=example,dc=org' -w 'chaos-e2e-password' \
            -b uid=baseline,ou=chaos,dc=example,dc=org -s base description | grep '^description:')
          minority_seen=$(kubectl -n directory exec directory-ldapium-2 -c openldap -- \
            ldapsearch -x -LLL -H ldap://localhost:389 -D 'cn=admin,dc=example,dc=org' -w 'chaos-e2e-password' \
            -b uid=baseline,ou=chaos,dc=example,dc=org -s base description | grep '^description:')
          echo "majority side sees: ${majority_seen}"
          echo "minority side sees: ${minority_seen}"
          if [ "$majority_seen" = "$minority_seen" ]; then
            echo "::error::both sides agree on the entry mid-partition — the partition was never real"
            exit 1
          fi
          echo "PASS: the two sides genuinely disagree on the same entry while partitioned" | tee -a /tmp/chaos-evidence.txt

      - name: Heal the partition and confirm the conflict resolved silently
        run: |
          set -euo pipefail
          ip=$(cat /tmp/partitioned-ip)
          docker exec chaos-control-plane iptables -D FORWARD -s "$ip" -j DROP
          docker exec chaos-control-plane iptables -D FORWARD -d "$ip" -j DROP
          rm -f /tmp/partitioned-ip

          # Convergence here means all three providers hold the identical
          # value, not that the value is any particular one. There is no
          # majority-wins rule to assert — see the workflow's own manual
          # local repro (session notes for #22) where the *minority* side's
          # write won purely because its entryCSN timestamp was later. If
          # this ever changes to reject-on-conflict or merge, this step
          # should fail loudly rather than silently keep passing.
          start=$(date +%s)
          for ordinal in 0 1 2; do
            i=0
            until [ "$(kubectl -n directory exec directory-ldapium-0 -c openldap -- \
                ldapsearch -x -LLL -H ldap://localhost:389 -D 'cn=admin,dc=example,dc=org' -w 'chaos-e2e-password' \
                -b uid=baseline,ou=chaos,dc=example,dc=org -s base description | grep '^description:')" \
              = "$(kubectl -n directory exec "directory-ldapium-${ordinal}" -c openldap -- \
                ldapsearch -x -LLL -H ldap://localhost:389 -D 'cn=admin,dc=example,dc=org' -w 'chaos-e2e-password' \
                -b uid=baseline,ou=chaos,dc=example,dc=org -s base description | grep '^description:')" ]; do
              i=$((i+1)); [ "$i" -lt 60 ] || { echo "::error::provider ${ordinal} never converged with provider 0 on the conflicting entry"; exit 1; }
              sleep 2
            done
          done
          elapsed=$(( $(date +%s) - start ))
          echo "same-entry conflict convergence seconds=${elapsed}" | tee -a /tmp/chaos-evidence.txt

          winner=$(kubectl -n directory exec directory-ldapium-0 -c openldap -- \
            ldapsearch -x -LLL -H ldap://localhost:389 -D 'cn=admin,dc=example,dc=org' -w 'chaos-e2e-password' \
            -b uid=baseline,ou=chaos,dc=example,dc=org -s base description | grep '^description:')
          case "$winner" in
            "description: majority-side-value"|"description: minority-side-value") : ;;
            *) echo "::error::converged value is neither write — corrupted or merged: ${winner}"; exit 1 ;;
          esac
          echo "::warning::same-entry conflict resolved silently — winner: '${winner}', no error or conflict record anywhere. This is expected slapd behavior (entryCSN last-write-wins), not a bug in this chart — see #22 for the tracked follow-up to detect and log this rather than let it stay silent." | tee -a /tmp/chaos-evidence.txt
          echo "PASS: exactly one write survived and every provider agrees on it" | tee -a /tmp/chaos-evidence.txt

      - name: Remove any partition left behind
        if: always()
        run: |
          ip=$(cat /tmp/partitioned-ip 2>/dev/null || true)
          [ -n "$ip" ] || exit 0
          docker exec chaos-control-plane iptables -D FORWARD -s "$ip" -j DROP || true
          docker exec chaos-control-plane iptables -D FORWARD -d "$ip" -j DROP || true

      - name: Restart a provider during the cold-start election
        run: |
          set -euo pipefail
          # The election is ordinal-based precisely because a probe-based one
          # raced: a 3-node cold start once left node 1 on one entryUUID and
          # nodes 2 and 3 on another (see entrypoint.sh, D5a). Killing ordinal 0
          # while it is still bootstrapping is the case that would resurrect that
          # bug — the invariant is that the cluster ends up with exactly one base
          # DIT, not merely three that answer.
          helm uninstall directory --namespace directory
          kubectl -n directory delete pvc --all --wait=true
          helm install directory charts/ldapium \
            --namespace directory \
            --set replicaCount=3 \
            --set image.repository=ldapium \
            --set image.tag=chaos \
            --set image.pullPolicy=Never \
            --set-string 'ldap.adminDN=cn=admin\,dc=example\,dc=org' \
            --set auth.adminPassword='chaos-e2e-password' \
            --set ui.enabled=false \
            --timeout 10m &
          install_pid=$!
          # Running but not Ready is exactly the bootstrap window: the entrypoint
          # seeds through a temporary local slapd before the real one starts
          # answering probes.
          killed=0
          for _ in $(seq 1 180); do
            phase=$(kubectl -n directory get pod directory-ldapium-0 -o jsonpath='{.status.phase}' 2>/dev/null || true)
            ready=$(kubectl -n directory get pod directory-ldapium-0 -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || true)
            if [ "$phase" = "Running" ] && [ "$ready" != "true" ]; then
              kubectl -n directory delete pod directory-ldapium-0 --wait=false
              killed=1
              break
            fi
            sleep 1
          done
          wait "$install_pid"
          if [ "$killed" -ne 1 ]; then
            echo "::error::never caught ordinal 0 mid-bootstrap, so nothing was tested"
            exit 1
          fi
          kubectl -n directory rollout status statefulset/directory-ldapium --timeout=10m
          for ordinal in 0 1 2; do
            kubectl -n directory exec "directory-ldapium-${ordinal}" -c openldap -- sh -c \
              'ldapsearch -x -LLL -H ldap://localhost:389 -D "cn=admin,dc=example,dc=org" -w "chaos-e2e-password" -b "dc=example,dc=org" -s base entryUUID' \
              | grep '^entryUUID:' > "/tmp/base-uuid-${ordinal}.txt"
            cat "/tmp/base-uuid-${ordinal}.txt"
          done
          diff /tmp/base-uuid-0.txt /tmp/base-uuid-1.txt
          diff /tmp/base-uuid-0.txt /tmp/base-uuid-2.txt
          {
            echo "bootstrap-election restart: single base DIT confirmed"
            cat /tmp/base-uuid-0.txt
          } | tee -a /tmp/chaos-evidence.txt
          echo "PASS: one base DIT across all three providers after killing the creator mid-bootstrap"

      - name: Verify replication metadata
        run: |
          set -euo pipefail
          kubectl -n directory run ldap-client --rm -i --restart=Never --image=ldapium:chaos -- \
            sh -ec 'ldapsearch -x -H ldap://directory-ldapium:389 -D cn=admin,dc=example,dc=org -w chaos-e2e-password -b dc=example,dc=org -s base contextCSN | grep -q contextCSN'

      - name: Upload chaos evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replication-chaos-evidence
          path: /tmp/chaos-evidence.txt
          if-no-files-found: error

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n directory get pods -o wide || true
          kubectl -n directory describe pods || true
          kubectl -n directory logs statefulset/directory-ldapium --tail=300 || true
          # On a CrashLoopBackOff the current log only shows the restart, not the
          # first-boot failure that poisoned the volume — dump the previous one too.
          kubectl -n directory logs statefulset/directory-ldapium --previous --tail=300 || true
          kubectl -n directory get events --sort-by=.lastTimestamp | tail -100 || true

      - name: Uninstall
        if: always()
        run: helm uninstall directory --namespace directory || true
