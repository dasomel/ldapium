name: Build and publish images

# Publishes both images when main changes, rebuilds weekly, and supports manual
# runs for on-demand rebuilds. Shares the multi-arch build logic with
# build-multiarch.yml.
#
# The weekly run no longer picks up base-image security updates on its own:
# every FROM is pinned by digest, so a base update arrives as a Dependabot PR
# instead (see docs/dependency-policy.md). What the rebuild still does is
# rescan the published images against current vulnerability data — and because
# the inputs are fixed now, a new finding on an unchanged digest means the data
# moved rather than the image, which is the more useful signal.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC
  workflow_dispatch: {}

# Top level is read-only. Every job that needs to write declares it explicitly.
permissions:
  contents: read

jobs:
  build-server:
    name: Build server image
    uses: ./.github/workflows/build-multiarch.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image-name: ldapium
      context: image
      metadata-tags: |
        type=raw,value=main
        type=raw,value=nightly
        type=sha,prefix=nightly-

  build-ui:
    name: Build UI image
    uses: ./.github/workflows/build-multiarch.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image-name: ldapium-ui
      context: ui
      metadata-tags: |
        type=raw,value=main
        type=raw,value=nightly
        type=sha,prefix=nightly-
