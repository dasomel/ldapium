name: Build and publish images

# Publishes both images when main changes, rebuilds weekly, and supports manual
# runs for on-demand rebuilds. Shares the multi-arch build logic with
# build-multiarch.yml.
#
# What the weekly run picks up changed when every FROM was pinned by digest.
# The base *layer* is now fixed, so a new debian:trixie-slim arrives as a
# Dependabot PR rather than silently (see docs/dependency-policy.md). The
# packages installed on top of it are not fixed: `apt-get install` still
# resolves against Debian's current archive on every build, so a rebuild is
# still how a libssl or libsasl patch reaches the :main tag.
#
# This workflow only builds and publishes. Scanning the published images is
# security-scan.yml's `images` job on its own schedule.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC
  workflow_dispatch: {}

# Top level is read-only. Every job that needs to write declares it explicitly.
permissions:
  contents: read

jobs:
  build-server:
    name: Build server image
    uses: ./.github/workflows/build-multiarch.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image-name: ldapium
      context: image
      metadata-tags: |
        type=raw,value=main
        type=raw,value=nightly
        type=sha,prefix=nightly-

  build-ui:
    name: Build UI image
    uses: ./.github/workflows/build-multiarch.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image-name: ldapium-ui
      context: ui
      metadata-tags: |
        type=raw,value=main
        type=raw,value=nightly
        type=sha,prefix=nightly-
