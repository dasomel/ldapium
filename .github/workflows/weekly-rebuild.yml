name: Build and publish images

# Publishes both images when main changes, rebuilds weekly for base-image
# security updates, and supports manual runs for on-demand rebuilds.
# Shares the multi-arch build logic with build-multiarch.yml.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC
  workflow_dispatch: {}

# Top level is read-only. Every job that needs to write declares it explicitly.
permissions:
  contents: read

jobs:
  build-server:
    name: Build server image
    uses: ./.github/workflows/build-multiarch.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image-name: ldapium
      context: image
      metadata-tags: |
        type=raw,value=main
        type=raw,value=nightly
        type=sha,prefix=nightly-

  build-ui:
    name: Build UI image
    uses: ./.github/workflows/build-multiarch.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image-name: ldapium-ui
      context: ui
      metadata-tags: |
        type=raw,value=main
        type=raw,value=nightly
        type=sha,prefix=nightly-
