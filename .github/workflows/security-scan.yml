name: Security scan

# Two different questions, so two jobs:
#
#   dependencies — what this repo pulls in (go.sum, package-lock.json) and how
#                  its Kubernetes manifests are configured. Runs on every
#                  change, because that is when it is cheap to fix.
#   images       — what the published images actually contain, including the
#                  Debian base layer. Runs on a schedule, because that answer
#                  changes without anyone committing anything.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 4"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies and manifests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          # Reporting, not gating: findings land in the Security tab where
          # they can be triaged. The gate is the separate step below, which
          # fails only on a fixable critical — the kind that is a one-line
          # bump, not a months-old unfixed CVE in a transitive dependency.
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  govulncheck:
    name: Go vulnerabilities (reachable)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ui/backend/go.mod
          cache-dependency-path: ui/backend/go.sum

      # This blocks, unlike the Trivy job above, because it reports on symbols
      # this code actually reaches rather than on modules it merely requires.
      # Both directions were worth having: Trivy flagged golang.org/x/crypto
      # for an openpgp advisory nothing here calls, and missed six standard
      # library vulnerabilities that this code does call. A red build here
      # means a real, reachable vulnerability, and the fix is usually one line
      # — raising the go directive in ui/backend/go.mod to the patch release
      # that fixed it.
      - name: govulncheck
        working-directory: ui/backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  images:
    name: Published images
    # Only where a published image exists to scan: a pull request from a fork
    # has no access to the registry, and on a fresh repository the tags below
    # do not exist until the first build has run.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [ldapium, ldapium-ui]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :main is the weekly rebuild of the current source (see
      # weekly-rebuild.yml). Scanning it rather than :latest answers "does a
      # rebuild today still ship a known vulnerability", which is what the
      # weekly rebuild exists to prevent.
      - name: Scan ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:main
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:main
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.image }}
