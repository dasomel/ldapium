name: Security E2E

on:
  pull_request:
    paths:
      - "image/**"
      - "charts/**"
      - ".github/workflows/security-e2e.yml"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t ldapium:security image

      - name: Create cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: security

      - name: Load image
        run: kind load docker-image ldapium:security --name security

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install LDAPium
        run: |
          helm install directory charts/ldapium \
            --namespace directory --create-namespace \
            --set image.repository=ldapium \
            --set image.tag=security \
            --set image.pullPolicy=Never \
            --set-string 'ldap.adminDN=cn=admin\,dc=example\,dc=org' \
            --set auth.adminPassword='security-e2e-password' \
            --set ui.enabled=false \
            --set audit.enabled=true \
            --set audit.accessLog.enabled=true \
            --wait --timeout 5m

      - name: Seed test identities
        run: |
          kubectl -n directory run ldap-client --rm -i --restart=Never --image=ldapium:security -- \
            sh -ec '
              ldapadd -x -H ldap://directory-ldapium:389 -D cn=admin,dc=example,dc=org -w security-e2e-password <<EOF
          dn: ou=people,dc=example,dc=org
          objectClass: organizationalUnit
          ou: people

          dn: uid=alice,ou=people,dc=example,dc=org
          objectClass: inetOrgPerson
          uid: alice
          cn: Alice
          sn: Tester
          userPassword: AlicePassword1!

          dn: uid=bob,ou=people,dc=example,dc=org
          objectClass: inetOrgPerson
          uid: bob
          cn: Bob
          sn: Tester
          userPassword: BobPassword1!
          EOF
            '

      - name: Verify anonymous password redaction
        run: |
          set -euo pipefail
          kubectl -n directory run ldap-client --rm -i --restart=Never --image=ldapium:security -- \
            sh -ec '
              ! ldapsearch -x -H ldap://directory-ldapium:389 -b uid=alice,ou=people,dc=example,dc=org -s base "(objectClass=*)" userPassword 2>&1 | grep -q "AlicePassword1!"
            '

      - name: Verify anonymous attribute boundary
        run: |
          set -euo pipefail
          kubectl -n directory run ldap-client --rm -i --restart=Never --image=ldapium:security -- \
            sh -ec '
              out=$(ldapsearch -x -H ldap://directory-ldapium:389 -b uid=alice,ou=people,dc=example,dc=org -s base "(objectClass=*)" uid objectClass)
              echo "$out" | grep -q "uid: alice"
              ! echo "$out" | grep -q "userPassword:"
            '

      - name: Verify an authenticated user cannot write another user's entry
        run: |
          set -euo pipefail
          # The anonymous checks above say nothing about the case that actually
          # matters: a real, successfully bound directory user reaching for
          # someone else's entry. `by users read` is not `by users write`, and
          # this is what proves the difference is enforced rather than intended.
          kubectl -n directory run ldap-client --rm -i --restart=Never --image=ldapium:security -- \
            sh -ec '
              bob="uid=bob,ou=people,dc=example,dc=org"
              alice="uid=alice,ou=people,dc=example,dc=org"
              url="ldap://directory-ldapium:389"

              ldapwhoami -x -H "$url" -D "$bob" -w BobPassword1! | grep -q "dn:uid=bob"

              # Refused *by the ACL*, not merely refused. Without checking for
              # result 50 these would also pass on a typo in the DN, a wrong
              # password, or an unreachable server.
              echo "modify another user: must be refused"
              if ldapmodify -x -H "$url" -D "$bob" -w BobPassword1! >/tmp/modify.out 2>&1 <<EOF
          dn: $alice
          changetype: modify
          replace: sn
          sn: Rewritten
          EOF
              then
                echo "a bound user modified another user entry" >&2
                exit 1
              fi
              cat /tmp/modify.out
              grep -q "Insufficient access (50)" /tmp/modify.out

              echo "delete another user: must be refused"
              if ldapdelete -x -H "$url" -D "$bob" -w BobPassword1! "$alice" >/tmp/delete.out 2>&1; then
                echo "a bound user deleted another user entry" >&2
                exit 1
              fi
              cat /tmp/delete.out
              grep -q "Insufficient access (50)" /tmp/delete.out

              echo "read another user password: must be refused"
              out=$(ldapsearch -x -H "$url" -D "$bob" -w BobPassword1! -b "$alice" -s base userPassword)
              if echo "$out" | grep -q "AlicePassword1!"; then
                echo "a bound user read another user password" >&2
                exit 1
              fi

              echo "the entry itself is still readable, and still intact"
              ldapsearch -x -H "$url" -D "$bob" -w BobPassword1! -b "$alice" -s base sn | grep -q "sn: Tester"
            '

      - name: Verify a user can still write their own entry
        run: |
          set -euo pipefail
          # A deny-everything ACL would pass every check above. This is the one
          # that fails if the rules are too tight rather than too loose.
          kubectl -n directory run ldap-client --rm -i --restart=Never --image=ldapium:security -- \
            sh -ec '
              bob="uid=bob,ou=people,dc=example,dc=org"
              url="ldap://directory-ldapium:389"
              ldapmodify -x -H "$url" -D "$bob" -w BobPassword1! <<EOF
          dn: $bob
          changetype: modify
          replace: sn
          sn: SelfService
          EOF
              ldapsearch -x -H "$url" -D "$bob" -w BobPassword1! -b "$bob" -s base sn | grep -q "sn: SelfService"
            '

      - name: Verify cn=config is not exposed on LDAP service
        run: |
          set -euo pipefail
          kubectl -n directory run ldap-client --rm -i --restart=Never --image=ldapium:security -- \
            sh -ec '
              ! ldapsearch -x -H ldap://directory-ldapium:389 -b cn=config -s base "(objectClass=*)" dn 2>/dev/null | grep -q "dn: cn=config"
            '

      - name: Verify LDAP injection input is treated as data
        run: |
          set -euo pipefail
          kubectl -n directory run ldap-client --rm -i --restart=Never --image=ldapium:security -- \
            sh -ec '
              ! ldapsearch -x -H ldap://directory-ldapium:389 -b dc=example,dc=org "(|(uid=*)(uid=*)" >/dev/null 2>&1
            '

      - name: Verify privileged changes are audited
        run: |
          set -euo pipefail
          # The audit record has to name who did it, not merely that something
          # happened — an audit log that cannot attribute a change is a change
          # log. The overlay writes to /dev/stdout, so the record lands in the
          # container log with whatever already collects those.
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'ldapmodify -x -H "ldap://localhost:389" -D "cn=admin,dc=example,dc=org" -w "security-e2e-password" <<EOF
          dn: uid=alice,ou=people,dc=example,dc=org
          changetype: modify
          replace: sn
          sn: Audited
          EOF'
          for _ in $(seq 1 15); do
            kubectl -n directory logs directory-ldapium-0 -c openldap --tail=400 > /tmp/audit.log
            grep -q '^# modify ' /tmp/audit.log && break
            sleep 2
          done
          echo "::group::audit record"
          grep -A6 '^# modify ' /tmp/audit.log | tail -20
          echo "::endgroup::"
          grep -q '^# modify .* cn=admin,dc=example,dc=org ' /tmp/audit.log
          grep -q '^changetype: modify$' /tmp/audit.log
          grep -q '^sn: Audited$' /tmp/audit.log
          echo "PASS: the change is attributed to the identity that made it"

      - name: Show what a password change leaves in the audit log
        run: |
          set -euo pipefail
          # The overlay writes the whole modification as LDIF and has no notion
          # of a sensitive attribute, so a password change puts the stored
          # userPassword value into the log. That is a real exposure and it is
          # documented as one; this step exists so the documentation is checked
          # against the server rather than against an assumption about it.
          #
          # The value printed below is a hash of a throwaway password in a kind
          # cluster that is deleted with the job.
          kubectl -n directory exec directory-ldapium-0 -c openldap -- \
            ldappasswd -x -H "ldap://localhost:389" \
              -D "cn=admin,dc=example,dc=org" -w "security-e2e-password" \
              -s "RotatedPassword1!" "uid=alice,ou=people,dc=example,dc=org"
          for _ in $(seq 1 15); do
            kubectl -n directory logs directory-ldapium-0 -c openldap --tail=400 > /tmp/audit-pw.log
            grep -q '^userPassword' /tmp/audit-pw.log && break
            sleep 2
          done
          echo "::group::audit record for the password change"
          grep -B4 -A2 '^userPassword' /tmp/audit-pw.log | tail -20
          echo "::endgroup::"
          # Either encoding is possible depending on the hash bytes; both are
          # the secret. Asserting on presence keeps the doc honest without
          # pinning the test to one of them.
          grep -qE '^userPassword::? ' /tmp/audit-pw.log
          echo "PASS: the audit record carries the stored password value, as documented"

      - name: Verify reads are audited (accesslog) and stay off writes
        run: |
          set -euo pipefail
          kubectl -n directory exec directory-ldapium-0 -c openldap -- \
            ldapsearch -x -H "ldap://localhost:389" \
              -D "cn=admin,dc=example,dc=org" -w "security-e2e-password" \
              -b "dc=example,dc=org" "(uid=alice)" >/dev/null
          for _ in $(seq 1 15); do
            kubectl -n directory exec directory-ldapium-0 -c openldap -- \
              ldapsearch -x -H "ldap://localhost:389" -o ldif-wrap=no \
                -D "cn=admin,cn=accesslog" -w "security-e2e-password" \
                -b cn=accesslog -LLL "(objectClass=auditSearch)" \
                reqStart reqAuthzID reqDN reqFilter > /tmp/accesslog.ldif 2>/dev/null
            grep -q '^reqFilter: (uid=alice)$' /tmp/accesslog.ldif && break
            sleep 2
          done
          echo "::group::accesslog record for the search"
          grep -B4 '^reqFilter: (uid=alice)$' /tmp/accesslog.ldif
          echo "::endgroup::"
          # Attribution is the whole point here too — same standard as auditlog.
          grep -q '^reqAuthzID: cn=admin,dc=example,dc=org$' /tmp/accesslog.ldif
          echo "PASS: the read is attributed to the identity that made it"

          # olcAccessLogOps: reads means writes must NOT show up a second time
          # in cn=accesslog — auditlog already covers them, and a duplicate
          # would be a second, unaudited copy of userPassword sitting in a
          # database this step just proved is externally readable.
          kubectl -n directory exec directory-ldapium-0 -c openldap -- \
            ldapsearch -x -H "ldap://localhost:389" \
              -D "cn=admin,cn=accesslog" -w "security-e2e-password" \
              -b cn=accesslog "(objectClass=auditModify)" > /tmp/accesslog-writes.ldif
          grep -q '^# numEntries: 0$' /tmp/accesslog-writes.ldif
          echo "PASS: accesslog does not duplicate auditlog's write records"

      - name: Verify the audit export script
        run: |
          set -euo pipefail
          out=$(./scripts/export-audit-log.sh -n directory -r directory-ldapium)
          echo "::group::export-audit-log.sh output"
          echo "$out"
          echo "::endgroup::"
          echo "$out" | grep -q '"source":"auditlog"'
          echo "$out" | grep -q '"source":"accesslog"'
          # Every line has to be valid JSON, not just look like it.
          echo "$out" | while IFS= read -r line; do
            python3 -c "import json,sys; json.loads(sys.argv[1])" "$line"
          done
          echo "PASS: export-audit-log.sh produced valid NDJSON with both sources"

      - name: Verify chart security context
        run: |
          helm template directory charts/ldapium \
            --set-string 'ldap.adminDN=cn=admin\,dc=example\,dc=org' \
            --set auth.adminPassword='security-e2e-password' > /tmp/security.yaml
          grep -q 'runAsNonRoot: true' /tmp/security.yaml
          grep -q 'runAsUser: 999' /tmp/security.yaml
          grep -q 'readOnlyRootFilesystem: true' /tmp/security.yaml
          grep -q 'capabilities:' /tmp/security.yaml

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n directory get pods -o wide || true
          kubectl -n directory describe pods || true
          kubectl -n directory logs statefulset/directory-ldapium --tail=300 || true
          # On a CrashLoopBackOff the current log only shows the restart, not the
          # first-boot failure that poisoned the volume — dump the previous one too.
          kubectl -n directory logs statefulset/directory-ldapium --previous --tail=300 || true

      - name: Uninstall
        if: always()
        run: helm uninstall directory --namespace directory || true
