name: OpenSSF Scorecard

# Scores this repository's supply-chain practices (pinned actions, branch
# protection, signed releases, and so on) and publishes the result so the
# badge in README.md reflects reality rather than intent.
#
# publish_results requires a public repository; on a private one the analysis
# still runs and uploads to code scanning, but the badge stays unpopulated.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 3"
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # PRs still cancel superseded runs of themselves, but a push to main
  # never does: a late-starting run for an older commit sharing this
  # group previously cancelled HEAD's in-progress E2E run (observed
  # 2026-09-24, four PRs merged back-to-back).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      # Needed to publish the result to the OpenSSF API for the badge.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: results.sarif
