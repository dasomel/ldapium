name: OpenSSF Scorecard

# Scores this repository's supply-chain practices (pinned actions, branch
# protection, signed releases, and so on) and publishes the result so the
# badge in README.md reflects reality rather than intent.
#
# publish_results requires a public repository; on a private one the analysis
# still runs and uploads to code scanning, but the badge stays unpopulated.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 3"
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # This workflow has no pull_request trigger to cancel; every trigger
  # here (push/schedule/branch_protection_rule/dispatch) is grouped per
  # commit SHA and none cancel each other. Grouping main pushes by ref
  # once let an older commit's late run cancel or displace HEAD's run
  # (observed 2026-09-24).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      # Needed to publish the result to the OpenSSF API for the badge.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
