name: Supply-chain evidence

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to inspect, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  evidence:
    name: Verify release supply chain
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Determine release identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            sha="$(git rev-list -n1 "$tag")"
          else
            sha="$WORKFLOW_SHA"
            tag="$(git tag --points-at "$sha" 'v*' | head -n1 || true)"
            if [ -z "$tag" ]; then
              echo "No release tag points at $sha; skipping evidence generation for non-tag Release runs."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          version="${tag#v}"
          printf 'skip=false\n' >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        if: steps.identity.outputs.skip != 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to GHCR
        if: steps.identity.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Verify image manifests and digests
        if: steps.identity.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/evidence
          for image in ldapium ldapium-ui; do
            ref="ghcr.io/${{ github.repository_owner }}/${image}:${VERSION}"
            docker buildx imagetools inspect "$ref" | tee "/tmp/evidence/${image}-manifest.txt"
            grep -q 'linux/amd64' "/tmp/evidence/${image}-manifest.txt"
            grep -q 'linux/arm64' "/tmp/evidence/${image}-manifest.txt"
            # The tag above is what the release asked for; the digest is what a
            # consumer can actually pin to. Recorded independently of whatever
            # build-multiarch.yml believed it pushed, by asking the registry.
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            echo "$digest" > "/tmp/evidence/${image}.digest"
          done

      - name: Verify Helm OCI chart
        if: steps.identity.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          helm show chart "oci://ghcr.io/${{ github.repository_owner }}/charts/ldapium" --version "$VERSION" \
            > /tmp/evidence/chart.yaml
          grep -q "^version: $VERSION$" /tmp/evidence/chart.yaml
          # A pushed OCI chart is a manifest like any other image; the same
          # tool resolves its digest.
          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository_owner }}/charts/ldapium:${VERSION}" \
            --format '{{.Manifest.Digest}}' > /tmp/evidence/chart.digest

      - name: Verify dependency/license gate
        if: steps.identity.outputs.skip != 'true'
        run: ./scripts/licenses.sh --check

      - name: Verify chart rendering and version contract
        if: steps.identity.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ./scripts/check-versions.sh
          helm lint charts/ldapium
          helm template evidence charts/ldapium --set auth.adminPassword=ci-render-only-not-a-secret > /tmp/evidence/chart-render.yaml

      - name: Generate evidence manifest
        if: steps.identity.outputs.skip != 'true'
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
          SHA: ${{ steps.identity.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib

          root = pathlib.Path('/tmp/evidence')

          # Independently re-resolved by this job against the registry, not
          # copied from what build-multiarch.yml believed it pushed. A digest
          # file that fails to read is a hard failure below rather than a
          # blank field: a manifest with a missing artifact identity is worse
          # than no manifest.
          def digest(name):
              return (root / name).read_text(encoding='utf-8').strip()

          owner = os.environ['GITHUB_REPOSITORY_OWNER']
          version = os.environ['VERSION']

          files = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.suffix != '.digest':
                  files[str(path.relative_to(root))] = hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = {
              'schemaVersion': 'ldapium.supply-chain/v1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'releaseTag': os.environ['TAG'],
              'version': version,
              'sourceCommit': os.environ['SHA'],
              'verificationWorkflowRun': os.environ['RUN_ID'],
              'artifacts': {
                  'serverImage': f"ghcr.io/{owner}/ldapium:{version}@{digest('ldapium.digest')}",
                  'uiImage': f"ghcr.io/{owner}/ldapium-ui:{version}@{digest('ldapium-ui.digest')}",
                  'helmChart': f"oci://ghcr.io/{owner}/charts/ldapium:{version}@{digest('chart.digest')}",
              },
              'evidenceFilesSha256': files,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          (root / 'SHA256SUMS').write_text(
              ''.join(f"{checksum}  {name}\n" for name, checksum in sorted(files.items())),
              encoding='utf-8',
          )
          PY

      - name: Upload evidence bundle
        if: steps.identity.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence-${{ steps.identity.outputs.tag }}
          path: /tmp/evidence/
          if-no-files-found: error

      # Everything above is also a workflow-run artifact, which expires and is
      # only reachable by someone with Actions access to this repo. The two
      # files a consumer actually needs to pin or verify a release belong on
      # the release itself. workflow_dispatch runs (release_tag pointing at a
      # tag with no corresponding Release object, e.g. a re-run for
      # inspection only) skip this and leave the CI artifact as the record.
      - name: Attach digests and checksums to the GitHub release
        if: steps.identity.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/evidence/manifest.json /tmp/evidence/SHA256SUMS --clobber
          else
            echo "no GitHub release named $TAG (this run was likely a manual inspection); nothing to attach to"
          fi
