name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: UI backend (go)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui/backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ui/backend/go.mod
          cache-dependency-path: ui/backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json

      # internal/web embeds the built SPA (`//go:embed all:dist`), and the
      # build output is not committed, so nothing in this module compiles
      # until the frontend has been built. Same ordering as ui/Dockerfile.
      - name: Build frontend for embedding
        working-directory: ui/frontend
        run: npm ci && npm run build

      # gofmt has no exit code of its own — it prints offending files and
      # succeeds — so the file list is what has to be turned into a failure.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat:"
            echo "$unformatted"
            exit 1
          fi

      # go.sum is the dependency graph's integrity statement, so it has to be
      # checked rather than trusted, and the build must not be allowed to
      # rewrite it on the way past. -mod=readonly makes a missing or changed
      # requirement a failure instead of a silent edit; `go mod verify` then
      # re-hashes everything in the module cache against go.sum.
      - name: Verify module integrity
        env:
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          # Download first. `go mod verify` re-hashes what is *in the module
          # cache*, so running it against a cold cache verifies nothing at all
          # and passes — setup-go usually restores one, but a cache miss must
          # not turn this step into a no-op.
          go mod download
          go mod verify
          # A build that needed to touch either file did so because something
          # in the graph was not what go.sum said it was.
          git diff --exit-code go.mod go.sum

      - run: go vet ./...
        env:
          GOFLAGS: -mod=readonly
      - run: go test ./...
        env:
          GOFLAGS: -mod=readonly
      - run: go build ./...
        env:
          GOFLAGS: -mod=readonly

      # A dependency substituted for something else has to fail the build, not
      # produce a warning nobody reads. Tampering with one recorded hash is the
      # cheapest faithful stand-in for that, and it runs on a copy so the real
      # go.sum is never touched.
      - name: Prove a substituted dependency fails the build
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cp go.mod go.sum "$work/"
          trap 'cp "$work/go.mod" "$work/go.sum" . ; rm -rf "$work"' EXIT
          victim=$(awk '$1 != "" && $2 ~ /^v/ { print $1; exit }' go.sum)
          if [ -z "$victim" ]; then
            echo "::error::found no module to substitute; the go.sum parsing is wrong"
            exit 1
          fi
          echo "substituting the recorded hash for $victim"
          awk -v m="$victim" '$1 == m { $3 = "h1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" } { print }' go.sum > go.sum.tampered
          mv go.sum.tampered go.sum
          # `go mod download` rather than `go build`: it fails on the checksum
          # before anything is compiled, so the failure cannot be confused with
          # a compile error, and GOPROXY=off keeps it comparing the tampered
          # go.sum against the module cache rather than re-fetching.
          if GOFLAGS=-mod=readonly GOPROXY=off go mod download 2>/tmp/substitution.log; then
            echo "::error::a download succeeded against a go.sum that no longer matches the module"
            exit 1
          fi
          tail -8 /tmp/substitution.log
          # Fail for the right reason: any command can exit non-zero.
          grep -qE 'checksum mismatch|SECURITY ERROR' /tmp/substitution.log
          echo "PASS: substituted dependency rejected"

  frontend:
    name: UI frontend (npm)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # `build` is `tsc -b && vite build`, so this is the type check too.
      - run: npm run build

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - run: helm lint charts/ldapium

      # The chart deliberately refuses to render without an admin password
      # (the image refuses to start without one), so every template call must
      # supply a throwaway value. This is a CI fixture, not a credential.
      # Both the single-node and the replicated path are rendered: the
      # replicaCount>1 path is the only one that emits LDAP_REPLICATION_PEERS,
      # whose ordinal ordering is a contract with image/entrypoint.sh.
      - name: Render default (single node)
        run: helm template t charts/ldapium --set auth.adminPassword=ci-render-only-not-a-secret

      - name: Render replicated + UI
        run: |
          helm template t charts/ldapium \
            --set auth.adminPassword=ci-render-only-not-a-secret \
            --set replicaCount=3 \
            --set ui.enabled=true

      # TLS is off by default and unverified at runtime (see values.yaml), so
      # nothing else here would notice it stopped rendering. Rendering is not
      # working, but a template that does not even produce manifests cannot
      # be debugged by whoever first tries to turn it on.
      - name: Render with TLS enabled
        run: |
          rendered=$(helm template t charts/ldapium \
            --set auth.adminPassword=ci-render-only-not-a-secret \
            --set tls.enabled=true \
            --set tls.existingSecret=ci-tls \
            --set replicaCount=3)
          # Asserted on what the chart actually emits. It never writes an
          # "ldaps://" URL: the entrypoint appends that listener itself when
          # LDAP_TLS_ENABLED is set (image/entrypoint.sh, LISTEN_URLS), and
          # plain ldap:// stays alongside it — which is why the backup CronJob
          # and the helm test can keep using ldap:// with TLS on.
          for expected in \
            "name: LDAP_TLS_ENABLED" \
            "containerPort: 636" \
            "/etc/openldap/tls"; do
            if ! printf '%s' "$rendered" | grep -q "$expected"; then
              echo "::error::tls.enabled=true rendered nothing matching '$expected'"
              exit 1
            fi
          done
          echo "TLS path renders: env, ldaps port and certificate mount all present"

      # The chart, both images and docker-compose.yml are all cut from one
      # git tag and each carries its own copy of the version.
      - name: Check version consistency
        run: ./scripts/check-versions.sh

      # The UI reports which modules the server has by reading an env var the
      # chart hardcodes. Nothing derived it from the server, so it stays true
      # only for as long as three files keep agreeing.
      - name: Check module inventory consistency
        run: ./scripts/check-modules.sh

      - name: Reject rendering with no admin password
        run: |
          if helm template t charts/ldapium >/dev/null 2>&1; then
            echo "::error::chart rendered without an admin password; the fail() guard regressed"
            exit 1
          fi
          echo "chart correctly refused to render without an admin password"

  licenses:
    name: Third-party licenses
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ui/backend/go.mod
          cache-dependency-path: ui/backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui/frontend
        run: npm ci

      # Fails on a dependency whose licence is not on the permissive
      # allow-list, and on a THIRD-PARTY-LICENSES.md that no longer matches
      # the dependency tree.
      - run: ./scripts/licenses.sh --check

  shellcheck:
    name: shellcheck (shell scripts)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # shellcheck ships preinstalled on GitHub-hosted ubuntu runners.
      # entrypoint.sh runs under the image's /bin/sh (dash), so it is checked
      # as POSIX sh; the scripts/ helpers declare their own shebangs and are
      # checked against whatever each one asks for.
      - run: shellcheck -s sh image/entrypoint.sh
      - run: shellcheck scripts/*.sh
      # The `helm test` script is a chart file, not an inline blob in a
      # template, precisely so it can be linted here and run by hand.
      - run: shellcheck charts/ldapium/files/tests/*.sh

  hadolint:
    name: hadolint (Dockerfiles, informational)
    runs-on: ubuntu-24.04
    # Advisory by project convention: findings are printed in the log but never
    # block CI. That needs BOTH settings — continue-on-error keeps the run
    # green, while no-fail keeps the job itself from reporting a red check for
    # something nobody is expected to act on immediately.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint server Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: image/Dockerfile
          no-fail: true
          # DL3008: apt-get install without pinned package versions. Intentional
          # here — the OpenLDAP source tarball is pinned by sha256 in the
          # Dockerfile itself, but base-OS packages deliberately float with
          # debian:trixie-slim so weekly-rebuild.yml picks up security patches.
          ignore: DL3008

      - name: Lint UI Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: ui/Dockerfile
          no-fail: true
          ignore: DL3008

  base-images:
    name: Base image pins cover every published arch
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The multi-arch build only runs on push and release, so an arm64-broken
      # pin would otherwise sail through the PR that introduced it and fail
      # after merge. This asks the registry the same question here.
      - run: ./scripts/check-base-images.sh
