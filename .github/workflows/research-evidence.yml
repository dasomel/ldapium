name: Research evidence

# D4: Path filtering avoids slowing unrelated PRs. Other changes do not run
# this gate automatically; run make research-check manually when needed.
# D5: Branch pushes only. Without `branches`, a tag push also matched (a new ref has no
#     diff to path-filter), so every release tag started this job and Release's preflight
#     failed on "pending research-check" until rerun (v0.2.0 through v0.3.2). The tagged
#     commit was already checked on its branch. Cost: nothing runs on tags.
on:
  push:
    branches: ['**']
    paths:
      - 'research/**'
      - 'scripts/research/**'
  pull_request:
    paths:
      - 'research/**'
      - 'scripts/research/**'

permissions:
  contents: read

jobs:
  research-check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python3 -m pip install --require-hashes -r scripts/research/requirements.txt
      - name: Validate research evidence
        run: make research-check
