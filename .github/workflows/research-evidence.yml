name: Research evidence

# D4: Path filtering avoids slowing unrelated PRs. Other changes do not run
# this gate automatically; run make research-check manually when needed.
on:
  push:
    paths:
      - 'research/**'
      - 'scripts/research/**'
  pull_request:
    paths:
      - 'research/**'
      - 'scripts/research/**'

permissions:
  contents: read

jobs:
  research-check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python3 -m pip install --require-hashes -r scripts/research/requirements.txt
      - name: Validate research evidence
        run: make research-check
