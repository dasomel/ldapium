name: Build multi-arch image (reusable)

# Shared image publisher used by main builds and releases.
# Follow the proven OSS pattern: one Buildx job publishes the complete
# multi-architecture image directly. Do not create per-architecture digest
# marker artifacts and merge them later.

on:
  workflow_call:
    inputs:
      image-name:
        description: "GHCR image name, e.g. ldapium or ldapium-ui"
        required: true
        type: string
      context:
        description: "Docker build context directory, e.g. image or ui"
        required: true
        type: string
      metadata-tags:
        description: "Newline-separated docker/metadata-action tag patterns"
        required: true
        type: string

# Restrictive by default (OpenSSF Scorecard's TokenPermissions check), not
# because anything reads it today: the sole job below declares its own full
# permissions: block, which replaces this rather than adding to it. This
# stays as the floor a job added later without its own block would get,
# rather than the full default GITHUB_TOKEN grant.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}

jobs:
  build-and-push:
    name: Build and push multi-arch image
    runs-on: ubuntu-24.04
    # id-token + attestations: a called reusable workflow's effective
    # permissions are the intersection of what the caller grants the job
    # AND what this job's own block requests — either one omitting them
    # caps it at none. release.yml and weekly-rebuild.yml both already
    # grant these to their calls into this workflow, so this job's own
    # block was the missing half: without it, the attest steps below fail
    # with 403 at release time, and `gh attestation verify` (documented in
    # docs/legal.md and the Makefile) has nothing to find for any image
    # this workflow ever published.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ inputs.metadata-tags }}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}
          sbom: true
          provenance: mode=max

      - name: Prepare SBOM directory
        run: mkdir -p /tmp/sbom

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: spdx-json
          artifact-name: ${{ inputs.image-name }}.spdx.json
          output-file: /tmp/sbom/${{ inputs.image-name }}.spdx.json

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: cyclonedx-json
          artifact-name: ${{ inputs.image-name }}.cdx.json
          output-file: /tmp/sbom/${{ inputs.image-name }}.cdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ inputs.image-name }}
          path: /tmp/sbom/*
          if-no-files-found: error

      # `provenance: mode=max`/`sbom: true` above embed a BuildKit-native
      # in-toto attestation in the image manifest itself — real, but a
      # different mechanism from GitHub's Artifact Attestations API, which
      # is what `gh attestation verify` (docs/legal.md, Makefile) actually
      # checks: a Sigstore-signed statement recorded in the public Rekor
      # transparency log, tied to this workflow run's OIDC identity. One
      # does not substitute for the other — without these two steps, `gh
      # attestation verify` has nothing to find for any image this workflow
      # publishes, no matter what docker/build-push-action embedded.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: /tmp/sbom/${{ inputs.image-name }}.spdx.json
          push-to-registry: true
