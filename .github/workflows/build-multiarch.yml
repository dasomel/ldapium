name: Build multi-arch image (reusable)

# Shared image publisher used by main builds and releases.
# Follow the proven OSS pattern: one Buildx job publishes the complete
# multi-architecture image directly. Do not create per-architecture digest
# marker artifacts and merge them later.

on:
  workflow_call:
    inputs:
      image-name:
        description: "GHCR image name, e.g. ldapium or ldapium-ui"
        required: true
        type: string
      context:
        description: "Docker build context directory, e.g. image or ui"
        required: true
        type: string
      metadata-tags:
        description: "Newline-separated docker/metadata-action tag patterns"
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}

jobs:
  build-and-push:
    name: Build and push multi-arch image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@e3b0f6f8c9c0a8c1d1d8f5a6f6c1c1f5c6a7b8c9 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ inputs.metadata-tags }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}
          sbom: true
          provenance: mode=max

      - name: Prepare SBOM directory
        run: mkdir -p /tmp/sbom

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}:${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: spdx-json
          artifact-name: ${{ inputs.image-name }}.spdx.json
          output-file: /tmp/sbom/${{ inputs.image-name }}.spdx.json

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}:${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: cyclonedx-json
          artifact-name: ${{ inputs.image-name }}.cdx.json
          output-file: /tmp/sbom/${{ inputs.image-name }}.cdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ inputs.image-name }}
          path: /tmp/sbom/*
          if-no-files-found: error
