name: Build multi-arch image (reusable)

# Builds and pushes a single image to GHCR for linux/amd64 and linux/arm64
# using GitHub's native arm64 hosted runners (GA 2025-08-07) instead of QEMU.
# OpenLDAP's `configure` relies on AC_TRY_RUN runtime probes, which are
# unreliable under emulation, so each architecture is built natively on its
# own runner and the resulting images are combined into one manifest list
# with `docker buildx imagetools create` — no cross-arch emulation involved.
#
# Called by release.yml (semver tags) and weekly-rebuild.yml (:main/:nightly)
# so the two callers only differ in which tags docker/metadata-action emits.

on:
  workflow_call:
    inputs:
      image-name:
        description: "GHCR image name, e.g. ldapium or ldapium-ui"
        required: true
        type: string
      context:
        description: "Docker build context directory, e.g. image or ui"
        required: true
        type: string
      metadata-tags:
        description: "Newline-separated docker/metadata-action tag patterns"
        required: true
        type: string

# Top level is read-only. Every job that needs to write — pushing images or
# a chart to GHCR, minting an attestation, creating a release — declares that
# itself, so a job added later starts with no write access rather than
# inheriting it silently. OpenSSF Scorecard flags the inherited form
# (TokenPermissions), and it is right: a workflow-wide `packages: write` is
# granted to steps that never publish anything, including third-party actions.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          platforms: linux/${{ matrix.arch }}
          # Attestations are deliberately OFF for the per-arch digest push and
          # are attached to the merged manifest instead (see the merge job).
          #
          # With provenance/sbom enabled, a single-platform build no longer
          # pushes a plain image manifest — it pushes an index wrapping the
          # image plus its attestation manifests. push-by-digest then yields
          # the digest of that index, and the merge step would be combining
          # indexes of indexes. That path is reported to produce bogus
          # `unknown/unknown` platform entries in GHCR's package UI and has a
          # history of manifest errors, and we cannot exercise a real GHA run
          # from here to prove otherwise. Signing the final manifest with
          # GitHub's OIDC-backed attestation instead is unambiguous, verifiable
          # with `gh attestation verify`, and does not touch the merge path.
          # Refs: docker/build-push-action#755, community discussion #45969.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ inputs.image-name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ inputs.image-name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest list
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # id-token/attestations are what actions/attest-build-provenance needs to
      # mint a Sigstore certificate bound to this repository's OIDC identity.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ inputs.image-name }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ inputs.metadata-tags }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect pushed manifest list
        id: manifest
        run: |
          primary="${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          docker buildx imagetools inspect "$primary"
          digest=$(docker buildx imagetools inspect "$primary" --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [ -z "$digest" ]; then
            echo "::error::could not read the merged manifest digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Signs the merged manifest list itself, so the attestation covers what
      # users actually pull (the multi-arch tag), not one architecture's layer.
      # Verify with:
      #   gh attestation verify oci://ghcr.io/<owner>/<image>:<tag> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      # SBOM is generated from the pushed image rather than during the build:
      # buildx's own sbom/provenance are disabled above because they break the
      # push-by-digest merge path, and scanning the finished artifact is in any
      # case the thing users can reproduce — `syft ghcr.io/<owner>/<image>:<tag>`
      # against the published tag should agree with what ships here.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          artifact-name: ${{ inputs.image-name }}.spdx.json
          output-file: /tmp/sbom/${{ inputs.image-name }}.spdx.json

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: cyclonedx-json
          artifact-name: ${{ inputs.image-name }}.cdx.json
          output-file: /tmp/sbom/${{ inputs.image-name }}.cdx.json

      # Attaches the SBOM to the image in the registry the same way provenance
      # is attached, so it travels with the image instead of only living on a
      # release page. Verify with:
      #   gh attestation verify oci://ghcr.io/<owner>/<image>:<tag> \
      #     --repo <owner>/<repo> --predicate-type https://spdx.dev/Document
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: /tmp/sbom/${{ inputs.image-name }}.spdx.json
          push-to-registry: true

      # Collected by the caller (release.yml) and attached to the GitHub
      # Release, so an SBOM is available without a registry client.
      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ inputs.image-name }}
          path: /tmp/sbom/*
          if-no-files-found: error
