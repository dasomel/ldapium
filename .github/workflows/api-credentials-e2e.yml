name: API + credentials E2E (docker)

# Wires live checks that used to exist only on a developer machine (#223, #251):
#   - scripts/test/test-generated-credentials-local.py: generated LDAP admin
#     password (bind, 0600, no log leaks, reuse across LDAP/UI recreation,
#     safe session-secret metadata, missing original credential fails closed)
#   - scripts/test/test-api-edge-codes-local.py: unlock idempotency, lock ->
#     bind fails -> unlock, group member 409/404, router JSON 404/405, the
#     /api/v1/meta allowlist and userPassword redaction.
#   - scripts/test/test-api-conditional-writes-local.py: mid-write socket drop
#     replay, wire assertion 122 mapping, refused compensation 500 partial_failure,
#     and ppolicy lastbind with If-Match in SSO mode.
#   - scripts/test/test-machine-execution-live.py: the machine bearer execution
#     identity (#214 unit 2): per-request least-privilege bind from the package's
#     ACL LDIF, deadline/outage/abort release, BASE_DN and accesslog boundary,
#     no secret values with an over-privileged bind, cursor isolation, one audit
#     line per request. A local mock OIDC issuer signs the tokens.
#   - scripts/test/test-machine-acl-readonly-live.py: the machine LDAP account's
#     read-only ACL (#214 unit 3, T-026/AC-018): four freshly initialised
#     containers (anonymous read base unset / set / operator leading allow / replication rule at {0}), the
#     documented apply and rollback commands, olcAccess order read back, reads,
#     denied secrets and writes, unchanged behaviour for other identities; then
#     eleven deliberately broken ACL variants (including each secret attribute
#     dropped from the deny on its own) that must fail their expected checks.
#   - scripts/test/test-machine-acl-with-identity.sh: the machine ACL and the
#     LDAP_REPLICATION_IDENTITY=prepare rule on one slapd (#277): defined order
#     (identity {0}, machine {1}-{3}), both install orders, restarts, rollbacks.
#   - scripts/test/test-password-change-throttle-live.py: POST /api/users/password
#     failure throttle (#266): 429 + Retry-After after N wrong current passwords,
#     correct password 429 while blocked, other session/DN unaffected, ppolicy
#     lockout untouched, success after the window resets the budget.
# They drive disposable containers on a private docker network through the
# real UI backend; no kind cluster is needed.

on:
  # No paths filter, deliberately: release-critical checks must always report
  # (see e2e.yml for why a path-filtered check can block merging).
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: api-credentials-e2e-${{ github.event.pull_request.number || github.sha }}
  # PR runs cancel superseded runs of themselves; push/schedule/dispatch
  # runs are grouped per commit SHA and never cancel each other. Grouping
  # main pushes by ref once let an older commit's late run cancel or
  # displace HEAD's run, losing checks release.yml requires (2026-09-24).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  live:
    name: generated credentials + API edge codes (live)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Shares one of three heavy-E2E lanes per PR/commit; see e2e.yml's
    # migration-dryrun job for the full rationale (why throttle, why
    # queue: max instead of the default queue: single). Lane c: it builds
    # both images but needs no kind cluster, so it is among the lighter jobs.
    concurrency:
      group: heavy-e2e-lane-c-${{ github.event.pull_request.number || github.sha }}
      queue: max
      cancel-in-progress: false
    env:
      LDAPIUM_IMAGE: ldapium:api-e2e
      LDAPIUM_UI_IMAGE: ldapium-ui:api-e2e
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ui/backend/go.mod
          cache-dependency-path: ui/backend/go.sum

      - name: Build server image
        run: docker build -t "$LDAPIUM_IMAGE" image
      - name: Build UI image
        run: docker build -t "$LDAPIUM_UI_IMAGE" ui

      - name: Generated credentials (bind, private mode, no leaks, reuse, fail closed)
        run: python3 scripts/test/test-generated-credentials-local.py

      - name: API edge codes (unlock, lock, group members, router errors, redaction)
        run: python3 scripts/test/test-api-edge-codes-local.py

      - name: Conditional writes and idempotency (mid-write drop, assertion 122, compensation refused, ppolicy SSO)
        run: python3 scripts/test/test-api-conditional-writes-local.py

      - name: Machine execution identity (bind, deadline, boundary, cursors, audit; mock OIDC issuer)
        run: python3 scripts/test/test-machine-execution-live.py

      - name: Machine ACL read-only proof (three configurations, apply, readback, rollback)
        run: python3 scripts/test/test-machine-acl-readonly-live.py

      - name: Machine ACL + replication identity rule on one slapd (both install orders, restarts, rollbacks)
        run: bash scripts/test/test-machine-acl-with-identity.sh "$LDAPIUM_IMAGE"

      - name: Password-change failure throttle (429, Retry-After, ppolicy untouched, reset after window)
        run: python3 scripts/test/test-password-change-throttle-live.py

      # The proof must fail when the ACL is broken: rules after `by self write`, a
      # widened subtree, the secret deny dropped, and each of the eight secret
      # attributes removed from the deny on its own. The driver counts a mutation as
      # detected only on failed checks that include the expected named ones; an
      # error or a 0-failure result fails the step.
      - name: Machine ACL mutation self-test (each broken variant must fail its expected checks)
        run: scripts/test/test-machine-acl-mutations.sh

      # The scripts remove their own containers even on failure (the edge-code
      # script prints scrubbed container logs first), so this only reports leaks.
      - name: Report leftover docker objects
        if: always()
        run: |
          docker ps -a --filter name=ldapium-secrets- --filter name=ldapium-edge- --filter name=ldapium-cw- --filter name=ldapium-mx- --filter name=ldapium-macl- --filter name=ldapium-pwt- --format '{{.Names}} {{.Status}}'
          docker volume ls --filter name=ldapium-secrets- --filter name=ldapium-edge- --filter name=ldapium-cw- --filter name=ldapium-mx- --filter name=ldapium-macl- --filter name=ldapium-pwt- --format '{{.Name}}'
