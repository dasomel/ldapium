name: API + credentials E2E (docker)

# Wires two live checks that used to exist only on a developer machine (#223):
#   - scripts/test/test-generated-credentials-local.py: generated LDAP admin
#     password (bind, 0600, no log leaks, reuse across LDAP/UI recreation,
#     safe session-secret metadata, missing original credential fails closed)
#   - scripts/test/test-api-edge-codes-local.py: unlock idempotency, lock ->
#     bind fails -> unlock, group member 409/404, router JSON 404/405, the
#     /api/v1/meta allowlist and userPassword redaction.
# Both drive disposable containers on a private docker network through the
# real UI backend; no kind cluster is needed.

on:
  # No paths filter, deliberately: release-critical checks must always report
  # (see e2e.yml for why a path-filtered check can block merging).
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: api-credentials-e2e-${{ github.event.pull_request.number || github.sha }}
  # PR runs cancel superseded runs of themselves; push/schedule/dispatch
  # runs are grouped per commit SHA and never cancel each other. Grouping
  # main pushes by ref once let an older commit's late run cancel or
  # displace HEAD's run, losing checks release.yml requires (2026-09-24).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  live:
    name: generated credentials + API edge codes (live)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Shares one of three heavy-E2E lanes per PR/commit; see e2e.yml's
    # migration-dryrun job for the full rationale (why throttle, why
    # queue: max instead of the default queue: single). Lane c: it builds
    # both images but needs no kind cluster, so it is among the lighter jobs.
    concurrency:
      group: heavy-e2e-lane-c-${{ github.event.pull_request.number || github.sha }}
      queue: max
      cancel-in-progress: false
    env:
      LDAPIUM_IMAGE: ldapium:api-e2e
      LDAPIUM_UI_IMAGE: ldapium-ui:api-e2e
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build server image
        run: docker build -t "$LDAPIUM_IMAGE" image
      - name: Build UI image
        run: docker build -t "$LDAPIUM_UI_IMAGE" ui

      - name: Generated credentials (bind, private mode, no leaks, reuse, fail closed)
        run: python3 scripts/test/test-generated-credentials-local.py

      - name: API edge codes (unlock, lock, group members, router errors, redaction)
        run: python3 scripts/test/test-api-edge-codes-local.py

      # The scripts remove their own containers even on failure (the edge-code
      # script prints scrubbed container logs first), so this only reports leaks.
      - name: Report leftover docker objects
        if: always()
        run: |
          docker ps -a --filter name=ldapium-secrets- --filter name=ldapium-edge- --format '{{.Names}} {{.Status}}'
          docker volume ls --filter name=ldapium-secrets- --filter name=ldapium-edge- --format '{{.Name}}'
