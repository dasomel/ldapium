name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-server:
    name: Build server image
    uses: ./.github/workflows/build-multiarch.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image-name: openldap-suite
      context: image
      metadata-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha
        type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

  build-ui:
    name: Build UI image
    uses: ./.github/workflows/build-multiarch.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image-name: openldap-suite-ui
      context: ui
      metadata-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha
        type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

  helm-push:
    name: Push Helm chart
    needs: [build-server, build-ui]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Tag pushes (vX.Y.Z) drive the chart version directly; a manual
      # workflow_dispatch run (no tag) gets a non-publishable dev version so
      # it can still be smoke-tested without colliding with real releases.
      - name: Determine chart version
        id: chart_version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="0.0.0-dev.${SHORT_SHA:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          helm package charts/openldap \
            --version "${{ steps.chart_version.outputs.version }}" \
            --app-version "${{ steps.chart_version.outputs.version }}" \
            --destination /tmp/chart-out

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart
        run: |
          helm push /tmp/chart-out/openldap-*.tgz \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"
