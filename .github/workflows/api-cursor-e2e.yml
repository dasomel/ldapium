name: API cursor pagination E2E (docker)

# Wires the live checks of #215 (docs/changes/api-cursor-pagination):
#   - scripts/test/test-api-cursor-pagination-local.py: 12000 users + 12000
#     groups through the real backend, admin and non-root traversals compared
#     with an ldapsearch ground truth (no duplicates, no omissions, strictly
#     increasing), the default-config size_limit_exceeded error, the
#     LDAP_PAGED_TOTAL_LIMIT reconcile, cursor misuse, userPassword absence,
#     the documented concurrent-change table, latency numbers, and (with a
#     latency-injecting proxy) no same-session starvation plus the 30 s
#     request deadline leaving the shared connection healthy.
#   - go test -tags live: the same-keyset logic against a real slapd with real
#     deletes/renames/modifies/ACL changes between the two lookup phases.
# It takes about ten minutes, so it is deliberately NOT a required check:
# path-filtered on the code it exercises, plus manual dispatch.

on:
  pull_request:
    paths:
      - "ui/backend/internal/ldapclient/**"
      - "ui/backend/internal/httpapi/**"
      - "ui/backend/go.mod"
      - "ui/backend/go.sum"
      - "image/entrypoint.sh"
      - "scripts/test/test-api-cursor-pagination-local.py"
      - ".github/workflows/api-cursor-e2e.yml"
  workflow_dispatch:
    inputs:
      count:
        description: "Users and groups to load (50000 for the larger perf run)"
        default: "12000"

permissions:
  contents: read

concurrency:
  group: api-cursor-e2e-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  live:
    name: cursor pagination (live)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LDAPIUM_IMAGE: ldapium:cursor-e2e
      LDAPIUM_UI_IMAGE: ldapium-ui:cursor-e2e
      LDAPIUM_COUNT: ${{ github.event.inputs.count || '12000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build server image
        run: docker build -t "$LDAPIUM_IMAGE" image
      - name: Build UI image
        run: docker build -t "$LDAPIUM_UI_IMAGE" ui

      - name: Traversal, size limit, reconcile, cursors, concurrency, latency, starvation
        run: python3 scripts/test/test-api-cursor-pagination-local.py

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ui/backend/go.mod
          cache-dependency-path: ui/backend/go.sum

      - name: Between-phase changes against a real slapd (go test -tags live)
        run: |
          set -euo pipefail
          docker run -d --name cursor-live -p 127.0.0.1:13890:389 \
            -e LDAP_ROOT_DN=dc=example,dc=org -e LDAP_ADMIN_PASSWORD=live-admin-pw "$LDAPIUM_IMAGE"
          ready=0
          for _ in $(seq 1 60); do
            if docker exec cursor-live ldapwhoami -x -H ldap://127.0.0.1 -D cn=admin,dc=example,dc=org -w live-admin-pw >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "slapd in cursor-live never became ready" >&2
            docker logs cursor-live >&2 || true
            exit 1
          fi
          cd ui/backend
          LDAP_LIVE_URL=ldap://127.0.0.1:13890 LDAP_LIVE_ROOT=dc=example,dc=org LDAP_LIVE_ADMIN_PASSWORD=live-admin-pw \
            go test -tags live -race -count=1 -run Live ./internal/ldapclient/
          docker rm -f cursor-live
