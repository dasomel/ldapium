name: Machine write E2E (real Keycloak)

# Release gate for the machine WRITE scope (#378 / #285, change package docs/changes/machine-write-scope, T-025):
# the five first-ship operations against a REAL Keycloak, a real slapd prepared with the documented W_data/W_lock
# ACL fragments, and the production UI image (no drill build) with MACHINE_WRITE_ENABLED=true.
#   - test-machine-write-keycloak-live.py: positive and negative tokens, scope / client ceiling / subtree / protected
#     DN / group / attribute denials, the W_data ACL backstop, 428 / 412 / idempotent replay, one audit line per
#     request with the write fields, write budget and single write slot, secret scan of all container logs.
#   - test-machine-write-drill.py: the emergency block (password rotation, write-only redeploy, in-flight window,
#     W_* lockout) on the same production image.
#   - test-machine-write-v2b-live.py (machine-write-scope-v2 T-015): the four v2b operations (createGroup with the
#     placeholder seed, patchGroup, deleteGroup, lockUser) and the refusal of unlock, against real Keycloak tokens
#     and slapd, including a real UI + slapd restart. It needs the tree that contains the T-014 opening.
#   - machine-write-scope-v2 v2c (#379, T-027): the password compartment proofs, each against a fresh real slapd built
#     with the documented procedure: test-machine-write-cred-premise-live.py (T-028 premise checks and sweeps),
#     test-machine-write-cred-secret-live.py (T-024 setPassword, secret scans, E-17; accepted + auditlog configs) and
#     test-machine-write-cred-drill.py (T-025 per-compartment emergency block). Their Go side is a `live`-tagged test
#     binary cross-compiled by the script, so this job sets up Go. The v2c ACL proof (T-021) stays in
#     api-credentials-e2e.yml with the other ACL proofs; it is not repeated here.
#   - test-machine-write-cred-keycloak-live.py (#417 (b)): setPassword through a real Keycloak token, the production UI
#     image configured by environment only (config.Load) and a real slapd prepared like the T-028 proof, with the
#     AC-009 secret scans of responses, UI / slapd / Keycloak logs and cn=accesslog, and the emergency block.
# It is a release-critical check: release.yml requires the exact job name below on the tagged SHA.
#
# The second job, `machine write measurements (E-22, two-provider R-3)` (#429), repeats the #417 (c) measurements
# (EVIDENCE §2q, §2r) on every change. It is deliberately NOT release-critical: E-22 waits on the real 60 s premise
# ticker, so its timing margins on shared runners are observed here before anyone makes it a gate.

on:
  # No paths filter, deliberately: release-critical checks must always report
  # (see e2e.yml for why a path-filtered check can block merging).
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: machine-write-e2e-${{ github.event.pull_request.number || github.sha }}
  # PR runs cancel superseded runs of themselves; push/dispatch runs are grouped
  # per commit SHA and never cancel each other (see machine-keycloak-e2e.yml).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Exact tag, same pin as machine-keycloak-e2e.yml: a failure here must not be ambiguous between
  # "this integration broke" and "upstream changed under us". The scripts read it from KEYCLOAK_IMAGE.
  KEYCLOAK_IMAGE: quay.io/keycloak/keycloak:26.7.4
  LDAPIUM_IMAGE: ldapium:machine-write-e2e
  LDAPIUM_UI_IMAGE: ldapium-ui:machine-write-e2e

jobs:
  machine-write:
    name: machine write (real Keycloak)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Shares one of three heavy-E2E lanes per PR/commit; see e2e.yml's
    # migration-dryrun job for the full rationale.
    concurrency:
      group: heavy-e2e-lane-b-${{ github.event.pull_request.number || github.sha }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ui/backend/go.mod
          cache-dependency-path: ui/backend/go.sum

      - name: Build server image
        run: docker build -t "$LDAPIUM_IMAGE" image

      # The normal build: the write operations are registered in every build and act only with
      # MACHINE_WRITE_ENABLED=true, so this is the image that ships.
      - name: Build UI image
        run: docker build -t "$LDAPIUM_UI_IMAGE" ui

      - name: Pull the pinned Keycloak image
        run: docker pull "$KEYCLOAK_IMAGE"

      - name: Machine write (positive and negative tokens, ceilings, 428/412/replay, audit, limits, secret scan)
        run: python3 scripts/test/test-machine-write-keycloak-live.py

      - name: Machine write emergency-block drill (production image, two replicas, in-flight window, W_* lockout)
        run: python3 scripts/test/test-machine-write-drill.py

      - name: Machine write v2b drill (group seed / allow-list / privileged refusal, lock, unlock bypass attempts, restart)
        run: python3 scripts/test/test-machine-write-v2b-live.py

      - name: Machine write v2c premise checks and sweeps (canaries, ACL drift, accesslog read, stuck/TTL/orphan sweeps)
        run: python3 scripts/test/test-machine-write-cred-premise-live.py

      - name: Machine write v2c setPassword (HTTP pipeline, secret scans of responses/logs/accesslog, concurrency, E-10)
        run: python3 scripts/test/test-machine-write-cred-secret-live.py

      - name: Machine write v2c emergency-block drill (W_cred rotation, flag off, in-flight window, manual procedure)
        run: python3 scripts/test/test-machine-write-cred-drill.py

      - name: Machine write v2c setPassword end to end (real Keycloak token, production UI image + config.Load, secret scans, emergency block)
        run: python3 scripts/test/test-machine-write-cred-keycloak-live.py

      # The scripts remove their own containers, volumes and networks even on failure. The runner is
      # fresh per job, so anything left under these prefixes belongs to this run: list it and fail.
      - name: Fail on leftover docker objects
        if: always()
        run: |
          set -u
          leaks=0
          for kind in "ps -a" "volume ls" "network ls"; do
            case "$kind" in
              "ps -a") fmt='{{.Names}} {{.Status}}' ;;
              *) fmt='{{.Name}}' ;;
            esac
            # shellcheck disable=SC2086
            out=$(docker $kind --filter name=ldapium-mwk- --filter name=ldapium-mwd- --filter name=ldapium-cpre- --filter name=ldapium-t024- --filter name=ldapium-t025- --format "$fmt")
            if [ -n "$out" ]; then
              echo "::error::leftover docker objects ($kind):"
              echo "$out"
              leaks=1
            fi
          done
          [ "$leaks" -eq 0 ]

  # Not in release.yml's required list (see the header). Neither script needs Keycloak or the UI image.
  measurements:
    name: machine write measurements (E-22, two-provider R-3)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Shares one of three heavy-E2E lanes per PR/commit; see e2e.yml's migration-dryrun job for the
    # full rationale. Lane a: lane b already carries both machine Keycloak jobs (about 30 min).
    concurrency:
      group: heavy-e2e-lane-a-${{ github.event.pull_request.number || github.sha }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # E-22's Go side is a `live`-tagged test binary cross-compiled by the script.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ui/backend/go.mod
          cache-dependency-path: ui/backend/go.sum

      - name: Build server image
        run: docker build -t "$LDAPIUM_IMAGE" image

      - name: E-22 check-to-write window (held write, own-check 503, 60 s ticker close, held-write abort)
        run: python3 scripts/test/test-machine-write-cred-e22-live.py

      - name: R-3 on two providers (pinned bundle, concurrent sets, bundle-on-both control, deny rule)
        run: python3 scripts/test/test-machine-write-cred-multiprovider-live.py

      - name: Fail on leftover docker objects
        if: always()
        run: |
          set -u
          leaks=0
          for kind in "ps -a" "volume ls" "network ls"; do
            case "$kind" in
              "ps -a") fmt='{{.Names}} {{.Status}}' ;;
              *) fmt='{{.Name}}' ;;
            esac
            # shellcheck disable=SC2086
            out=$(docker $kind --filter name=ldapium-e22- --filter name=ldapium-v2cmp- --format "$fmt")
            if [ -n "$out" ]; then
              echo "::error::leftover docker objects ($kind):"
              echo "$out"
              leaks=1
            fi
          done
          [ "$leaks" -eq 0 ]
