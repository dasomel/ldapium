name: Metrics E2E

on:
  pull_request:
    paths:
      - "image/**"
      - "charts/**"
      - "tests/prometheus/**"
      - "scripts/render-alert-rules.sh"
      - ".github/workflows/metrics-e2e.yml"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build server image
        run: docker build -t ldapium:e2e image

      - name: Create cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: metrics

      - name: Load image
        run: |
          docker pull prom/prometheus:v3.7.3
          kind load docker-image ldapium:e2e --name metrics
          kind load docker-image prom/prometheus:v3.7.3 --name metrics

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install LDAPium with metrics
        run: |
          helm install directory charts/ldapium \
            --namespace directory --create-namespace \
            --set image.repository=ldapium \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --set replicaCount=2 \
            --set-string 'ldap.adminDN=cn=admin\,dc=example\,dc=org' \
            --set auth.adminPassword='metrics-e2e-password' \
            --set ui.enabled=false \
            --set metrics.enabled=true \
            --set metrics.serviceMonitor.enabled=false \
            --set metrics.prometheusRule.enabled=false \
            --wait --timeout 5m

      - name: Wait for metrics endpoint
        run: |
          set -euo pipefail
          kubectl -n directory run metrics-client --rm -i --restart=Never --image=curlimages/curl:8.16.0 -- \
            sh -ec 'until curl -fsS http://directory-ldapium-metrics.directory.svc.cluster.local:9330/metrics | grep -q "openldap_scrape"; do sleep 2; done'

      - name: Verify core metrics
        run: |
          set -euo pipefail
          kubectl -n directory run metrics-client --rm -i --restart=Never --image=curlimages/curl:8.16.0 -- \
            sh -ec 'curl -fsS http://directory-ldapium-metrics.directory.svc.cluster.local:9330/metrics | grep -E "openldap_(scrape|bind|dial|monitor_counter_object|monitored_object)"'

      - name: Deploy Prometheus and alert rules
        run: |
          set -euo pipefail
          # Render chart rules for the live release with fast evaluation window
          helm template directory charts/ldapium \
            --namespace directory \
            --values charts/ldapium/examples/metrics-values.yaml \
            --set metrics.prometheusRule.exporterDownFor=5s \
            --set auth.adminPassword='metrics-e2e-password' \
            --show-only templates/prometheusrule.yaml \
            | sed -n '/^spec:/,$p' | tail -n +2 | sed 's/^  //' > /tmp/live-rules.yaml

          kubectl -n directory create configmap prometheus-rules --from-file=rules.yaml=/tmp/live-rules.yaml

          cat <<'EOF' | kubectl -n directory apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: prometheus-config
            namespace: directory
          data:
            prometheus.yml: |
              global:
                scrape_interval: 2s
                evaluation_interval: 2s
              rule_files:
                - /etc/prometheus/rules/rules.yaml
              scrape_configs:
                - job_name: 'ldapium'
                  static_configs:
                    - targets:
                        - 'directory-ldapium-0.directory-ldapium-headless.directory.svc.cluster.local:9330'
                        - 'directory-ldapium-1.directory-ldapium-headless.directory.svc.cluster.local:9330'
                      labels:
                        service: 'directory-ldapium-metrics'
                        namespace: 'directory'
                        release: 'directory'
          EOF

          cat <<'EOF' | kubectl -n directory apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: prometheus
            namespace: directory
            labels:
              app: prometheus
          spec:
            restartPolicy: Never
            containers:
              - name: prometheus
                image: prom/prometheus:v3.7.3
                imagePullPolicy: Never
                args:
                  - "--config.file=/etc/prometheus/prometheus.yml"
                  - "--storage.tsdb.path=/prometheus"
                ports:
                  - containerPort: 9090
                volumeMounts:
                  - name: config
                    mountPath: /etc/prometheus
                  - name: rules
                    mountPath: /etc/prometheus/rules
            volumes:
              - name: config
                configMap:
                  name: prometheus-config
              - name: rules
                configMap:
                  name: prometheus-rules
          EOF

          kubectl -n directory wait --for=condition=Ready pod/prometheus --timeout=60s

      - name: Inject peer fault and assert alert fires via Prometheus API
        run: |
          set -euo pipefail
          # Scale down from 2 to 1 replicas so provider 1 is shut down
          kubectl -n directory scale statefulset directory-ldapium --replicas=1
          kubectl -n directory wait --for=delete pod/directory-ldapium-1 --timeout=60s

          # Poll Prometheus API until LDAPiumExporterDown is firing with release label
          i=0
          until kubectl -n directory exec prometheus -- wget -qO- http://localhost:9090/api/v1/alerts \
            | grep -q '"alertname":"LDAPiumExporterDown".*"release":"directory".*"state":"firing"'; do
            i=$((i + 1))
            if [ "$i" -gt 30 ]; then
              echo "::error::LDAPiumExporterDown alert did not fire with release: directory label within 60s"
              kubectl -n directory exec prometheus -- wget -qO- http://localhost:9090/api/v1/alerts || true
              exit 1
            fi
            sleep 2
          done

          echo "PASS: LDAPiumExporterDown is firing with release label via Prometheus API:"
          kubectl -n directory exec prometheus -- wget -qO- http://localhost:9090/api/v1/alerts

      - name: Verify Helm rendering with observability profile
        run: |
          helm template directory charts/ldapium \
            -f charts/ldapium/examples/metrics-values.yaml \
            --set-string 'ldap.adminDN=cn=admin\,dc=example\,dc=org' \
            --set auth.adminPassword='metrics-e2e-password' > /tmp/rendered-metrics.yaml
          grep -q 'name: directory-ldapium-metrics' /tmp/rendered-metrics.yaml
          grep -q 'containerPort: 9330' /tmp/rendered-metrics.yaml
          grep -q 'kind: ServiceMonitor' /tmp/rendered-metrics.yaml
          grep -q 'kind: PrometheusRule' /tmp/rendered-metrics.yaml
          grep -q 'LDAPiumConnectionSaturation' /tmp/rendered-metrics.yaml
          grep -q 'LDAPiumContextCSNDivergence' /tmp/rendered-metrics.yaml
          grep -q 'LDAPiumBackupStale' /tmp/rendered-metrics.yaml
          grep -q 'LDAPiumMDBUsageHigh' /tmp/rendered-metrics.yaml

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n directory get pods -o wide || true
          kubectl -n directory get svc || true
          kubectl -n directory describe pods || true
          kubectl -n directory get events --sort-by=.lastTimestamp | tail -80 || true
          kubectl -n directory logs statefulset/directory-ldapium -c metrics --tail=300 || true
          # On a CrashLoopBackOff the current log only shows the restart, not the
          # first-boot failure that poisoned the volume — dump the previous one too.
          kubectl -n directory logs statefulset/directory-ldapium --all-containers --previous --tail=300 || true

      - name: Uninstall
        if: always()
        run: helm uninstall directory --namespace directory || true

  alert-rules:
    name: alert rules fire on injected faults
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Render the chart's alert rules
        run: scripts/render-alert-rules.sh
      - name: Run the fault-injection cases
        run: |
          set -euo pipefail
          # promtool ships inside the Prometheus image; the image's entrypoint is
          # prometheus itself, hence --entrypoint.
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/tests/prometheus:/tests" \
            -w /tests \
            prom/prometheus:v3.7.3 \
            test rules alerts_test.yaml
      - name: Upload the rules that were tested
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alert-rules
          path: tests/prometheus/rules.yaml
          if-no-files-found: error
          retention-days: 14
