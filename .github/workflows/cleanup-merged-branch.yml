name: Cleanup merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-merged-head:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged head ref
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          encoded_ref="$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ['HEAD_REF'], safe=''))
          PY
          )"
          http_status="$(curl --silent --show-error --output /tmp/delete-ref-response.json \
            --write-out '%{http_code}' \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/git/refs/heads/${encoded_ref}")"

          # 204 = deleted here; 422 "Reference does not exist" means the goal
          # (branch gone) is already met — e.g. `gh pr merge --delete-branch`
          # or GitHub's own branch-protection auto-delete beat this workflow
          # to it. Either way there is nothing left to delete, so treat it as
          # success instead of a spurious failure on every such race.
          case "${http_status}" in
            204) echo "deleted ${HEAD_REF}" ;;
            422)
              if grep -q "Reference does not exist" /tmp/delete-ref-response.json; then
                echo "${HEAD_REF} already deleted (no-op)"
              else
                echo "::error::unexpected 422 response:"; cat /tmp/delete-ref-response.json; exit 1
              fi
              ;;
            *)
              echo "::error::unexpected HTTP ${http_status}:"; cat /tmp/delete-ref-response.json; exit 1
              ;;
          esac
