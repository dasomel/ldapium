name: E2E (kind)

# Installs the chart into throwaway kind clusters and runs helm tests.
# The TLS matrix additionally proves LDAPS and, for replicated installs,
# that syncrepl is configured over ldaps:// with strict CA verification.

on:
  # No paths filter, deliberately. `install + helm test (standalone)` and
  # `install + helm test (replicated)` are required status checks on main, and a
  # required check that is path-filtered does not merely skip on a PR that
  # touches nothing it watches — it never reports, so the PR can never satisfy
  # the branch policy and can never merge. That is not hypothetical: it blocked
  # a PR that changed only another workflow file. Either these run on every PR,
  # as ci.yml's required checks already do, or they stop being required.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: install + helm test (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: standalone
            replicas: 1
          - scenario: replicated
            replicas: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build server image
        run: docker build -t ldapium:e2e image
      - name: Build UI image
        run: docker build -t ldapium-ui:e2e ui
      - name: Create cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: e2e
      - name: Load images into the cluster
        run: |
          kind load docker-image ldapium:e2e --name e2e
          kind load docker-image ldapium-ui:e2e --name e2e
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install chart
        run: |
          helm install directory charts/ldapium \
            --namespace directory --create-namespace \
            --set image.repository=ldapium \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --set-string 'ldap.adminDN=cn=admin\,dc=example\,dc=org' \
            --set auth.adminPassword="$(head -c 24 /dev/urandom | base64)" \
            --set ui.enabled=true \
            --set ui.image.repository=ldapium-ui \
            --set ui.image.tag=e2e \
            --set ui.image.pullPolicy=Never \
            --set replicaCount=${{ matrix.replicas }} \
            --wait --timeout 5m
      # --logs is the whole point: without it a failure reports only that the
      # test pod exited non-zero. Requiring the report to actually appear keeps
      # a silent regression in log retrieval from reading as a passing test.
      - name: Run helm test
        run: |
          set -euo pipefail
          helm test directory --namespace directory --logs 2>&1 | tee /tmp/helm-test.log
          # The script's own final line, printed only after every check passed.
          # Matching a per-check PASS instead would be satisfied by the first
          # one, which is not the question being asked here.
          grep -q 'all checks passed' /tmp/helm-test.log
      # Live counterpart to ci.yml's fixture-only "Incident evidence bundle"
      # job: proves the script actually produces a valid, redacted,
      # self-consistent bundle against a real (if minimally configured) kind
      # deployment, not just against synthetic fixtures. cn=Monitor is
      # expected to come back "unavailable" here (see monitor.go's own
      # comment: the default ACL denies read to everyone but the metrics
      # exporter's own bind identity) — that is this chart's real default
      # behavior, not a broken test.
      #
      # A separate step (not folded into "Export incident evidence" below):
      # every other ldapwhoami/ldapsearch call in this workflow runs inside
      # the server container via `kubectl exec` (image ldap-utils); this is
      # the first one this repo ever runs directly on the GitHub-hosted
      # runner. Keeping the install as its own step means a runner-image
      # regression (ldap-utils becoming unavailable/unpackaged) fails here,
      # distinctly from the export step itself failing.
      - name: Install ldap-utils on the runner
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ldap-utils
      - name: Export incident evidence
        run: |
          set -euo pipefail
          # umask 077 + mktemp: the admin password never lands at a
          # predictable, world-readable path, and the trap removes it
          # whether this step succeeds or fails — a fixed /tmp path left
          # behind on the runner is exactly the kind of thing this script's
          # own redaction guarantee exists to prevent from happening to the
          # *bundle*; the same care applies to the credential used to build it.
          umask 077
          pwfile=$(mktemp)
          pf_pid=""
          cleanup() {
            [ -z "$pf_pid" ] || kill "$pf_pid" 2>/dev/null || true
            rm -f "$pwfile"
          }
          trap cleanup EXIT
          kubectl -n directory get secret directory-ldapium-admin -o jsonpath='{.data.admin-password}' \
            | base64 -d > "$pwfile"
          kubectl -n directory port-forward svc/directory-ldapium 3389:389 >/tmp/incident-port-forward.log 2>&1 &
          pf_pid=$!
          for _ in $(seq 1 30); do
            ldapwhoami -x -H ldap://localhost:3389 >/dev/null 2>&1 && break
            sleep 1
          done
          ./scripts/export-incident-evidence.sh \
            -b dc=example,dc=org \
            -H ldap://localhost:3389 \
            --password-file "$pwfile" \
            --k8s-namespace directory \
            -o /tmp/incident-evidence
          echo "::group::manifest.json"
          cat /tmp/incident-evidence/manifest.json
          echo "::endgroup::"
          jq -e '.schemaVersion == "1"' /tmp/incident-evidence/manifest.json >/dev/null
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n directory get pods -o wide
          kubectl -n directory describe pods
          for pod in $(kubectl -n directory get pods -o name); do
            echo "::group::logs $pod"
            kubectl -n directory logs "$pod" --all-containers --tail=200 || true
            kubectl -n directory logs "$pod" --all-containers --previous --tail=200 || true
            echo "::endgroup::"
          done
          kubectl -n directory get events --sort-by=.lastTimestamp | tail -40
      - name: Uninstall
        if: always()
        run: helm uninstall directory --namespace directory || true

  tls:
    name: TLS E2E (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: standalone
            replicas: 1
          - scenario: replicated
            replicas: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build server image
        run: docker build -t ldapium:e2e image
      - name: Build UI image
        run: docker build -t ldapium-ui:e2e ui
      - name: Create cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: e2e
      - name: Load images into the cluster
        run: |
          kind load docker-image ldapium:e2e --name e2e
          kind load docker-image ldapium-ui:e2e --name e2e
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Generate test CA and server certificate
        run: |
          set -euo pipefail
          mkdir -p /tmp/ldapium-tls
          openssl genrsa -out /tmp/ldapium-tls/ca.key 2048
          openssl req -x509 -new -nodes -key /tmp/ldapium-tls/ca.key -sha256 -days 1 -subj "/CN=ldapium-e2e-ca" -out /tmp/ldapium-tls/ca.crt
          cat >/tmp/ldapium-tls/server.cnf <<'EOF'
          [req]
          distinguished_name = req_dn
          req_extensions = req_ext
          prompt = no
          [req_dn]
          CN = directory-ldapium.directory.svc.cluster.local
          [req_ext]
          subjectAltName = @alt_names
          [alt_names]
          DNS.1 = directory-ldapium.directory.svc.cluster.local
          DNS.2 = *.directory-ldapium-headless.directory.svc.cluster.local
          EOF
          openssl genrsa -out /tmp/ldapium-tls/tls.key 2048
          openssl req -new -key /tmp/ldapium-tls/tls.key -out /tmp/ldapium-tls/server.csr -config /tmp/ldapium-tls/server.cnf
          openssl x509 -req -in /tmp/ldapium-tls/server.csr -CA /tmp/ldapium-tls/ca.crt -CAkey /tmp/ldapium-tls/ca.key -CAcreateserial -out /tmp/ldapium-tls/tls.crt -days 1 -sha256 -extensions req_ext -extfile /tmp/ldapium-tls/server.cnf
      - name: Generate rotation and expiry test certificates
        run: |
          set -euo pipefail
          dir=/tmp/ldapium-tls
          mkdir -p /tmp/tls-evidence
          # A renewal: same CA and same names, new key and new serial.
          openssl genrsa -out "$dir/rotated.key" 2048
          openssl req -new -key "$dir/rotated.key" -out "$dir/rotated.csr" -config "$dir/server.cnf"
          openssl x509 -req -in "$dir/rotated.csr" -CA "$dir/ca.crt" -CAkey "$dir/ca.key" \
            -CAcreateserial -out "$dir/rotated.crt" -days 1 -sha256 \
            -extensions req_ext -extfile "$dir/server.cnf"
          # A second, independent CA plus a leaf it signs — for the "Rotate
          # the CA in two steps" test below. README's "Replacing the CA"
          # procedure was documented but never actually exercised; this pair
          # is what proves it, not just states it.
          openssl genrsa -out "$dir/ca2.key" 2048
          openssl req -x509 -new -nodes -key "$dir/ca2.key" -sha256 -days 1 -subj "/CN=ldapium-e2e-ca2" -out "$dir/ca2.crt"
          openssl genrsa -out "$dir/leaf-ca2.key" 2048
          openssl req -new -key "$dir/leaf-ca2.key" -out "$dir/leaf-ca2.csr" -config "$dir/server.cnf"
          openssl x509 -req -in "$dir/leaf-ca2.csr" -CA "$dir/ca2.crt" -CAkey "$dir/ca2.key" \
            -CAcreateserial -out "$dir/leaf-ca2.crt" -days 1 -sha256 \
            -extensions req_ext -extfile "$dir/server.cnf"
          cat "$dir/ca.crt" "$dir/ca2.crt" > "$dir/ca-bundle.crt"
          # An already-expired certificate. `openssl x509 -req` cannot backdate on
          # the runner's OpenSSL 3.0, so this one is signed through `openssl ca`,
          # which does take explicit start and end dates.
          mkdir -p "$dir/ca-db/newcerts"
          : >"$dir/ca-db/index.txt"
          echo 1000 >"$dir/ca-db/serial"
          cat >"$dir/ca-db/ca.cnf" <<EOF
          [ca]
          default_ca = CA_default
          [CA_default]
          dir = $dir/ca-db
          database = \$dir/index.txt
          serial = \$dir/serial
          new_certs_dir = \$dir/newcerts
          default_md = sha256
          policy = policy_any
          email_in_dn = no
          unique_subject = no
          [policy_any]
          commonName = supplied
          EOF
          openssl genrsa -out "$dir/expired.key" 2048
          openssl req -new -key "$dir/expired.key" -out "$dir/expired.csr" -config "$dir/server.cnf"
          openssl ca -batch -config "$dir/ca-db/ca.cnf" -cert "$dir/ca.crt" -keyfile "$dir/ca.key" \
            -in "$dir/expired.csr" -out "$dir/expired.crt" -notext \
            -startdate 20240101000000Z -enddate 20240102000000Z \
            -extensions req_ext -extfile "$dir/server.cnf"
          openssl x509 -in "$dir/expired.crt" -noout -subject -dates | tee /tmp/tls-evidence/expired-certificate.txt
      - name: Set up TLS Secret
        run: |
          kubectl create namespace directory
          # Piped through `apply` so the rotation test, which also applies, is
          # not a mixed create/apply on the same object.
          kubectl -n directory create secret generic ldapium-tls \
            --from-file=tls.crt=/tmp/ldapium-tls/tls.crt \
            --from-file=tls.key=/tmp/ldapium-tls/tls.key \
            --from-file=ca.crt=/tmp/ldapium-tls/ca.crt \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Install TLS chart
        run: |
          set -euo pipefail
          helm install directory charts/ldapium \
            --namespace directory \
            --set image.repository=ldapium \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --set-string 'ldap.adminDN=cn=admin\,dc=example\,dc=org' \
            --set auth.adminPassword="$(head -c 24 /dev/urandom | base64)" \
            --set ui.enabled=false \
            --set replicaCount=${{ matrix.replicas }} \
            --set tls.enabled=true \
            --set tls.existingSecret=ldapium-tls \
            --set tls.caFile=/etc/openldap/tls/ca.crt \
            --wait --timeout 5m
      - name: Verify LDAPS and strict certificate validation
        env:
          REPLICAS: ${{ matrix.replicas }}
        run: |
          set -euo pipefail
          admin_dn="cn=admin,dc=example,dc=org"
          service_host="directory-ldapium.directory.svc.cluster.local"
          ldap_base="dc=example,dc=org"
          password=$(kubectl -n directory get secret directory-ldapium-admin -o jsonpath='{.data.admin-password}' | base64 -d)
          echo "Checking LDAPS authenticated bind..."
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/etc/openldap/tls/ca.crt ldapwhoami -x -H "ldaps://directory-ldapium.directory.svc.cluster.local:636" -D "cn=admin,dc=example,dc=org" -w "$LDAP_ADMIN_PASSWORD"'
          echo "Checking invalid CA is rejected..."
          if kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'printf "%s\n" invalid-ca > /tmp/bad-ca.pem; LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/tmp/bad-ca.pem ldapwhoami -x -H "ldaps://directory-ldapium.directory.svc.cluster.local:636" -D "cn=admin,dc=example,dc=org" -w "$LDAP_ADMIN_PASSWORD"' >/tmp/bad-ca.out 2>&1; then
            echo "::error::LDAP bind unexpectedly succeeded with an invalid CA"
            cat /tmp/bad-ca.out
            exit 1
          else
            echo "PASS: invalid CA rejected"
          fi
          echo "Checking hostname mismatch is rejected..."
          if kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/etc/openldap/tls/ca.crt ldapwhoami -x -H "ldaps://directory-ldapium:636" -D "cn=admin,dc=example,dc=org" -w "$LDAP_ADMIN_PASSWORD"' >/tmp/bad-san.out 2>&1; then
            echo "::error::LDAP bind unexpectedly succeeded with a hostname mismatch"
            cat /tmp/bad-san.out
            exit 1
          else
            echo "PASS: hostname mismatch rejected"
          fi
          if [ "$REPLICAS" -ge 2 ]; then
            echo "Checking syncrepl uses ldaps:// and not plaintext..."
            kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
              'LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/etc/openldap/tls/ca.crt ldapsearch -x -LLL -H ldapi://%2Fvar%2Flib%2Fopenldap%2Frun%2Fldapi -D "cn=admin,cn=config" -w "$LDAP_ADMIN_PASSWORD" -b "olcDatabase={1}mdb,cn=config" -s base olcSyncrepl' \
              | tee /tmp/syncrepl.txt
            grep -q 'provider=ldaps://' /tmp/syncrepl.txt
            if grep -q 'provider=ldap://' /tmp/syncrepl.txt; then
              echo "::error::plaintext LDAP replication provider detected"
              exit 1
            fi
            echo "Creating a test entry through LDAPS on provider 0..."
            kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
              'LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/etc/openldap/tls/ca.crt ldapadd -x -H "ldaps://directory-ldapium-0.directory-ldapium-headless.directory.svc.cluster.local:636" -D "cn=admin,dc=example,dc=org" -w "$LDAP_ADMIN_PASSWORD" <<EOF
          dn: uid=tls-e2e,dc=example,dc=org
          objectClass: inetOrgPerson
          uid: tls-e2e
          cn: tls e2e
          sn: e2e
          EOF'
            for ordinal in 1 2; do
              echo "Checking replicated entry on provider $ordinal over LDAPS..."
              kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
                "i=0; until LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/etc/openldap/tls/ca.crt ldapsearch -x -LLL -H \"ldaps://directory-ldapium-${ordinal}.directory-ldapium-headless.directory.svc.cluster.local:636\" -D \"$admin_dn\" -w \"$password\" -b \"uid=tls-e2e,$ldap_base\" -s base dn >/dev/null 2>&1; do i=\$((i+1)); [ \"\$i\" -lt 30 ] || exit 1; sleep 2; done"
              echo "PASS: provider $ordinal converged over LDAPS"
            done
          fi

      - name: Verify StartTLS on port 389
        run: |
          set -euo pipefail
          admin_dn="cn=admin,dc=example,dc=org"
          service_host="directory-ldapium.directory.svc.cluster.local"
          password=$(kubectl -n directory get secret directory-ldapium-admin -o jsonpath='{.data.admin-password}' | base64 -d)
          # OpenLDAP enables the StartTLS extended operation automatically once
          # olcTLSCertificateFile/olcTLSCertificateKeyFile are configured (this
          # chart sets both whenever tls.enabled), so port 389 is not
          # plaintext-only once TLS is turned on — a client can upgrade the
          # same connection in place instead of opening a separate ldaps://636
          # one. Checked directly against this image rather than assumed;
          # docs/client-compatibility.md previously called this "unverified".
          echo "Checking the root DSE advertises the StartTLS extended operation OID..."
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'ldapsearch -x -H ldap://localhost:389 -b "" -s base supportedExtension' \
            | tee /tmp/starttls-oid.txt
          grep -q '^supportedExtension: 1\.3\.6\.1\.4\.1\.1466\.20037$' /tmp/starttls-oid.txt
          echo "Checking an authenticated bind over StartTLS on port 389 succeeds with strict CA verification..."
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            "LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/etc/openldap/tls/ca.crt ldapwhoami -x -ZZ -H \"ldap://${service_host}:389\" -D \"$admin_dn\" -w \"$password\"" \
            | tee /tmp/starttls-whoami.txt
          grep -q "dn:${admin_dn}" /tmp/starttls-whoami.txt
          echo "Checking StartTLS is rejected when the CA does not verify (fails closed, not open)..."
          # A real, well-formed CA that simply did not sign the server's
          # certificate — not a malformed file. A garbage CA file fails at
          # load time (openssl can't parse it), which would "pass" this
          # negative test for the wrong reason and prove nothing about
          # verification; a valid-but-wrong CA forces the failure to happen
          # at certificate verification, which is what "fails closed" means
          # here. -ZZ (not -Z) makes ldapwhoami abort if StartTLS fails
          # rather than continue in plaintext, so a non-zero exit is the
          # proof there was no silent downgrade.
          if kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            "openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/wrong-ca.key -out /tmp/wrong-ca.pem -days 1 -subj /CN=wrong-ca >/dev/null 2>&1; LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/tmp/wrong-ca.pem ldapwhoami -x -ZZ -H \"ldap://${service_host}:389\" -D \"$admin_dn\" -w \"$password\"" \
            >/tmp/starttls-badca.out 2>&1; then
            echo "::error::StartTLS on port 389 unexpectedly succeeded against a CA that did not sign the server certificate"
            cat /tmp/starttls-badca.out
            exit 1
          fi
          cat /tmp/starttls-badca.out
          echo "PASS: StartTLS on port 389 works and is verified against the CA, same as ldaps://636"

      - name: Verify the TLS protocol floor is enforced
        run: |
          set -euo pipefail
          echo "Checking cn=config carries the floor..."
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'ldapsearch -x -LLL -H ldapi://%2Fvar%2Flib%2Fopenldap%2Frun%2Fldapi -D "cn=admin,cn=config" -w "$LDAP_ADMIN_PASSWORD" -b "cn=config" -s base olcTLSProtocolMin' \
            | tee /tmp/tls-protocol-min.txt
          grep -q '^olcTLSProtocolMin: 3.3$' /tmp/tls-protocol-min.txt

          # The floor a client's own OpenSSL build still lets it *offer* is
          # not something this job controls, so proving TLS 1.0/1.1 are
          # rejected by requesting them would only prove the client refused
          # to ask — not that the server would have refused if asked. Raise
          # the floor past what a real client just used instead: if 3.3
          # (TLS 1.2) genuinely gates connections, then a live TLS 1.2
          # session must stop working the moment the floor becomes 3.4
          # (TLS 1.3), while TLS 1.3 keeps working throughout. That is
          # actual proof the directive is enforced, not just present.
          echo "Confirming TLS 1.2 currently succeeds..."
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'echo | openssl s_client -connect localhost:636 -tls1_2 2>&1' | tee /tmp/tls12-before.txt
          grep -q 'Cipher is' /tmp/tls12-before.txt

          echo "Raising the floor to TLS 1.3 (olcTLSProtocolMin: 3.4)..."
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'ldapmodify -x -H ldapi://%2Fvar%2Flib%2Fopenldap%2Frun%2Fldapi -D "cn=admin,cn=config" -w "$LDAP_ADMIN_PASSWORD" <<EOF
          dn: cn=config
          changetype: modify
          replace: olcTLSProtocolMin
          olcTLSProtocolMin: 3.4
          EOF'

          echo "Confirming TLS 1.2 is now rejected..."
          if kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'echo | openssl s_client -connect localhost:636 -tls1_2 2>&1' | tee /tmp/tls12-after.txt | grep -q 'Cipher is'; then
            echo "::error::TLS 1.2 still succeeded after raising olcTLSProtocolMin to 3.4 — the floor is not actually enforced"
            exit 1
          fi
          echo "Confirming TLS 1.3 still succeeds..."
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'echo | openssl s_client -connect localhost:636 -tls1_3 2>&1' | tee /tmp/tls13-after.txt
          grep -q 'Cipher is' /tmp/tls13-after.txt
          echo "PASS: olcTLSProtocolMin actually gates the negotiated protocol, not just present in cn=config"

          # Restore the project's actual floor: this step raises it to 3.4
          # purely to prove enforcement, and leaving it there would silently
          # change the effective TLS policy for every step that runs after
          # this one in the same job.
          echo "Restoring olcTLSProtocolMin to 3.3..."
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'ldapmodify -x -H ldapi://%2Fvar%2Flib%2Fopenldap%2Frun%2Fldapi -D "cn=admin,cn=config" -w "$LDAP_ADMIN_PASSWORD" <<EOF
          dn: cn=config
          changetype: modify
          replace: olcTLSProtocolMin
          olcTLSProtocolMin: 3.3
          EOF'
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'echo | openssl s_client -connect localhost:636 -tls1_2 2>&1' | tee /tmp/tls12-restored.txt
          grep -q 'Cipher is' /tmp/tls12-restored.txt

      - name: Verify the TLS cipher suite baseline is enforced
        run: |
          set -euo pipefail
          echo "Checking cn=config carries the cipher suite baseline..."
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'ldapsearch -x -LLL -H ldapi://%2Fvar%2Flib%2Fopenldap%2Frun%2Fldapi -D "cn=admin,cn=config" -w "$LDAP_ADMIN_PASSWORD" -b "cn=config" -s base olcTLSCipherSuite' \
            | tee /tmp/tls-cipher-suite.txt
          grep -q '^olcTLSCipherSuite: ECDHE-ECDSA-AES128-GCM-SHA256' /tmp/tls-cipher-suite.txt

          # Same proof shape as the protocol floor above: pick a cipher
          # inside the baseline and one outside it, and show the server
          # actually accepts/refuses on that basis — not just that the
          # directive is present in cn=config.
          echo "Confirming a cipher inside the baseline (ECDHE+AEAD) is accepted over TLS 1.2..."
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'echo | openssl s_client -connect localhost:636 -tls1_2 -cipher ECDHE-RSA-AES128-GCM-SHA256 2>&1' \
            | tee /tmp/cipher-allowed.txt
          grep -q 'Cipher is' /tmp/cipher-allowed.txt

          echo "Confirming a cipher outside the baseline (static-RSA key exchange, no forward secrecy) is rejected..."
          if kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'echo | openssl s_client -connect localhost:636 -tls1_2 -cipher AES128-SHA 2>&1' \
            | tee /tmp/cipher-rejected.txt | grep -q 'Cipher is'; then
            echo "::error::a client offering only AES128-SHA (outside the configured olcTLSCipherSuite) still negotiated a cipher — the baseline is not actually enforced"
            cat /tmp/cipher-rejected.txt
            exit 1
          fi
          cat /tmp/cipher-rejected.txt
          echo "PASS: olcTLSCipherSuite actually gates the negotiated cipher, not just present in cn=config"

      - name: Verify an expired server certificate fails closed
        if: matrix.scenario == 'standalone'
        run: |
          set -euo pipefail
          bind_cmd='LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/etc/openldap/tls/ca.crt ldapwhoami -x -H "ldaps://directory-ldapium.directory.svc.cluster.local:636" -D "cn=admin,dc=example,dc=org" -w "$LDAP_ADMIN_PASSWORD"'
          swap_certificate() {
            kubectl -n directory create secret generic ldapium-tls \
              --from-file=tls.crt="$1" \
              --from-file=tls.key="$2" \
              --from-file=ca.crt=/tmp/ldapium-tls/ca.crt \
              --dry-run=client -o yaml | kubectl apply -f -
            # slapd reads its key material once, at startup. Replacing the pod is
            # both what makes the new certificate take effect and what avoids
            # waiting on the kubelet's own secret refresh interval.
            kubectl -n directory delete pod directory-ldapium-0
            # `rollout status` would not help here: deleting a pod leaves the
            # StatefulSet's generation untouched, so it can report success against
            # the status from before the delete. Wait on the replacement pod.
            for _ in $(seq 1 60); do
              kubectl -n directory get pod directory-ldapium-0 >/dev/null 2>&1 && break
              sleep 2
            done
            kubectl -n directory wait --for=condition=Ready pod/directory-ldapium-0 --timeout=5m
          }
          swap_certificate /tmp/ldapium-tls/expired.crt /tmp/ldapium-tls/expired.key
          if kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c "$bind_cmd" \
            >/tmp/tls-evidence/expired-bind.txt 2>&1; then
            echo "::error::LDAP bind unexpectedly succeeded against an expired server certificate"
            cat /tmp/tls-evidence/expired-bind.txt
            exit 1
          fi
          cat /tmp/tls-evidence/expired-bind.txt
          grep -q 'certificate has expired' /tmp/tls-evidence/expired-bind.txt
          echo "PASS: expired server certificate rejected"
          swap_certificate /tmp/ldapium-tls/tls.crt /tmp/ldapium-tls/tls.key
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c "$bind_cmd" \
            | tee /tmp/tls-evidence/recovered-bind.txt
          echo "PASS: LDAPS recovered once a valid certificate was restored"
      - name: Rotate the server certificate without downtime
        if: matrix.scenario == 'replicated'
        run: |
          set -euo pipefail
          admin_dn="cn=admin,dc=example,dc=org"
          ldap_base="dc=example,dc=org"
          password=$(kubectl -n directory get secret directory-ldapium-admin -o jsonpath='{.data.admin-password}' | base64 -d)
          served_serial() {
            kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
              'openssl s_client -connect directory-ldapium.directory.svc.cluster.local:636 -CAfile /etc/openldap/tls/ca.crt </dev/null 2>/dev/null | openssl x509 -noout -serial' \
              | tr -d '\015'
          }
          before=$(served_serial)
          echo "$before" | tee /tmp/tls-evidence/serial-before-rotation.txt
          # The availability sample runs from a pod outside the StatefulSet, so it
          # survives every directory pod being replaced in turn; `stop` applies
          # the zero-downtime contract (see scripts/e2e-ldaps-probe.sh).
          scripts/e2e-ldaps-probe.sh start tls-rotation-probe
          kubectl -n directory create secret generic ldapium-tls \
            --from-file=tls.crt=/tmp/ldapium-tls/rotated.crt \
            --from-file=tls.key=/tmp/ldapium-tls/rotated.key \
            --from-file=ca.crt=/tmp/ldapium-tls/ca.crt \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n directory rollout restart statefulset/directory-ldapium
          kubectl -n directory rollout status statefulset/directory-ldapium --timeout=10m
          scripts/e2e-ldaps-probe.sh stop tls-rotation-probe /tmp/tls-evidence/rotation "certificate rotation"
          after=$(served_serial)
          echo "$after" | tee /tmp/tls-evidence/serial-after-rotation.txt
          expected=$(openssl x509 -in /tmp/ldapium-tls/rotated.crt -noout -serial)
          if [ "$before" = "$after" ]; then
            echo "::error::the directory is still serving the pre-rotation certificate"
            exit 1
          fi
          test "$after" = "$expected"
          echo "PASS: rotated certificate is being served"
          echo "Checking replication still converges after rotation..."
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/etc/openldap/tls/ca.crt ldapadd -x -H "ldaps://directory-ldapium-0.directory-ldapium-headless.directory.svc.cluster.local:636" -D "cn=admin,dc=example,dc=org" -w "$LDAP_ADMIN_PASSWORD" <<EOF
          dn: uid=tls-rotated,dc=example,dc=org
          objectClass: inetOrgPerson
          uid: tls-rotated
          cn: tls rotated
          sn: rotated
          EOF'
          for ordinal in 1 2; do
            kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
              "i=0; until LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/etc/openldap/tls/ca.crt ldapsearch -x -LLL -H \"ldaps://directory-ldapium-${ordinal}.directory-ldapium-headless.directory.svc.cluster.local:636\" -D \"$admin_dn\" -w \"$password\" -b \"uid=tls-rotated,$ldap_base\" -s base dn >/dev/null 2>&1; do i=\$((i+1)); [ \"\$i\" -lt 30 ] || exit 1; sleep 2; done"
            echo "PASS: provider $ordinal converged over LDAPS after rotation"
          done

      - name: Rotate the CA in two steps without breaking replication
        if: matrix.scenario == 'replicated'
        run: |
          set -euo pipefail
          # README's "Replacing the CA is two rotations, not one" procedure
          # was documented but never actually exercised by CI — this proves
          # it, live, rather than trusting the prose. Cluster is currently
          # serving /tmp/ldapium-tls/rotated.crt, still signed by the
          # original CA (/tmp/ldapium-tls/ca.crt); ca2.crt/leaf-ca2.crt were
          # generated earlier as the "new CA" side of the swap.
          admin_dn="cn=admin,dc=example,dc=org"
          ldap_base="dc=example,dc=org"
          password=$(kubectl -n directory get secret directory-ldapium-admin -o jsonpath='{.data.admin-password}' | base64 -d)
          dir=/tmp/ldapium-tls

          echo "Step 1: publish ca.crt as old+new CA, leaf certificate unchanged..."
          kubectl -n directory create secret generic ldapium-tls \
            --from-file=tls.crt="$dir/rotated.crt" \
            --from-file=tls.key="$dir/rotated.key" \
            --from-file=ca.crt="$dir/ca-bundle.crt" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n directory rollout restart statefulset/directory-ldapium
          kubectl -n directory rollout status statefulset/directory-ldapium --timeout=10m
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            "LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/etc/openldap/tls/ca.crt ldapwhoami -x -H \"ldaps://directory-ldapium.directory.svc.cluster.local:636\" -D \"$admin_dn\" -w \"$password\"" \
            | grep -q "dn:${admin_dn}"
          echo "PASS: bundled trust store still serves the old-CA leaf certificate"

          echo "Step 2: swap the leaf to a new-CA-signed certificate, trust store unchanged — the actual risk window..."
          kubectl -n directory create secret generic ldapium-tls \
            --from-file=tls.crt="$dir/leaf-ca2.crt" \
            --from-file=tls.key="$dir/leaf-ca2.key" \
            --from-file=ca.crt="$dir/ca-bundle.crt" \
            --dry-run=client -o yaml | kubectl apply -f -
          # Same outside-the-StatefulSet availability probe as the single-cert
          # rotation above, same zero-downtime contract: the mixed
          # old-CA-leaf/new-CA-leaf state during this specific rolling restart
          # is what the README warns a single-step CA swap would break.
          scripts/e2e-ldaps-probe.sh start ca-rotation-probe
          kubectl -n directory rollout restart statefulset/directory-ldapium
          kubectl -n directory rollout status statefulset/directory-ldapium --timeout=10m
          scripts/e2e-ldaps-probe.sh stop ca-rotation-probe /tmp/tls-evidence/ca-rotation "CA-trust-then-leaf rotation"
          echo "PASS: swapping to the new CA's leaf certificate was zero-downtime while both CAs were trusted"

          echo "Confirming replication is still healthy after the leaf swap..."
          kubectl -n directory exec directory-ldapium-1 -c openldap -- sh -c \
            "LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/etc/openldap/tls/ca.crt ldapadd -x -H \"ldaps://directory-ldapium-1.directory-ldapium-headless.directory.svc.cluster.local:636\" -D \"$admin_dn\" -w \"$password\" <<EOF2
          dn: uid=ca-rotated,dc=example,dc=org
          objectClass: inetOrgPerson
          uid: ca-rotated
          cn: ca rotated
          sn: rotated
          EOF2"
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            "i=0; until LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/etc/openldap/tls/ca.crt ldapsearch -x -LLL -H \"ldaps://directory-ldapium-0.directory-ldapium-headless.directory.svc.cluster.local:636\" -D \"$admin_dn\" -w \"$password\" -b \"uid=ca-rotated,$ldap_base\" -s base dn >/dev/null 2>&1; do i=\$((i+1)); [ \"\$i\" -lt 30 ] || exit 1; sleep 2; done"
          echo "PASS: replication converged after the new-CA leaf certificate was rolled out"

          echo "Step 3: drop the old CA — ca.crt becomes new-CA-only..."
          kubectl -n directory create secret generic ldapium-tls \
            --from-file=tls.crt="$dir/leaf-ca2.crt" \
            --from-file=tls.key="$dir/leaf-ca2.key" \
            --from-file=ca.crt="$dir/ca2.crt" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n directory rollout restart statefulset/directory-ldapium
          kubectl -n directory rollout status statefulset/directory-ldapium --timeout=10m

          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            "LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/etc/openldap/tls/ca.crt ldapwhoami -x -H \"ldaps://directory-ldapium.directory.svc.cluster.local:636\" -D \"$admin_dn\" -w \"$password\"" \
            | grep -q "dn:${admin_dn}"
          echo "PASS: a client trusting only the new CA can still bind"

          # The actual proof the old CA was dropped, not just left unused:
          # a client that trusts *only* the retired CA must now be refused.
          # Assert against a raw TLS handshake (openssl s_client) rather than
          # ldapwhoami, since openssl's own "verify error:num=...:reason"
          # line is a deterministic signal that verification specifically
          # failed (vs. libldap's less consistent error text).
          #
          # `kubectl exec` needs -i to forward local stdin into the
          # container — same gotcha as `docker exec -i` documented in this
          # repo's CLAUDE.md. Without it this cat silently wrote an empty
          # file, so openssl failed immediately on "no certificate or crl
          # found" before ever attempting the handshake this step exists to
          # test — a false pass in disguise, not the real assertion.
          kubectl -n directory exec -i directory-ldapium-0 -c openldap -- sh -c "cat > /tmp/old-ca-only.crt" < "$dir/ca.crt"
          if kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            "openssl s_client -connect directory-ldapium.directory.svc.cluster.local:636 -CAfile /tmp/old-ca-only.crt -verify_return_error </dev/null" \
            >/tmp/tls-evidence/old-ca-rejected.txt 2>&1; then
            echo "::error::a TLS handshake trusting only the retired CA unexpectedly succeeded — the old CA was never actually dropped"
            cat /tmp/tls-evidence/old-ca-rejected.txt
            exit 1
          fi
          cat /tmp/tls-evidence/old-ca-rejected.txt
          grep -q 'verify error' /tmp/tls-evidence/old-ca-rejected.txt
          echo "PASS: the retired CA is genuinely no longer trusted"

      - name: Collect TLS evidence
        if: always()
        run: |
          set -uo pipefail
          mkdir -p /tmp/tls-evidence
          date -u +%FT%TZ > /tmp/tls-evidence/collected-at.txt
          kubectl -n directory get pods -o wide > /tmp/tls-evidence/pods.txt 2>&1 || true
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'ldapsearch -x -LLL -H ldapi://%2Fvar%2Flib%2Fopenldap%2Frun%2Fldapi -D "cn=admin,cn=config" -w "$LDAP_ADMIN_PASSWORD" -b "cn=config" -s base olcTLSCertificateFile olcTLSCertificateKeyFile olcTLSCACertificateFile' \
            > /tmp/tls-evidence/tls-config.txt 2>&1 || true
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'openssl s_client -connect directory-ldapium.directory.svc.cluster.local:636 -CAfile /etc/openldap/tls/ca.crt </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -serial -dates -ext subjectAltName' \
            > /tmp/tls-evidence/served-certificate.txt 2>&1 || true
      - name: Upload TLS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tls-evidence-${{ matrix.scenario }}
          path: /tmp/tls-evidence/*
          if-no-files-found: error
          retention-days: 14
      # --logs is the whole point: without it a failure reports only that the
      # test pod exited non-zero. Requiring the report to actually appear keeps
      # a silent regression in log retrieval from reading as a passing test.
      - name: Run helm test
        run: |
          set -euo pipefail
          helm test directory --namespace directory --logs 2>&1 | tee /tmp/helm-test.log
          # The script's own final line, printed only after every check passed.
          # Matching a per-check PASS instead would be satisfied by the first
          # one, which is not the question being asked here.
          grep -q 'all checks passed' /tmp/helm-test.log
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n directory get pods -o wide
          kubectl -n directory describe pods
          for pod in $(kubectl -n directory get pods -o name); do
            echo "::group::logs $pod"
            kubectl -n directory logs "$pod" --all-containers --tail=300 || true
            kubectl -n directory logs "$pod" --all-containers --previous --tail=300 || true
            echo "::endgroup::"
          done
          kubectl -n directory get events --sort-by=.lastTimestamp | tail -60
      - name: Uninstall
        if: always()
        run: helm uninstall directory --namespace directory || true
