name: E2E (kind)

# Installs the chart into throwaway kind clusters and runs helm tests.
# The TLS matrix additionally proves LDAPS and, for replicated installs,
# that syncrepl is configured over ldaps:// with strict CA verification.

on:
  pull_request:
    paths:
      - "image/**"
      - "charts/**"
      - "ui/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: install + helm test (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: standalone
            replicas: 1
          - scenario: replicated
            replicas: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build server image
        run: docker build -t ldapium:e2e image
      - name: Build UI image
        run: docker build -t ldapium-ui:e2e ui
      - name: Create cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: e2e
      - name: Load images into the cluster
        run: |
          kind load docker-image ldapium:e2e --name e2e
          kind load docker-image ldapium-ui:e2e --name e2e
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install chart
        run: |
          helm install directory charts/ldapium \
            --namespace directory --create-namespace \
            --set image.repository=ldapium \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --set-string 'ldap.adminDN=cn=admin\,dc=example\,dc=org' \
            --set auth.adminPassword="$(head -c 24 /dev/urandom | base64)" \
            --set ui.enabled=true \
            --set ui.image.repository=ldapium-ui \
            --set ui.image.tag=e2e \
            --set ui.image.pullPolicy=Never \
            --set replicaCount=${{ matrix.replicas }} \
            --wait --timeout 5m
      - name: Run helm test
        run: helm test directory --namespace directory --logs
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n directory get pods -o wide
          kubectl -n directory describe pods
          for pod in $(kubectl -n directory get pods -o name); do
            echo "::group::logs $pod"
            kubectl -n directory logs "$pod" --all-containers --tail=200 || true
            kubectl -n directory logs "$pod" --all-containers --previous --tail=200 || true
            echo "::endgroup::"
          done
          kubectl -n directory get events --sort-by=.lastTimestamp | tail -40
      - name: Uninstall
        if: always()
        run: helm uninstall directory --namespace directory || true

  tls:
    name: TLS E2E (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: standalone
            replicas: 1
          - scenario: replicated
            replicas: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build server image
        run: docker build -t ldapium:e2e image
      - name: Build UI image
        run: docker build -t ldapium-ui:e2e ui
      - name: Create cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: e2e
      - name: Load images into the cluster
        run: |
          kind load docker-image ldapium:e2e --name e2e
          kind load docker-image ldapium-ui:e2e --name e2e
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Generate test CA and server certificate
        run: |
          set -euo pipefail
          mkdir -p /tmp/ldapium-tls
          openssl genrsa -out /tmp/ldapium-tls/ca.key 2048
          openssl req -x509 -new -nodes -key /tmp/ldapium-tls/ca.key -sha256 -days 1 -subj "/CN=ldapium-e2e-ca" -out /tmp/ldapium-tls/ca.crt
          cat >/tmp/ldapium-tls/server.cnf <<'EOF'
          [req]
          distinguished_name = req_dn
          req_extensions = req_ext
          prompt = no
          [req_dn]
          CN = directory-ldapium.directory.svc.cluster.local
          [req_ext]
          subjectAltName = @alt_names
          [alt_names]
          DNS.1 = directory-ldapium.directory.svc.cluster.local
          DNS.2 = *.directory-ldapium-headless.directory.svc.cluster.local
          EOF
          openssl genrsa -out /tmp/ldapium-tls/tls.key 2048
          openssl req -new -key /tmp/ldapium-tls/tls.key -out /tmp/ldapium-tls/server.csr -config /tmp/ldapium-tls/server.cnf
          openssl x509 -req -in /tmp/ldapium-tls/server.csr -CA /tmp/ldapium-tls/ca.crt -CAkey /tmp/ldapium-tls/ca.key -CAcreateserial -out /tmp/ldapium-tls/tls.crt -days 1 -sha256 -extensions req_ext -extfile /tmp/ldapium-tls/server.cnf
      - name: Set up TLS Secret
        run: |
          kubectl create namespace directory
          kubectl -n directory create secret generic ldapium-tls \
            --from-file=tls.crt=/tmp/ldapium-tls/tls.crt \
            --from-file=tls.key=/tmp/ldapium-tls/tls.key \
            --from-file=ca.crt=/tmp/ldapium-tls/ca.crt
      - name: Install TLS chart
        run: |
          set -euo pipefail
          helm install directory charts/ldapium \
            --namespace directory \
            --set image.repository=ldapium \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --set-string 'ldap.adminDN=cn=admin\,dc=example\,dc=org' \
            --set auth.adminPassword="$(head -c 24 /dev/urandom | base64)" \
            --set ui.enabled=false \
            --set replicaCount=${{ matrix.replicas }} \
            --set tls.enabled=true \
            --set tls.existingSecret=ldapium-tls \
            --set tls.caFile=/etc/openldap/tls/ca.crt \
            --wait --timeout 5m
      - name: Verify LDAPS and strict certificate validation
        env:
          REPLICAS: ${{ matrix.replicas }}
        run: |
          set -euo pipefail
          admin_dn="cn=admin,dc=example,dc=org"
          service_host="directory-ldapium.directory.svc.cluster.local"
          ldap_base="dc=example,dc=org"
          password=$(kubectl -n directory get secret directory-ldapium-admin -o jsonpath='{.data.admin-password}' | base64 -d)
          echo "Checking LDAPS authenticated bind..."
          kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/etc/openldap/tls/ca.crt ldapwhoami -x -H "ldaps://directory-ldapium.directory.svc.cluster.local:636" -D "cn=admin,dc=example,dc=org" -w "$LDAP_ADMIN_PASSWORD"'
          echo "Checking invalid CA is rejected..."
          if kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'printf "%s\n" invalid-ca > /tmp/bad-ca.pem; LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/tmp/bad-ca.pem ldapwhoami -x -H "ldaps://directory-ldapium.directory.svc.cluster.local:636" -D "cn=admin,dc=example,dc=org" -w "$LDAP_ADMIN_PASSWORD"' >/tmp/bad-ca.out 2>&1; then
            echo "::error::LDAP bind unexpectedly succeeded with an invalid CA"
            cat /tmp/bad-ca.out
            exit 1
          else
            echo "PASS: invalid CA rejected"
          fi
          echo "Checking hostname mismatch is rejected..."
          if kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
            'LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/etc/openldap/tls/ca.crt ldapwhoami -x -H "ldaps://directory-ldapium:636" -D "cn=admin,dc=example,dc=org" -w "$LDAP_ADMIN_PASSWORD"' >/tmp/bad-san.out 2>&1; then
            echo "::error::LDAP bind unexpectedly succeeded with a hostname mismatch"
            cat /tmp/bad-san.out
            exit 1
          else
            echo "PASS: hostname mismatch rejected"
          fi
          if [ "$REPLICAS" -ge 2 ]; then
            echo "Checking syncrepl uses ldaps:// and not plaintext..."
            kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
              'LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/etc/openldap/tls/ca.crt ldapsearch -x -LLL -H ldapi://%2Fvar%2Flib%2Fopenldap%2Frun%2Fldapi -D "cn=admin,cn=config" -w "$LDAP_ADMIN_PASSWORD" -b "olcDatabase={1}mdb,cn=config" -s base olcSyncrepl' \
              | tee /tmp/syncrepl.txt
            grep -q 'provider=ldaps://' /tmp/syncrepl.txt
            if grep -q 'provider=ldap://' /tmp/syncrepl.txt; then
              echo "::error::plaintext LDAP replication provider detected"
              exit 1
            fi
            echo "Creating a test entry through LDAPS on provider 0..."
            kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
              'LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/etc/openldap/tls/ca.crt ldapadd -x -H "ldaps://directory-ldapium-0.directory-ldapium-headless.directory.svc.cluster.local:636" -D "cn=admin,dc=example,dc=org" -w "$LDAP_ADMIN_PASSWORD" <<EOF
          dn: uid=tls-e2e,dc=example,dc=org
          objectClass: inetOrgPerson
          uid: tls-e2e
          cn: tls e2e
          sn: e2e
          EOF'
            for ordinal in 1 2; do
              echo "Checking replicated entry on provider $ordinal over LDAPS..."
              kubectl -n directory exec directory-ldapium-0 -c openldap -- sh -c \
                "i=0; until LDAPTLS_REQCERT=demand LDAPTLS_CACERT=/etc/openldap/tls/ca.crt ldapsearch -x -LLL -H \"ldaps://directory-ldapium-${ordinal}.directory-ldapium-headless.directory.svc.cluster.local:636\" -D \"$admin_dn\" -w \"$password\" -b \"uid=tls-e2e,$ldap_base\" -s base dn >/dev/null 2>&1; do i=\$((i+1)); [ \"\$i\" -lt 30 ] || exit 1; sleep 2; done"
              echo "PASS: provider $ordinal converged over LDAPS"
            done
          fi
      - name: Run helm test
        run: helm test directory --namespace directory --logs
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n directory get pods -o wide
          kubectl -n directory describe pods
          for pod in $(kubectl -n directory get pods -o name); do
            echo "::group::logs $pod"
            kubectl -n directory logs "$pod" --all-containers --tail=300 || true
            kubectl -n directory logs "$pod" --all-containers --previous --tail=300 || true
            echo "::endgroup::"
          done
          kubectl -n directory get events --sort-by=.lastTimestamp | tail -60
      - name: Uninstall
        if: always()
        run: helm uninstall directory --namespace directory || true
