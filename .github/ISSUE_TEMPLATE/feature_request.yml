name: Feature request
description: Suggest a capability this project should have
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Two things this project deliberately will not do, so you can save
        yourself the writeup:

        - **Ship sample data or a default admin password.** A fresh directory
          contains the base DN and the admin entry, and nothing starts without
          an explicitly supplied password.
        - **Give the UI its own service account** to reach `cn=config`. Every
          session binds as the logged-in user, so the directory's ACLs decide
          what it can do. (SSO is the one exception; a token has no password
          to bind with.)

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The situation you are in, not the feature you have in mind for it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
