# Path-scoped Trivy misconfiguration suppressions. Scoped to the exact file so
# a real regression in a published image's Dockerfile is never hidden.
misconfigurations:
  - id: DS-0002 # "Image user should not be 'root'"
    paths:
      - "tests/sssd-client/Dockerfile"
    statement: >-
      SSSD must run as root: its daemon reads /etc/sssd/sssd.conf (mode 0600),
      manages /var/lib/sss, and serves NSS over a privileged socket. This is a
      disposable CI-only client that proves getent/id resolution against the
      directory (.github/workflows/sssd-e2e.yml); it is never built or
      published as a product image. The server and UI images still run
      unprivileged and are not covered by this suppression.
  - id: DS-0026 # "No HEALTHCHECK defined"
    paths:
      - "tests/sssd-client/Dockerfile"
    statement: >-
      A one-shot CI client that runs a check script to completion and exits; a
      container HEALTHCHECK has no meaning for a Pod that is expected to run to
      completion, not stay up.
