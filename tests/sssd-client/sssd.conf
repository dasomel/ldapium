[sssd]
config_file_version = 2
services = nss
domains = ldapium

[nss]

[domain/ldapium]
id_provider = ldap
ldap_uri = ldap://directory-ldapium.directory.svc.cluster.local:389
ldap_search_base = dc=example,dc=org
ldap_schema = rfc2307
ldap_id_use_start_tls = false
ldap_referrals = false
cache_credentials = false
enumerate = false
# The default anonymous ACL purposefully does not expose POSIX attributes.
# This disposable CI identity is only a directory search bind, not a PAM test.
ldap_default_bind_dn = cn=admin,dc=example,dc=org
ldap_default_authtok_type = password
ldap_default_authtok = sssd-e2e-password
